<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音乐播放器设置</title>
<link href="/css/theme-overrides.css" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--theme-text);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.card{
  width:100%;max-width:460px;
  background:var(--theme-surface-strong,rgba(255,255,255,0.88));
  backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  border:1px solid var(--theme-border,rgba(123,164,220,0.22));
  border-radius:var(--theme-radius-lg,24px);
  box-shadow:var(--theme-shadow,0 18px 50px rgba(44,88,140,0.12));
  overflow:hidden;z-index:1;
}
.card-header{
  background:linear-gradient(135deg,var(--theme-primary,#348fff) 0%,var(--theme-primary-strong,#2468ea) 52%,#3fbfe8 100%);
  padding:24px 28px 20px;color:#fff;position:relative;overflow:hidden;
}
.card-header::after{
  content:"";position:absolute;top:-40%;right:-20%;width:180px;height:180px;
  background:radial-gradient(circle,rgba(255,255,255,0.12),transparent 70%);border-radius:50%;
}
.card-header h1{font-size:20px;font-weight:700;position:relative;z-index:1}
.card-header p{font-size:13px;opacity:0.85;margin-top:4px;position:relative;z-index:1}
.card-body{padding:28px}
.form-group{margin-bottom:22px}
.form-label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.form-hint{font-size:12px;color:var(--theme-text-muted,#5f7992);margin-top:6px;line-height:1.5}

.toggle-row{display:flex;align-items:center;gap:12px}
.toggle{
  position:relative;width:50px;height:26px;border-radius:999px;
  background:rgba(52,143,255,0.12);border:1px solid var(--theme-border,rgba(123,164,220,0.22));
  cursor:pointer;transition:all 0.3s;flex-shrink:0;
}
.toggle.on{background:linear-gradient(135deg,var(--theme-primary,#348fff),var(--theme-accent,#37c6b6));border-color:transparent}
.toggle .knob{
  position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.15);transition:transform 0.3s;
}
.toggle.on .knob{transform:translateX(24px)}
.toggle-text{font-size:14px}

.form-input{
  width:100%;padding:10px 14px;
  border-radius:var(--theme-radius-sm,14px);
  border:1px solid var(--theme-border,rgba(123,164,220,0.22));
  background:var(--theme-surface,rgba(255,255,255,0.74));
  font-size:14px;color:var(--theme-text,#15314b);outline:none;
  transition:border-color 0.22s,box-shadow 0.22s;
  font-family:inherit;
  backdrop-filter:blur(22px) saturate(150%);
}
.form-input:focus{
  border-color:rgba(52,143,255,0.34);
  box-shadow:0 0 0 4px rgba(52,143,255,0.12),0 18px 40px rgba(36,104,234,0.14);
}
.form-input:disabled{opacity:0.5;cursor:not-allowed}

.btn-row{display:flex;gap:12px;margin-top:28px}
.btn{
  flex:1;padding:12px 20px;border-radius:999px;border:none;
  font-size:14px;font-weight:600;cursor:pointer;
  transition:all 0.22s;font-family:inherit;text-align:center;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;
}
.btn-primary{
  background:linear-gradient(135deg,var(--theme-primary,#348fff),var(--theme-primary-strong,#2468ea),#3fbfe8);
  color:#fff;box-shadow:0 10px 24px rgba(36,104,234,0.15);
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(36,104,234,0.22)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-outline{
  background:rgba(255,255,255,0.72);color:var(--theme-text,#15314b);
  border:1px solid var(--theme-border,rgba(123,164,220,0.22));
  box-shadow:0 10px 24px rgba(36,104,234,0.06);
}
.btn-outline:hover{transform:translateY(-1px);border-color:var(--theme-border-strong,rgba(103,153,221,0.35))}

.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);
  padding:10px 24px;border-radius:999px;font-size:14px;z-index:9999;
  transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);
  backdrop-filter:blur(10px);color:#fff;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:linear-gradient(135deg,#37c6b6,#2a9d8f)}
.toast.err{background:linear-gradient(135deg,#e63946,#d62828)}

.auth-mask{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(15,36,63,0.32);backdrop-filter:blur(8px);z-index:100;
}
.auth-box{
  width:100%;max-width:360px;margin:24px;
  background:var(--theme-surface-strong,rgba(255,255,255,0.88));
  backdrop-filter:blur(28px) saturate(160%);
  border:1px solid var(--theme-border,rgba(123,164,220,0.22));
  border-radius:var(--theme-radius-lg,24px);
  box-shadow:var(--theme-shadow,0 18px 50px rgba(44,88,140,0.12));
  padding:32px;
}
.auth-box h2{font-size:18px;margin-bottom:20px;text-align:center}
.auth-box .form-group{margin-bottom:16px}
.hidden{display:none!important}

.status-dot{
  display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;
}
.status-dot.on{background:#37c6b6;box-shadow:0 0 6px rgba(55,198,182,0.5)}
.status-dot.off{background:#aaa}
</style>
</head>
<body>

<div class="auth-mask" id="authMask">
  <div class="auth-box">
    <h2>&#128274; 管理员登录</h2>
    <div class="form-group">
      <label class="form-label">用户名</label>
      <input class="form-input" type="text" id="authUser" autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-label">密码</label>
      <input class="form-input" type="password" id="authPass" autocomplete="current-password">
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="authBtn" style="flex:1">登录</button>
    </div>
  </div>
</div>

<div class="card hidden" id="settingsCard">
  <div class="card-header">
    <h1>&#127925; 音乐播放器设置</h1>
    <p>配置音乐播放器功能</p>
  </div>
  <div class="card-body">
    <div class="form-group">
      <label class="form-label">启用音乐播放器</label>
      <div class="toggle-row">
        <div class="toggle" id="toggleEnabled"><div class="knob"></div></div>
        <span class="toggle-text" id="toggleText"><span class="status-dot off" id="statusDot"></span>已关闭</span>
      </div>
      <div class="form-hint">开启后，用户可通过 <code>/music</code> 路径访问音乐播放器页面</div>
    </div>

    <div class="form-group">
      <label class="form-label">音乐文件目录</label>
      <input class="form-input" type="text" id="musicDir" placeholder="例如：music 或 music/favorites">
      <div class="form-hint">
        指定存放音频文件的上传目录名称。留空则从根目录读取所有音频文件。<br>
        支持子目录递归读取。仅会列出 audio 类型的文件。
      </div>
    </div>

    <div class="btn-row">
      <a href="/music" class="btn btn-outline" id="previewBtn" target="_blank">&#127911; 预览播放器</a>
      <button class="btn btn-primary" id="saveBtn">&#128190; 保存设置</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var authHeader = '';
  var config = {};
  var othersConfig = {};
  var $ = function(id){return document.getElementById(id)};

  function toast(msg, type){
    var el = $('toast');
    el.textContent = msg;
    el.className = 'toast ' + (type||'') + ' show';
    setTimeout(function(){el.classList.remove('show')}, 2200);
  }

  // 尝试加载配置
  function loadConfig(header){
    return fetch('/api/manage/sysConfig/others', {
      headers: header ? {'Authorization': header} : {}
    }).then(function(r){
      if(r.status === 401) return {needAuth:true};
      if(!r.ok) throw new Error('加载失败');
      return r.json().then(function(d){return {needAuth:false, data:d}});
    });
  }

  // 保存配置
  function saveConfig(){
    // 更新 musicPlayer 部分
    othersConfig.musicPlayer = {
      enabled: config.enabled,
      musicDir: config.musicDir
    };

    fetch('/api/manage/sysConfig/others', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':authHeader},
      body: JSON.stringify(othersConfig)
    }).then(function(r){
      if(!r.ok) throw new Error('保存失败');
      toast('保存成功！','ok');
    }).catch(function(e){
      toast(e.message,'err');
    });
  }

  function updateUI(){
    var on = config.enabled;
    var toggle = $('toggleEnabled');
    var text = $('toggleText');
    var dot = $('statusDot');

    if(on){
      toggle.classList.add('on');
      dot.className = 'status-dot on';
      text.innerHTML = '<span class="status-dot on"></span>已开启';
    } else {
      toggle.classList.remove('on');
      dot.className = 'status-dot off';
      text.innerHTML = '<span class="status-dot off"></span>已关闭';
    }
    $('musicDir').value = config.musicDir || '';
  }

  function bindEvents(){
    $('toggleEnabled').addEventListener('click',function(){
      config.enabled = !config.enabled;
      updateUI();
    });
    $('musicDir').addEventListener('input',function(){
      config.musicDir = this.value.trim();
    });
    $('saveBtn').addEventListener('click', saveConfig);
  }

  function showSettings(data){
    othersConfig = data;
    var mp = data.musicPlayer || {};
    config = {
      enabled: mp.enabled || false,
      musicDir: mp.musicDir || ''
    };
    $('authMask').classList.add('hidden');
    $('settingsCard').classList.remove('hidden');
    updateUI();
    bindEvents();
  }

  // 初始化认证流程
  function init(){
    // 先尝试无认证（可能未设密码）
    loadConfig('').then(function(res){
      if(!res.needAuth){showSettings(res.data);return;}

      // 尝试 localStorage 缓存的凭据
      var saved = localStorage.getItem('imgbed_admin_auth');
      if(saved){
        return loadConfig(saved).then(function(res2){
          if(!res2.needAuth){authHeader=saved;showSettings(res2.data);return;}
          showAuthForm();
        });
      }
      showAuthForm();
    }).catch(function(){showAuthForm()});
  }

  function showAuthForm(){
    $('authMask').classList.remove('hidden');

    function doLogin(){
      var u=$('authUser').value, p=$('authPass').value;
      if(!u||!p){toast('请输入用户名和密码','err');return;}
      var h = 'Basic ' + btoa(u+':'+p);
      loadConfig(h).then(function(res){
        if(res.needAuth){toast('用户名或密码错误','err');return;}
        authHeader = h;
        localStorage.setItem('imgbed_admin_auth', h);
        showSettings(res.data);
      }).catch(function(){toast('登录失败','err')});
    }

    $('authBtn').addEventListener('click', doLogin);
    $('authPass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
    $('authUser').addEventListener('keydown',function(e){if(e.key==='Enter')$('authPass').focus()});
  }

  init();
})();
</script>
</body>
</html>

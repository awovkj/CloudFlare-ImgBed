<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件统计</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="/css/theme-overrides.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --fabric-bg: #f5f1e8;
            --fabric-bg-warm: #e8dfd1;
            --fabric-surface: rgba(255,255,255,0.92);
            --fabric-surface-soft: rgba(255,255,255,0.85);
            --fabric-border: rgba(180,160,130,0.18);
            --fabric-text: #2f2f2f;
            --fabric-muted: #6b6b6b;
            --fabric-accent: #8b7355;
            --fabric-accent-warm: #a08060;
            --fabric-shadow: 0 4px 12px rgba(80,60,40,0.06);
            --fabric-shadow-lg: 0 8px 24px rgba(80,60,40,0.08);
            --fabric-shadow-hover: 0 12px 32px rgba(80,60,40,0.1);
            --fabric-radius-sm: 8px;
            --fabric-radius-md: 12px;
            --fabric-radius-lg: 16px;
            --fabric-radius-xl: 20px;
            --fabric-transition: 200ms ease;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--fabric-bg);
            color: var(--fabric-text);
            padding: 28px 20px 36px;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(180,160,130,0.015) 2px,rgba(180,160,130,0.015) 4px),
                repeating-linear-gradient(90deg,transparent,transparent 2px,rgba(180,160,130,0.015) 2px,rgba(180,160,130,0.015) 4px);
            opacity: 0.7;
            z-index: 0;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
        }

        .stats-card {
            position: relative;
            overflow: hidden;
            background: var(--fabric-surface);
            border: 1px dashed var(--fabric-border);
            border-radius: var(--fabric-radius-xl);
            padding: 32px;
            margin-bottom: 20px;
            box-shadow: var(--fabric-shadow-lg);
        }

        .stats-card::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255,255,255,0.4), transparent 50%);
            border-radius: inherit;
        }

        .header {
            text-align: center;
            margin-bottom: 34px;
            position: relative;
            z-index: 1;
        }

        .header h1 {
            color: var(--fabric-text);
            font-size: clamp(30px, 4vw, 42px);
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .header p {
            color: var(--fabric-muted);
            font-size: 15px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 34px;
            position: relative;
            z-index: 1;
        }

        .summary-item {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #a08060 0%, #8b7355 100%);
            padding: 24px 20px;
            border-radius: var(--fabric-radius-lg);
            color: white;
            text-align: center;
            box-shadow: var(--fabric-shadow);
            border: 1px dashed rgba(255,255,255,0.2);
        }

        .summary-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent 60%);
        }

        .summary-item.alt {
            background: linear-gradient(135deg, #8b7355 0%, #a08060 100%);
        }

        .summary-item.alt2 {
            background: linear-gradient(135deg, #7a6650 0%, #8b7355 100%);
        }

        .summary-value {
            position: relative;
            z-index: 1;
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.04em;
        }

        .summary-label {
            position: relative;
            z-index: 1;
            font-size: 13px;
            opacity: 0.92;
            text-transform: uppercase;
            letter-spacing: 0.16em;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .chart-container {
            background: var(--fabric-surface);
            border-radius: var(--fabric-radius-lg);
            padding: 22px;
            box-shadow: var(--fabric-shadow);
            border: 1px dashed var(--fabric-border);
        }

        .chart-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--fabric-text);
            margin-bottom: 18px;
            text-align: center;
        }

        .chart-wrapper {
            position: relative;
            height: 300px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--fabric-text);
            font-size: 18px;
            position: relative;
            z-index: 1;
        }

        .error {
            background: rgba(180,140,100,0.1);
            padding: 16px;
            border-radius: var(--fabric-radius-md);
            text-align: center;
            color: #8b5a3c;
            border: 1px dashed rgba(180,140,100,0.3);
            position: relative;
            z-index: 1;
        }

        .refresh-btn {
            background: var(--fabric-surface);
            color: var(--fabric-text);
            border: 1px dashed var(--fabric-border);
            padding: 14px 26px;
            border-radius: var(--fabric-radius-sm);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: block;
            margin: 0 auto 24px;
            transition: transform var(--fabric-transition), box-shadow var(--fabric-transition), background var(--fabric-transition);
            box-shadow: var(--fabric-shadow);
            position: relative;
            z-index: 1;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--fabric-shadow-hover);
            background: rgba(255,255,255,0.98);
        }

        .refresh-btn:active {
            transform: translateY(1px);
            box-shadow: var(--fabric-shadow);
        }

        .table-container {
            overflow-x: auto;
            margin-top: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color: var(--fabric-text);
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px dashed var(--fabric-border);
        }

        th {
            background: rgba(139,115,85,0.08);
            font-weight: 700;
            color: var(--fabric-text);
        }

        tr:hover {
            background: rgba(139,115,85,0.05);
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: var(--fabric-radius-sm);
            font-size: 12px;
            font-weight: 700;
            background: linear-gradient(135deg, #a08060 0%, #8b7355 100%);
            color: white;
            box-shadow: var(--fabric-shadow);
        }

        @media (max-width: 768px) {
            body {
                padding: 16px 14px 24px;
            }

            .stats-card {
                padding: 20px;
                border-radius: var(--fabric-radius-lg);
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }
            
            .summary-grid {
                grid-template-columns: 1fr;
            }

            .chart-container {
                padding: 18px;
                border-radius: var(--fabric-radius-md);
            }

            .header h1 {
                font-size: 28px;
            }

            .chart-wrapper {
                height: 260px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="stats-card">
            <div class="header">
                <h1>📊 文件存储统计</h1>
                <p>实时统计已保存文件的类型与大小分布</p>
            </div>

            <button type="button" class="refresh-btn" onclick="loadStats()">🔄 刷新数据</button>

            <div id="loading" class="loading">正在加载数据...</div>
            <div id="error" class="error" style="display: none;"></div>

            <div id="content" style="display: none;">
                <div class="summary-grid">
                    <div class="summary-item">
                        <div class="summary-value" id="totalFiles">0</div>
                        <div class="summary-label">总文件数</div>
                    </div>
                    <div class="summary-item alt">
                        <div class="summary-value" id="totalSize">0 MB</div>
                        <div class="summary-label">总存储大小</div>
                    </div>
                    <div class="summary-item alt2">
                        <div class="summary-value" id="avgSize">0 MB</div>
                        <div class="summary-label">平均文件大小</div>
                    </div>
                </div>

                <div class="charts-grid">
                    <div class="chart-container">
                        <h3 class="chart-title">文件类型分布（数量）</h3>
                        <div class="chart-wrapper">
                            <canvas id="typeCountChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-container">
                        <h3 class="chart-title">文件类型分布（大小）</h3>
                        <div class="chart-wrapper">
                            <canvas id="typeSizeChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-container">
                        <h3 class="chart-title">存储渠道分布（数量）</h3>
                        <div class="chart-wrapper">
                            <canvas id="channelCountChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-container">
                        <h3 class="chart-title">存储渠道分布（大小）</h3>
                        <div class="chart-wrapper">
                            <canvas id="channelSizeChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="chart-container">
                    <h3 class="chart-title">文件类型详细统计</h3>
                    <div class="table-container">
                        <table id="typeTable">
                            <thead>
                                <tr>
                                    <th>文件类型</th>
                                    <th>数量</th>
                                    <th>总大小 (MB)</th>
                                    <th>平均大小 (MB)</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const charts = {};
        let statsAbortController = null;

        // 生成随机颜色
        function generateColors(count) {
            const colors = [
                '#667eea', '#764ba2', '#f093fb', '#f5576c',
                '#4facfe', '#00f2fe', '#43e97b', '#38f9d7',
                '#fa709a', '#fee140', '#30cfd0', '#330867',
                '#a8edea', '#fed6e3', '#ff6b6b', '#4ecdc4'
            ];
            
            const result = [];
            for (let i = 0; i < count; i++) {
                result.push(colors[i % colors.length]);
            }
            return result;
        }

        // 创建图表
        function createChart(canvasId, type, labels, data, label) {
            const ctx = document.getElementById(canvasId);
            
            if (charts[canvasId]) {
                charts[canvasId].destroy();
            }

            const colors = generateColors(labels.length);

            charts[canvasId] = new Chart(ctx, {
                type: type,
                data: {
                    labels: labels,
                    datasets: [{
                        label: label,
                        data: data,
                        backgroundColor: colors,
                        borderColor: colors.map(c => `${c}dd`),
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: type === 'pie' || type === 'doughnut',
                            position: 'bottom'
                        }
                    },
                    scales: type === 'bar' ? {
                        y: {
                            beginAtZero: true
                        }
                    } : undefined
                }
            });
        }

        // 加载统计数据
        async function loadStats() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const content = document.getElementById('content');

            if (statsAbortController) {
                statsAbortController.abort();
            }
            statsAbortController = new AbortController();

            loading.style.display = 'block';
            error.style.display = 'none';
            content.style.display = 'none';

            try {
                const response = await fetch('/api/manage/stats', {
                    signal: statsAbortController.signal,
                    cache: 'no-store'
                });
                if (!response.ok) {
                    throw new Error('获取数据失败');
                }

                const stats = await response.json();

                // 更新汇总信息
                document.getElementById('totalFiles').textContent = stats.totalFiles.toLocaleString();
                document.getElementById('totalSize').textContent = `${stats.totalSize.toLocaleString()} MB`;
                const avgSize = stats.totalFiles > 0 ? (stats.totalSize / stats.totalFiles).toFixed(2) : 0;
                document.getElementById('avgSize').textContent = `${avgSize} MB`;

                // 限制显示前10项
                const topFileTypes = stats.fileTypesList.filter(item => item.count > 0).slice(0, 10);
                const topChannels = stats.channelsList;

                // 创建文件类型图表
                createChart(
                    'typeCountChart',
                    'doughnut',
                    topFileTypes.map(item => item.ext.toUpperCase()),
                    topFileTypes.map(item => item.count),
                    '文件数量'
                );

                createChart(
                    'typeSizeChart',
                    'doughnut',
                    topFileTypes.map(item => item.ext.toUpperCase()),
                    topFileTypes.map(item => item.size),
                    '总大小 (MB)'
                );

                // 创建渠道图表
                createChart(
                    'channelCountChart',
                    'bar',
                    topChannels.map(item => item.channel),
                    topChannels.map(item => item.count),
                    '文件数量'
                );

                createChart(
                    'channelSizeChart',
                    'bar',
                    topChannels.map(item => item.channel),
                    topChannels.map(item => item.size),
                    '总大小 (MB)'
                );

                // 填充表格
                const tbody = document.querySelector('#typeTable tbody');
                tbody.innerHTML = '';
                stats.fileTypesList.forEach(item => {
                    const row = tbody.insertRow();
                    const avgTypeSize = item.count > 0 ? (item.size / item.count).toFixed(2) : '0.00';
                    row.innerHTML = `
                        <td><span class="badge">${item.ext.toUpperCase()}</span></td>
                        <td>${item.count.toLocaleString()}</td>
                        <td>${item.size.toLocaleString()}</td>
                        <td>${avgTypeSize}</td>
                    `;
                });

                loading.style.display = 'none';
                content.style.display = 'block';

            } catch (err) {
                if (err.name === 'AbortError') {
                    return;
                }
                console.error('Error loading stats:', err);
                loading.style.display = 'none';
                error.textContent = `加载数据失败: ${err.message || '未知错误'}`;
                error.style.display = 'block';
            } finally {
                statsAbortController = null;
            }
        }

        // 页面加载时自动获取数据
        loadStats();
    </script>
</body>
</html>

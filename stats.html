<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件统计</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --stats-bg: radial-gradient(circle at top left, rgba(94, 181, 255, 0.18), transparent 30%),
                radial-gradient(circle at 88% 10%, rgba(55, 198, 182, 0.16), transparent 26%),
                linear-gradient(180deg, #eef5ff 0%, #f6fbff 100%);
            --stats-surface: rgba(255, 255, 255, 0.78);
            --stats-surface-strong: rgba(255, 255, 255, 0.92);
            --stats-border: rgba(113, 158, 220, 0.18);
            --stats-border-hover: rgba(113, 158, 220, 0.28);
            --stats-text: #183450;
            --stats-muted: #627d96;
            --stats-primary: #2f89ff;
            --stats-primary-2: #37c6b6;
            --stats-success: #22c55e;
            --stats-warning: #f59e0b;
            --stats-error: #ef4444;
            --stats-shadow: 0 24px 60px rgba(40, 91, 161, 0.12);
            --stats-shadow-hover: 0 28px 68px rgba(40, 91, 161, 0.16);
            --stats-blur: 24px;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--stats-bg);
            color: var(--stats-text);
            padding: 24px 20px 36px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
        }

        .stats-card {
            position: relative;
            overflow: hidden;
            background: var(--stats-surface);
            border: 1px solid var(--stats-border);
            border-radius: 28px;
            padding: 32px;
            margin-bottom: 20px;
            box-shadow: var(--stats-shadow);
            backdrop-filter: blur(var(--stats-blur)) saturate(160%);
            -webkit-backdrop-filter: blur(var(--stats-blur)) saturate(160%);
            transition: transform var(--ease) 0.3s, box-shadow var(--ease) 0.3s;
        }

        .stats-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--stats-shadow-hover);
        }

        .stats-card::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.38), transparent 38%, rgba(55, 198, 182, 0.08));
        }

        .header {
            text-align: center;
            margin-bottom: 34px;
            position: relative;
            z-index: 1;
        }

        .header h1 {
            color: var(--stats-text);
            font-size: clamp(30px, 4vw, 42px);
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .header p {
            color: var(--stats-muted);
            font-size: 15px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 34px;
            position: relative;
            z-index: 1;
        }

        .summary-item {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #2f89ff 0%, #2468ea 55%, #37c6b6 100%);
            padding: 24px 20px;
            border-radius: 22px;
            color: white;
            text-align: center;
            box-shadow: 0 20px 36px rgba(47, 137, 255, 0.24);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: transform var(--ease) 0.2s, box-shadow var(--ease) 0.2s;
        }

        .summary-item:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 24px 44px rgba(47, 137, 255, 0.3);
        }

        .summary-item:active {
            transform: translateY(-2px) scale(1);
        }

        .summary-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, rgba(255,255,255,0.3), transparent 36%);
        }

        .summary-item.alt {
            background: linear-gradient(135deg, #1d6ce0 0%, #3194ff 52%, #7ecbff 100%);
        }

        .summary-item.alt2 {
            background: linear-gradient(135deg, #1da6a0 0%, #37c6b6 55%, #8be7d8 100%);
        }

        .summary-value {
            position: relative;
            z-index: 1;
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.04em;
        }

        .summary-label {
            position: relative;
            z-index: 1;
            font-size: 13px;
            opacity: 0.92;
            text-transform: uppercase;
            letter-spacing: 0.16em;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .chart-container {
            background: var(--stats-surface-strong);
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 18px 34px rgba(38, 86, 150, 0.08);
            border: 1px solid rgba(113, 158, 220, 0.16);
            transition: transform var(--ease) 0.2s, box-shadow var(--ease) 0.2s;
        }

        .chart-container:hover {
            transform: translateY(-2px);
            box-shadow: 0 22px 42px rgba(38, 86, 150, 0.12);
        }

        .chart-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--stats-text);
            margin-bottom: 18px;
            text-align: center;
        }

        .chart-wrapper {
            position: relative;
            height: 300px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--stats-text);
            font-size: 18px;
            position: relative;
            z-index: 1;
        }

        .error {
            background: rgba(255, 86, 96, 0.14);
            padding: 16px;
            border-radius: 14px;
            text-align: center;
            color: #d13448;
            border: 1px solid rgba(209, 52, 72, 0.16);
            position: relative;
            z-index: 1;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #2f89ff 0%, #2468ea 55%, #37c6b6 100%);
            color: white;
            border: none;
            padding: 14px 26px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: block;
            margin: 0 auto 24px;
            transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
            box-shadow: 0 18px 30px rgba(36, 104, 234, 0.22);
            position: relative;
            z-index: 1;
        }

        .refresh-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 24px 38px rgba(36, 104, 234, 0.3);
        }

        .refresh-btn:active {
            transform: translateY(-1px) scale(1);
        }

        .table-container {
            overflow-x: auto;
            margin-top: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color: var(--stats-text);
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid rgba(113, 158, 220, 0.12);
        }

        th {
            background: rgba(47, 137, 255, 0.06);
            font-weight: 700;
            color: var(--stats-text);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.05em;
        }

        tr {
            transition: background var(--ease) 0.15s;
        }

        tr:hover {
            background: rgba(47, 137, 255, 0.05);
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            background: linear-gradient(135deg, #2f89ff 0%, #37c6b6 100%);
            color: white;
            box-shadow: 0 8px 18px rgba(47, 137, 255, 0.18);
            transition: transform var(--ease) 0.15s, box-shadow var(--ease) 0.15s;
        }

        .badge:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 22px rgba(47, 137, 255, 0.24);
        }

        @media (max-width: 768px) {
            body {
                padding: 16px 14px 24px;
            }

            .stats-card {
                padding: 20px;
                border-radius: 22px;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }
            
            .summary-grid {
                grid-template-columns: 1fr;
            }

            .chart-container {
                padding: 18px;
                border-radius: 20px;
            }

            .header h1 {
                font-size: 28px;
            }

            .chart-wrapper {
                height: 260px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="stats-card">
            <div class="header">
                <h1>📊 文件存储统计</h1>
                <p>实时统计已保存文件的类型与大小分布</p>
            </div>

            <button type="button" class="refresh-btn" onclick="loadStats()">🔄 刷新数据</button>

            <div id="loading" class="loading">正在加载数据...</div>
            <div id="error" class="error" style="display: none;"></div>

            <div id="content" style="display: none;">
                <div class="summary-grid">
                    <div class="summary-item">
                        <div class="summary-value" id="totalFiles">0</div>
                        <div class="summary-label">总文件数</div>
                    </div>
                    <div class="summary-item alt">
                        <div class="summary-value" id="totalSize">0 MB</div>
                        <div class="summary-label">总存储大小</div>
                    </div>
                    <div class="summary-item alt2">
                        <div class="summary-value" id="avgSize">0 MB</div>
                        <div class="summary-label">平均文件大小</div>
                    </div>
                </div>

                <div class="charts-grid">
                    <div class="chart-container">
                        <h3 class="chart-title">文件类型分布（数量）</h3>
                        <div class="chart-wrapper">
                            <canvas id="typeCountChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-container">
                        <h3 class="chart-title">文件类型分布（大小）</h3>
                        <div class="chart-wrapper">
                            <canvas id="typeSizeChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-container">
                        <h3 class="chart-title">存储渠道分布（数量）</h3>
                        <div class="chart-wrapper">
                            <canvas id="channelCountChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-container">
                        <h3 class="chart-title">存储渠道分布（大小）</h3>
                        <div class="chart-wrapper">
                            <canvas id="channelSizeChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="chart-container">
                    <h3 class="chart-title">文件类型详细统计</h3>
                    <div class="table-container">
                        <table id="typeTable">
                            <thead>
                                <tr>
                                    <th>文件类型</th>
                                    <th>数量</th>
                                    <th>总大小 (MB)</th>
                                    <th>平均大小 (MB)</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const charts = {};
        let statsAbortController = null;

        // 生成随机颜色
        function generateColors(count) {
            const colors = [
                '#667eea', '#764ba2', '#f093fb', '#f5576c',
                '#4facfe', '#00f2fe', '#43e97b', '#38f9d7',
                '#fa709a', '#fee140', '#30cfd0', '#330867',
                '#a8edea', '#fed6e3', '#ff6b6b', '#4ecdc4'
            ];
            
            const result = [];
            for (let i = 0; i < count; i++) {
                result.push(colors[i % colors.length]);
            }
            return result;
        }

        // 创建图表
        function createChart(canvasId, type, labels, data, label) {
            const ctx = document.getElementById(canvasId);
            
            if (charts[canvasId]) {
                charts[canvasId].destroy();
            }

            const colors = generateColors(labels.length);

            charts[canvasId] = new Chart(ctx, {
                type: type,
                data: {
                    labels: labels,
                    datasets: [{
                        label: label,
                        data: data,
                        backgroundColor: colors,
                        borderColor: colors.map(c => `${c}dd`),
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: type === 'pie' || type === 'doughnut',
                            position: 'bottom'
                        }
                    },
                    scales: type === 'bar' ? {
                        y: {
                            beginAtZero: true
                        }
                    } : undefined
                }
            });
        }

        // 加载统计数据
        async function loadStats() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const content = document.getElementById('content');

            if (statsAbortController) {
                statsAbortController.abort();
            }
            statsAbortController = new AbortController();

            loading.style.display = 'block';
            error.style.display = 'none';
            content.style.display = 'none';

            try {
                const response = await fetch('/api/site/storage-overview', {
                    signal: statsAbortController.signal,
                    cache: 'no-store'
                });
                if (!response.ok) {
                    throw new Error('获取数据失败');
                }

                const stats = await response.json();

                // 更新汇总信息
                document.getElementById('totalFiles').textContent = stats.totalFiles.toLocaleString();
                document.getElementById('totalSize').textContent = `${stats.totalSize.toLocaleString()} MB`;
                const avgSize = stats.totalFiles > 0 ? (stats.totalSize / stats.totalFiles).toFixed(2) : 0;
                document.getElementById('avgSize').textContent = `${avgSize} MB`;

                // 限制显示前10项
                const topFileTypes = stats.fileTypesList.filter(item => item.count > 0).slice(0, 10);
                const topChannels = stats.channelsList;

                // 创建文件类型图表
                createChart(
                    'typeCountChart',
                    'doughnut',
                    topFileTypes.map(item => item.ext.toUpperCase()),
                    topFileTypes.map(item => item.count),
                    '文件数量'
                );

                createChart(
                    'typeSizeChart',
                    'doughnut',
                    topFileTypes.map(item => item.ext.toUpperCase()),
                    topFileTypes.map(item => item.size),
                    '总大小 (MB)'
                );

                // 创建渠道图表
                createChart(
                    'channelCountChart',
                    'bar',
                    topChannels.map(item => item.channel),
                    topChannels.map(item => item.count),
                    '文件数量'
                );

                createChart(
                    'channelSizeChart',
                    'bar',
                    topChannels.map(item => item.channel),
                    topChannels.map(item => item.size),
                    '总大小 (MB)'
                );

                // 填充表格
                const tbody = document.querySelector('#typeTable tbody');
                tbody.innerHTML = '';
                stats.fileTypesList.forEach(item => {
                    const row = tbody.insertRow();
                    const avgTypeSize = item.count > 0 ? (item.size / item.count).toFixed(2) : '0.00';
                    row.innerHTML = `
                        <td><span class="badge">${item.ext.toUpperCase()}</span></td>
                        <td>${item.count.toLocaleString()}</td>
                        <td>${item.size.toLocaleString()}</td>
                        <td>${avgTypeSize}</td>
                    `;
                });

                loading.style.display = 'none';
                content.style.display = 'block';

            } catch (err) {
                if (err.name === 'AbortError') {
                    return;
                }
                console.error('Error loading stats:', err);
                loading.style.display = 'none';
                error.textContent = `加载数据失败: ${err.message || '未知错误'}`;
                error.style.display = 'block';
            } finally {
                statsAbortController = null;
            }
        }

        // 页面加载时自动获取数据
        loadStats();
    </script>
</body>
</html>

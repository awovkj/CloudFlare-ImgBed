<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件统计</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/css/theme-m3.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--md-font-sans);
            background: var(--md-hero-gradient), var(--md-background);
            color: var(--md-on-surface);
            padding: 24px 20px 36px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
        }

        .stats-card {
            position: relative;
            overflow: hidden;
            background: var(--md-surface-container-low);
            border: 1px solid var(--md-outline-variant);
            border-radius: var(--md-shape-xl);
            padding: 32px;
            margin-bottom: 20px;
            box-shadow: var(--md-elev-1);
            transition: box-shadow var(--md-duration-medium) var(--md-ease-standard);
        }

        .stats-card:hover {
            box-shadow: var(--md-elev-2);
        }

        .stats-card::before { display: none; }

        .header {
            text-align: center;
            margin-bottom: 34px;
            position: relative;
            z-index: 1;
        }

        .header h1 {
            color: var(--stats-text);
            font-size: clamp(30px, 4vw, 42px);
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .header p {
            color: var(--stats-muted);
            font-size: 15px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 34px;
            position: relative;
            z-index: 1;
        }

        .summary-item {
            position: relative;
            overflow: hidden;
            background: var(--md-primary);
            padding: 24px 20px;
            border-radius: var(--md-shape-lg);
            color: var(--md-on-primary);
            text-align: center;
            box-shadow: var(--md-elev-1);
            border: none;
            transition: box-shadow var(--md-duration-medium) var(--md-ease-standard);
        }

        .summary-item:hover {
            box-shadow: var(--md-elev-2);
        }

        .summary-item:active {
            box-shadow: var(--md-elev-1);
        }

        .summary-item::before { display: none; }

        .summary-item.alt { background: var(--md-secondary); color: var(--md-on-secondary); }
        .summary-item.alt2 { background: var(--md-tertiary); color: #ffffff; }

        .summary-value {
            position: relative;
            z-index: 1;
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.04em;
        }

        .summary-label {
            position: relative;
            z-index: 1;
            font-size: 13px;
            opacity: 0.92;
            text-transform: uppercase;
            letter-spacing: 0.16em;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .chart-container {
            background: var(--md-surface-container-lowest);
            border-radius: var(--md-shape-lg);
            padding: 22px;
            box-shadow: var(--md-elev-1);
            border: 1px solid var(--md-outline-variant);
            transition: box-shadow var(--md-duration-medium) var(--md-ease-standard);
        }

        .chart-container:hover {
            box-shadow: var(--md-elev-2);
        }

        .chart-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--stats-text);
            margin-bottom: 18px;
            text-align: center;
        }

        .chart-wrapper {
            position: relative;
            height: 300px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--stats-text);
            font-size: 18px;
            position: relative;
            z-index: 1;
        }

        .error {
            background: var(--md-error-container);
            padding: 16px;
            border-radius: var(--md-shape-md);
            text-align: center;
            color: var(--md-on-error-container);
            border: 1px solid var(--md-outline-variant);
            position: relative;
            z-index: 1;
        }

        .refresh-btn {
            background: var(--md-primary);
            color: var(--md-on-primary);
            border: none;
            padding: 14px 26px;
            border-radius: var(--md-shape-full);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: block;
            margin: 0 auto 24px;
            transition: box-shadow var(--md-duration-short) var(--md-ease-standard);
            box-shadow: var(--md-elev-1);
            position: relative;
            z-index: 1;
        }

        .refresh-btn:hover {
            box-shadow: var(--md-elev-2);
        }

        .refresh-btn:active {
            box-shadow: var(--md-elev-1);
        }

        .table-container {
            overflow-x: auto;
            margin-top: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color: var(--stats-text);
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid var(--md-outline-variant);
        }

        th {
            background: var(--md-surface-container-high);
            font-weight: 600;
            color: var(--md-on-surface-variant);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.05em;
        }

        tr {
            transition: background var(--md-duration-short) var(--md-ease-standard);
        }

        tr:hover {
            background: color-mix(in srgb, var(--md-primary) 6%, transparent);
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: var(--md-shape-full);
            font-size: 12px;
            font-weight: 600;
            background: var(--md-secondary-container);
            color: var(--md-on-secondary-container);
            box-shadow: none;
        }

        .badge:hover {
            background: color-mix(in srgb, var(--md-secondary) 24%, var(--md-secondary-container));
        }

        @media (max-width: 768px) {
            body {
                padding: 16px 14px 24px;
            }

            .stats-card {
                padding: 20px;
                border-radius: 22px;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }
            
            .summary-grid {
                grid-template-columns: 1fr;
            }

            .chart-container {
                padding: 18px;
                border-radius: 20px;
            }

            .header h1 {
                font-size: 28px;
            }

            .chart-wrapper {
                height: 260px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="stats-card">
            <div class="header">
                <h1>📊 文件存储统计</h1>
                <p>实时统计已保存文件的类型与大小分布</p>
            </div>

            <button type="button" class="refresh-btn" onclick="loadStats()">🔄 刷新数据</button>

            <div id="loading" class="loading">正在加载数据...</div>
            <div id="error" class="error" style="display: none;"></div>

            <div id="content" style="display: none;">
                <div class="summary-grid">
                    <div class="summary-item">
                        <div class="summary-value" id="totalFiles">0</div>
                        <div class="summary-label">总文件数</div>
                    </div>
                    <div class="summary-item alt">
                        <div class="summary-value" id="totalSize">0 MB</div>
                        <div class="summary-label">总存储大小</div>
                    </div>
                    <div class="summary-item alt2">
                        <div class="summary-value" id="avgSize">0 MB</div>
                        <div class="summary-label">平均文件大小</div>
                    </div>
                </div>

                <div class="charts-grid">
                    <div class="chart-container">
                        <h3 class="chart-title">文件类型分布（数量）</h3>
                        <div class="chart-wrapper">
                            <canvas id="typeCountChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-container">
                        <h3 class="chart-title">文件类型分布（大小）</h3>
                        <div class="chart-wrapper">
                            <canvas id="typeSizeChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-container">
                        <h3 class="chart-title">存储渠道分布（数量）</h3>
                        <div class="chart-wrapper">
                            <canvas id="channelCountChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-container">
                        <h3 class="chart-title">存储渠道分布（大小）</h3>
                        <div class="chart-wrapper">
                            <canvas id="channelSizeChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="chart-container">
                    <h3 class="chart-title">文件类型详细统计</h3>
                    <div class="table-container">
                        <table id="typeTable">
                            <thead>
                                <tr>
                                    <th>文件类型</th>
                                    <th>数量</th>
                                    <th>总大小 (MB)</th>
                                    <th>平均大小 (MB)</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const charts = {};
        let statsAbortController = null;

        // 生成随机颜色
        function generateColors(count) {
            const colors = [
                '#667eea', '#764ba2', '#f093fb', '#f5576c',
                '#4facfe', '#00f2fe', '#43e97b', '#38f9d7',
                '#fa709a', '#fee140', '#30cfd0', '#330867',
                '#a8edea', '#fed6e3', '#ff6b6b', '#4ecdc4'
            ];
            
            const result = [];
            for (let i = 0; i < count; i++) {
                result.push(colors[i % colors.length]);
            }
            return result;
        }

        // 创建图表
        function createChart(canvasId, type, labels, data, label) {
            const ctx = document.getElementById(canvasId);
            
            if (charts[canvasId]) {
                charts[canvasId].destroy();
            }

            const colors = generateColors(labels.length);

            charts[canvasId] = new Chart(ctx, {
                type: type,
                data: {
                    labels: labels,
                    datasets: [{
                        label: label,
                        data: data,
                        backgroundColor: colors,
                        borderColor: colors.map(c => `${c}dd`),
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: type === 'pie' || type === 'doughnut',
                            position: 'bottom'
                        }
                    },
                    scales: type === 'bar' ? {
                        y: {
                            beginAtZero: true
                        }
                    } : undefined
                }
            });
        }

        // 加载统计数据
        async function loadStats() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const content = document.getElementById('content');

            if (statsAbortController) {
                statsAbortController.abort();
            }
            statsAbortController = new AbortController();

            loading.style.display = 'block';
            error.style.display = 'none';
            content.style.display = 'none';

            try {
                const response = await fetch('/api/site/storage-overview', {
                    signal: statsAbortController.signal,
                    cache: 'no-store'
                });
                if (!response.ok) {
                    throw new Error('获取数据失败');
                }

                const stats = await response.json();

                // 更新汇总信息
                document.getElementById('totalFiles').textContent = stats.totalFiles.toLocaleString();
                document.getElementById('totalSize').textContent = `${stats.totalSize.toLocaleString()} MB`;
                const avgSize = stats.totalFiles > 0 ? (stats.totalSize / stats.totalFiles).toFixed(2) : 0;
                document.getElementById('avgSize').textContent = `${avgSize} MB`;

                // 限制显示前10项
                const topFileTypes = stats.fileTypesList.filter(item => item.count > 0).slice(0, 10);
                const topChannels = stats.channelsList;

                // 创建文件类型图表
                createChart(
                    'typeCountChart',
                    'doughnut',
                    topFileTypes.map(item => item.ext.toUpperCase()),
                    topFileTypes.map(item => item.count),
                    '文件数量'
                );

                createChart(
                    'typeSizeChart',
                    'doughnut',
                    topFileTypes.map(item => item.ext.toUpperCase()),
                    topFileTypes.map(item => item.size),
                    '总大小 (MB)'
                );

                // 创建渠道图表
                createChart(
                    'channelCountChart',
                    'bar',
                    topChannels.map(item => item.channel),
                    topChannels.map(item => item.count),
                    '文件数量'
                );

                createChart(
                    'channelSizeChart',
                    'bar',
                    topChannels.map(item => item.channel),
                    topChannels.map(item => item.size),
                    '总大小 (MB)'
                );

                // 填充表格
                const tbody = document.querySelector('#typeTable tbody');
                tbody.innerHTML = '';
                stats.fileTypesList.forEach(item => {
                    const row = tbody.insertRow();
                    const avgTypeSize = item.count > 0 ? (item.size / item.count).toFixed(2) : '0.00';
                    row.innerHTML = `
                        <td><span class="badge">${item.ext.toUpperCase()}</span></td>
                        <td>${item.count.toLocaleString()}</td>
                        <td>${item.size.toLocaleString()}</td>
                        <td>${avgTypeSize}</td>
                    `;
                });

                loading.style.display = 'none';
                content.style.display = 'block';

            } catch (err) {
                if (err.name === 'AbortError') {
                    return;
                }
                console.error('Error loading stats:', err);
                loading.style.display = 'none';
                error.textContent = `加载数据失败: ${err.message || '未知错误'}`;
                error.style.display = 'block';
            } finally {
                statsAbortController = null;
            }
        }

        // 页面加载时自动获取数据
        loadStats();
    </script>
</body>
</html>

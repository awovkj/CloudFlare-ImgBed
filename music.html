<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Player</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#31c27c;--primary-strong:#2bb36f;
  --accent:#ffd300;--accent-soft:#ffe066;
  --bg:#0d1117;--bg-card:#161b22;--bg-card-hover:#1c2333;
  --text:#e6edf3;--text-muted:#8b949e;--text-dim:#484f58;
  --border:rgba(255,255,255,0.06);--border-strong:rgba(255,255,255,0.12);
  --shadow:0 16px 48px rgba(0,0,0,0.4);
  --radius-lg:20px;--radius-md:14px;--radius-sm:10px;
}
html{background:var(--bg)}
body{
  min-height:100vh;font-family:-apple-system,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  padding:16px;
}

.player-container{
  position:relative;width:100%;max-width:480px;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
  overflow:hidden;z-index:1;
}

/* 顶部封面区域 */
.cover-section{
  position:relative;width:100%;aspect-ratio:1/1;max-height:380px;
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  overflow:hidden;display:flex;align-items:center;justify-content:center;
}
.cover-bg{
  position:absolute;inset:0;background-size:cover;background-position:center;
  filter:blur(40px) brightness(0.4);transform:scale(1.3);
  transition:background-image 0.6s ease;
}
.cover-disc-wrap{
  position:relative;z-index:1;
  width:220px;height:220px;
}
.cover-disc{
  width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#2a2a3e,#111 70%);
  box-shadow:0 0 0 8px rgba(0,0,0,0.3),0 20px 60px rgba(0,0,0,0.5);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.cover-disc.spinning{animation:spin 12s linear infinite}
.cover-disc.paused{animation-play-state:paused}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.cover-disc .album-cover{
  position:absolute;width:72%;height:72%;border-radius:50%;
  object-fit:cover;z-index:2;
}
.cover-disc .disc-hole{
  position:absolute;width:20px;height:20px;border-radius:50%;
  background:var(--bg-card);z-index:3;
  box-shadow:0 0 0 4px rgba(255,255,255,0.05);
}
.cover-disc .disc-ring{
  position:absolute;border-radius:50%;
  border:1px solid rgba(255,255,255,0.04);
}
.cover-disc .disc-ring:nth-child(1){width:78%;height:78%}
.cover-disc .disc-ring:nth-child(2){width:90%;height:90%}
.cover-disc .disc-ring:nth-child(3){width:100%;height:100%;border-color:rgba(255,255,255,0.08)}
.default-cover-icon{
  position:absolute;z-index:2;font-size:48px;opacity:0.3;
}

/* 歌曲信息 */
.track-section{padding:20px 24px 0}
.track-name{
  font-size:20px;font-weight:700;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-align:center;
}
.track-meta{
  font-size:13px;color:var(--text-muted);margin-top:4px;
  text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* 进度条 */
.progress-section{padding:16px 24px 0}
.progress-bar{
  width:100%;height:4px;background:rgba(255,255,255,0.08);
  border-radius:999px;cursor:pointer;position:relative;
  transition:height 0.15s ease;
}
.progress-bar:hover{height:6px}
.progress-fill{
  height:100%;border-radius:999px;
  background:var(--primary);
  position:relative;transition:width 0.1s linear;
  max-width:100%;
}
.progress-fill::after{
  content:"";position:absolute;right:-5px;top:50%;transform:translateY(-50%);
  width:12px;height:12px;border-radius:50%;
  background:var(--primary);
  box-shadow:0 0 8px rgba(49,194,124,0.4);
  opacity:0;transition:opacity 0.15s;
}
.progress-bar:hover .progress-fill::after{opacity:1}
.time-display{
  display:flex;justify-content:space-between;margin-top:6px;
  font-size:11px;color:var(--text-dim);font-variant-numeric:tabular-nums;
}

/* 控制按钮 */
.controls{display:flex;align-items:center;justify-content:center;gap:20px;padding:16px 0}
.ctrl-btn{
  width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
  background:transparent;color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s ease;font-size:18px;
}
.ctrl-btn:hover{color:var(--text);transform:scale(1.1)}
.ctrl-btn.play-btn{
  width:60px;height:60px;font-size:22px;
  background:var(--primary);color:#fff;
  box-shadow:0 8px 24px rgba(49,194,124,0.3);
}
.ctrl-btn.play-btn:hover{
  box-shadow:0 12px 32px rgba(49,194,124,0.4);
  transform:scale(1.08);
}
.ctrl-btn.small{width:36px;height:36px;font-size:14px}

/* 音量 */
.volume-area{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:0 24px 8px;
}
.volume-icon{font-size:14px;color:var(--text-dim);cursor:pointer;width:20px;text-align:center}
.volume-slider{
  width:100px;height:3px;border-radius:999px;
  background:rgba(255,255,255,0.08);cursor:pointer;position:relative;
}
.volume-fill{
  height:100%;border-radius:999px;background:var(--primary);max-width:100%;
}

/* 歌词区域 */
.lyrics-section{
  margin:8px 16px 0;padding:16px;
  background:rgba(255,255,255,0.02);
  border-radius:var(--radius-md);
  max-height:180px;overflow-y:auto;
  position:relative;
  mask-image:linear-gradient(to bottom,transparent 0%,#000 12%,#000 88%,transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 12%,#000 88%,transparent 100%);
}
.lyrics-section::-webkit-scrollbar{width:0;display:none}
.lyrics-content{text-align:center}
.lyrics-line{
  padding:6px 12px;border-radius:8px;
  font-size:13px;line-height:2;color:var(--text-dim);
  transition:all 0.35s cubic-bezier(0.4,0,0.2,1);
  cursor:pointer;
}
.lyrics-line:hover{color:var(--text-muted)}
.lyrics-line.active{
  color:var(--primary);font-size:15px;font-weight:600;
}
.lyrics-empty{
  text-align:center;color:var(--text-dim);
  font-size:12px;padding:24px;
}

/* 播放列表区域 */
.playlist-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;border-top:1px solid var(--border);cursor:pointer;
  color:var(--text-muted);font-size:13px;font-weight:500;
  transition:background 0.2s;user-select:none;
}
.playlist-header:hover{background:rgba(255,255,255,0.02)}
.playlist-header .arrow{transition:transform 0.3s;display:inline-block;font-size:11px}
.playlist-header .arrow.open{transform:rotate(180deg)}

.playlist-toolbar{
  display:flex;gap:8px;padding:8px 16px;
  border-top:1px solid var(--border);
  background:rgba(255,255,255,0.01);
}
.search-box{flex:1;position:relative}
.search-box input{
  width:100%;padding:7px 12px 7px 30px;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  font-size:12px;background:rgba(255,255,255,0.04);
  color:var(--text);outline:none;transition:border-color 0.2s;
}
.search-box input:focus{border-color:var(--primary)}
.search-box input::placeholder{color:var(--text-dim)}
.search-box::before{
  content:"\1F50D";position:absolute;left:8px;top:50%;
  transform:translateY(-50%);font-size:12px;opacity:0.4;
}
.toolbar-btn{
  padding:6px 12px;border:1px solid var(--border);
  background:rgba(255,255,255,0.03);border-radius:var(--radius-sm);
  font-size:12px;color:var(--text-muted);cursor:pointer;
  transition:all 0.2s;white-space:nowrap;
}
.toolbar-btn:hover{background:rgba(255,255,255,0.06);color:var(--text)}
.toolbar-btn.active{background:rgba(49,194,124,0.12);color:var(--primary);border-color:rgba(49,194,124,0.3)}

.playlist{
  max-height:0;overflow:hidden;transition:max-height 0.4s cubic-bezier(0.4,0,0.2,1);
}
.playlist.open{max-height:360px;overflow-y:auto}
.playlist::-webkit-scrollbar{width:4px}
.playlist::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:999px}
.playlist::-webkit-scrollbar-track{background:transparent}

.playlist-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 20px;cursor:pointer;
  transition:background 0.15s;position:relative;
}
.playlist-item:hover{background:rgba(255,255,255,0.03)}
.playlist-item.active{background:rgba(49,194,124,0.06)}
.playlist-item.active::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--primary);border-radius:0 3px 3px 0;
}
.pl-index{width:28px;font-size:12px;color:var(--text-dim);text-align:center;flex-shrink:0}
.playlist-item.active .pl-index{color:var(--primary)}
.pl-info{flex:1;min-width:0}
.pl-name{
  font-size:13px;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.playlist-item.active .pl-name{color:var(--primary);font-weight:600}
.pl-artist{font-size:11px;color:var(--text-dim);margin-top:1px}
.pl-duration{font-size:11px;color:var(--text-dim);flex-shrink:0}
.pl-playing-icon{
  width:16px;height:14px;display:flex;align-items:flex-end;gap:2px;
}
.pl-playing-icon span{
  width:3px;background:var(--primary);border-radius:2px;
  animation:eq 0.6s ease infinite alternate;
}
.pl-playing-icon span:nth-child(1){height:6px;animation-delay:0s}
.pl-playing-icon span:nth-child(2){height:10px;animation-delay:0.15s}
.pl-playing-icon span:nth-child(3){height:4px;animation-delay:0.3s}
@keyframes eq{to{height:14px}}

.mode-btn .mode-tip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,0.12);backdrop-filter:blur(12px);
  color:var(--text);font-size:11px;
  padding:4px 10px;border-radius:8px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity 0.2s;
}
.mode-btn:hover .mode-tip{opacity:1}
.mode-btn{position:relative}

/* 空状态/加载 */
.empty-state{text-align:center;padding:48px 28px;color:var(--text-muted)}
.empty-state .icon{font-size:48px;opacity:0.3;margin-bottom:12px}
.empty-state p{font-size:14px}
.empty-state .hint{font-size:12px;margin-top:8px;opacity:0.6}

.loading{text-align:center;padding:48px 28px}
.loading-spinner{
  width:36px;height:36px;border-radius:50%;
  border:3px solid rgba(49,194,124,0.15);
  border-top-color:var(--primary);
  animation:spin 0.8s linear infinite;
  margin:0 auto 12px;
}
.loading p{font-size:14px;color:var(--text-muted)}

@media(max-width:520px){
  body{padding:0;align-items:flex-start}
  .player-container{max-width:100%;border-radius:0;border:none}
  .cover-section{max-height:320px}
  .cover-disc-wrap{width:180px;height:180px}
  .track-name{font-size:18px}
  .controls{gap:16px}
  .ctrl-btn.play-btn{width:54px;height:54px}
}
</style>
</head>
<body>

<div class="player-container" id="app">
  <div id="mainContent">
    <div class="loading" id="loadingState">
      <div class="loading-spinner"></div>
      <p>Loading...</p>
    </div>
  </div>
</div>

<audio id="audio" preload="auto"></audio>

<script>
(function(){
  const audio = document.getElementById('audio');
  let playlist = [];
  let filteredPlaylist = [];
  let currentIndex = -1;
  let isPlaying = false;
  let playMode = 2;
  const modeIcons = ['\u{1F501}','\u{1F502}','\u{1F500}'];
  const modeNames = ['Sequential','Loop One','Shuffle'];
  let volume = 0.8;
  let playlistOpen = true;
  let currentLyrics = [];
  let lyricsEnabled = true;
  let searchQuery = '';
  let sortBy = 'default';

  function loadSettings(){
    try{
      const saved = localStorage.getItem('musicPlayerSettings');
      if(saved){
        const s = JSON.parse(saved);
        volume = s.volume || 0.8;
        playMode = s.playMode !== undefined ? s.playMode : 2;
        lyricsEnabled = s.lyricsEnabled !== false;
      }
    }catch(e){}
  }

  function saveSettings(){
    try{
      localStorage.setItem('musicPlayerSettings', JSON.stringify({
        volume, playMode, lyricsEnabled
      }));
    }catch(e){}
  }

  loadSettings();

  fetch('/api/music/list')
    .then(r => {
      if (r.status === 403) {
        return r.json().then(() => {
          document.getElementById('loadingState').innerHTML =
            '<div class="empty-state"><div class="icon">\u{1F6AB}</div>' +
            '<p>\u97F3\u4E50\u64AD\u653E\u5668\u672A\u542F\u7528</p>' +
            '<div class="hint">\u8BF7\u5728\u540E\u53F0\u7BA1\u7406 - \u5176\u4ED6\u8BBE\u7F6E\u4E2D\u542F\u7528\u97F3\u4E50\u64AD\u653E\u5668</div></div>';
          return null;
        });
      }
      if (!r.ok) {
        return r.json().catch(() => ({})).then(body => {
          throw new Error(body.message || '\u670D\u52A1\u4E0D\u53EF\u7528');
        });
      }
      return r.json();
    })
    .then(data => {
      if (!data) return;
      playlist = (data.files || []).map((f, i) => ({
        ...f,
        _id: i,
        lyrics: null,
        cover: f.coverUrl || null,
        lrcUrl: f.lrcUrl || null,
      }));
      filteredPlaylist = [...playlist];
      renderPlayer();
      if (playlist.length > 0) {
        currentIndex = 0;
        loadTrack(0, false);
      }
    })
    .catch(err => {
      document.getElementById('loadingState').innerHTML =
        '<div class="empty-state"><div class="icon">\u26A0\uFE0F</div>' +
        '<p>' + (err.message || '\u52A0\u8F7D\u5931\u8D25') + '</p>' +
        '<div class="hint">\u8BF7\u68C0\u67E5\u7F51\u7EDC\u8FDE\u63A5</div></div>';
    });

  function renderPlayer() {
    if (playlist.length === 0) {
      document.getElementById('mainContent').innerHTML =
        '<div class="empty-state"><div class="icon">\u{1F3B6}</div>' +
        '<p>\u6682\u65E0\u97F3\u4E50\u6587\u4EF6</p>' +
        '<div class="hint">\u8BF7\u4E0A\u4F20\u97F3\u9891\u6587\u4EF6\u5230\u914D\u7F6E\u7684\u76EE\u5F55\u4E2D</div></div>';
      return;
    }

    document.getElementById('mainContent').innerHTML = `
      <div class="cover-section">
        <div class="cover-bg" id="coverBg"></div>
        <div class="cover-disc-wrap">
          <div class="cover-disc" id="disc">
            <div class="disc-ring"></div><div class="disc-ring"></div><div class="disc-ring"></div>
            <img class="album-cover" id="albumCover" style="display:none">
            <span class="default-cover-icon" id="defaultCoverIcon">\u{1F3B5}</span>
            <div class="disc-hole"></div>
          </div>
        </div>
      </div>
      <div class="track-section">
        <div class="track-name" id="trackName">-</div>
        <div class="track-meta" id="trackMeta">-</div>
      </div>
      <div class="progress-section">
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <div class="time-display">
          <span id="timeCurrent">0:00</span>
          <span id="timeTotal">0:00</span>
        </div>
      </div>
      <div class="controls">
        <button class="ctrl-btn small mode-btn" id="modeBtn" title="Play mode">
          ${modeIcons[playMode]}
          <span class="mode-tip">${modeNames[playMode]}</span>
        </button>
        <button class="ctrl-btn" id="prevBtn" title="Previous">\u23EE</button>
        <button class="ctrl-btn play-btn" id="playBtn" title="Play">\u25B6\uFE0F</button>
        <button class="ctrl-btn" id="nextBtn" title="Next">\u23ED</button>
        <button class="ctrl-btn small" id="downloadBtn" title="Download">\u2B07\uFE0F</button>
      </div>
      <div class="volume-area">
        <span class="volume-icon" id="volIcon">\u{1F50A}</span>
        <div class="volume-slider" id="volSlider">
          <div class="volume-fill" id="volFill" style="width:${volume*100}%"></div>
        </div>
      </div>
      <div class="lyrics-section" id="lyricsSection" style="display:${lyricsEnabled?'block':'none'}">
        <div class="lyrics-content" id="lyricsContent">
          <div class="lyrics-empty">\u{1F3B6} \u6682\u65E0\u6B4C\u8BCD</div>
        </div>
      </div>
      <div class="playlist-toolbar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="\u641C\u7D22\u6B4C\u66F2..." value="${searchQuery}">
        </div>
        <button class="toolbar-btn ${sortBy==='name'?'active':''}" id="sortNameBtn" title="\u6309\u540D\u79F0">A-Z</button>
        <button class="toolbar-btn ${sortBy==='date'?'active':''}" id="sortDateBtn" title="\u6309\u65F6\u95F4">\u{1F4C5}</button>
      </div>
      <div class="playlist-header" id="plToggle">
        <span>\u{1F3B5} \u64AD\u653E\u5217\u8868 <span style="opacity:0.5;font-size:12px" id="playlistCount">${filteredPlaylist.length} \u9996</span></span>
        <span class="arrow ${playlistOpen?'open':''}" id="plArrow">\u25BC</span>
      </div>
      <div class="playlist ${playlistOpen?'open':''}" id="playlist">${renderPlaylistItems()}</div>
    `;

    audio.volume = volume;
    bindEvents();
  }

  function renderPlaylistItems() {
    const items = filteredPlaylist.map((t, i) => {
      const oi = playlist.findIndex(p => p._id === t._id);
      return `<div class="playlist-item${oi===currentIndex?' active':''}" data-index="${oi}">
        <span class="pl-index">${oi===currentIndex
          ? '<span class="pl-playing-icon"><span></span><span></span><span></span></span>'
          : (i+1)}</span>
        <div class="pl-info">
          <div class="pl-name">${escHtml(t.name)}</div>
        </div>
      </div>`;
    }).join('');
    return items || '<div class="lyrics-empty" style="padding:20px">\u65E0\u5339\u914D\u7ED3\u679C</div>';
  }

  function updatePlaylistUI() {
    const el = document.getElementById('playlist');
    if (el) {
      el.innerHTML = renderPlaylistItems();
      const cnt = document.getElementById('playlistCount');
      if (cnt) cnt.textContent = filteredPlaylist.length + ' \u9996';
    }
    document.querySelectorAll('.playlist-item').forEach(item => {
      item.addEventListener('click', () => {
        const idx = parseInt(item.dataset.index);
        if (idx !== currentIndex) { currentIndex = idx; loadTrack(idx, true); }
        else togglePlay();
      });
    });
  }

  function parseLyrics(lrcText) {
    if (!lrcText) return [];
    const lines = lrcText.split('\n');
    const lyrics = [];
    const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/g;
    lines.forEach(line => {
      const matches = [...line.matchAll(timeRegex)];
      if (matches.length > 0) {
        const text = line.replace(timeRegex, '').trim();
        if (text) {
          matches.forEach(match => {
            const m = parseInt(match[1]);
            const s = parseInt(match[2]);
            const ms = parseInt(match[3].padEnd(3, '0'));
            lyrics.push({ time: m*60+s+ms/1000, text });
          });
        }
      }
    });
    return lyrics.sort((a, b) => a.time - b.time);
  }

  function updateLyrics(currentTime) {
    if (!currentLyrics.length || !lyricsEnabled) return;
    let activeIndex = -1;
    for (let i = currentLyrics.length - 1; i >= 0; i--) {
      if (currentTime >= currentLyrics[i].time) { activeIndex = i; break; }
    }
    const container = document.getElementById('lyricsContent');
    if (!container) return;
    const lines = container.querySelectorAll('.lyrics-line');
    lines.forEach((line, i) => line.classList.toggle('active', i === activeIndex));
    if (activeIndex >= 0 && lines[activeIndex]) {
      const section = document.getElementById('lyricsSection');
      const lineEl = lines[activeIndex];
      const sRect = section.getBoundingClientRect();
      const lRect = lineEl.getBoundingClientRect();
      const offset = lRect.top - sRect.top - sRect.height / 2 + lRect.height / 2;
      section.scrollTop += offset * 0.35;
    }
  }

  function renderLyrics() {
    const container = document.getElementById('lyricsContent');
    if (!container) return;
    if (!currentLyrics.length) {
      container.innerHTML = '<div class="lyrics-empty">\u{1F3B6} \u6682\u65E0\u6B4C\u8BCD</div>';
      return;
    }
    container.innerHTML = currentLyrics.map(line =>
      `<div class="lyrics-line" data-time="${line.time}">${escHtml(line.text)}</div>`
    ).join('');
    container.querySelectorAll('.lyrics-line').forEach(line => {
      line.addEventListener('click', () => {
        const t = parseFloat(line.dataset.time);
        if (!isNaN(t)) audio.currentTime = t;
      });
    });
  }

  async function loadTrack(idx, autoPlay) {
    if (idx < 0 || idx >= playlist.length) return;
    currentIndex = idx;
    const track = playlist[idx];
    audio.src = track.url;

    document.getElementById('trackName').textContent = track.name;
    document.getElementById('trackMeta').textContent = track.fileName || '';
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('timeCurrent').textContent = '0:00';
    document.getElementById('timeTotal').textContent = '0:00';

    // 封面
    const coverEl = document.getElementById('albumCover');
    const bgEl = document.getElementById('coverBg');
    const iconEl = document.getElementById('defaultCoverIcon');
    if (track.cover) {
      coverEl.src = track.cover;
      coverEl.style.display = 'block';
      bgEl.style.backgroundImage = `url(${track.cover})`;
      iconEl.style.display = 'none';
      coverEl.onerror = () => {
        coverEl.style.display = 'none';
        bgEl.style.backgroundImage = '';
        iconEl.style.display = 'block';
      };
    } else {
      coverEl.style.display = 'none';
      bgEl.style.backgroundImage = '';
      iconEl.style.display = 'block';
    }

    // 歌词：从 lrcUrl 异步加载
    currentLyrics = [];
    if (track.lrcUrl && !track.lyrics) {
      try {
        const res = await fetch(track.lrcUrl);
        if (res.ok) {
          track.lyrics = await res.text();
        }
      } catch(e) {}
    }
    currentLyrics = parseLyrics(track.lyrics);
    renderLyrics();
    updatePlaylistUI();

    if (autoPlay) {
      audio.play().then(() => { isPlaying = true; updatePlayBtn(); updateDisc(); }).catch(() => {});
    }
  }

  function togglePlay() {
    if (!playlist.length) return;
    if (isPlaying) audio.pause(); else audio.play().catch(() => {});
  }

  function updatePlayBtn() {
    const btn = document.getElementById('playBtn');
    if (btn) btn.innerHTML = isPlaying ? '\u23F8\uFE0F' : '\u25B6\uFE0F';
  }

  function updateDisc() {
    const disc = document.getElementById('disc');
    if (!disc) return;
    if (isPlaying) { disc.classList.add('spinning'); disc.classList.remove('paused'); }
    else disc.classList.add('paused');
  }

  function playNext() {
    if (!playlist.length) return;
    let next;
    if (playMode === 1) next = currentIndex;
    else if (playMode === 2) { do { next = Math.floor(Math.random()*playlist.length); } while(next===currentIndex&&playlist.length>1); }
    else next = (currentIndex+1)%playlist.length;
    loadTrack(next, true);
  }

  function playPrev() {
    if (!playlist.length) return;
    let prev;
    if (playMode === 2) { do { prev = Math.floor(Math.random()*playlist.length); } while(prev===currentIndex&&playlist.length>1); }
    else prev = (currentIndex-1+playlist.length)%playlist.length;
    loadTrack(prev, true);
  }

  function filterAndSort() {
    filteredPlaylist = playlist.filter(t =>
      t.name.toLowerCase().includes(searchQuery.toLowerCase())
    );
    if (sortBy === 'name') filteredPlaylist.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
    else if (sortBy === 'date') filteredPlaylist.sort((a, b) => (b.timestamp||0)-(a.timestamp||0));
    updatePlaylistUI();
  }

  function formatTime(sec) {
    if (!sec || isNaN(sec)) return '0:00';
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60);
    return m+':'+(s<10?'0':'')+s;
  }

  function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function bindEvents() {
    document.getElementById('playBtn').addEventListener('click', togglePlay);
    document.getElementById('nextBtn').addEventListener('click', playNext);
    document.getElementById('prevBtn').addEventListener('click', playPrev);

    document.getElementById('modeBtn').addEventListener('click', function(){
      playMode = (playMode+1)%3;
      this.innerHTML = modeIcons[playMode]+'<span class="mode-tip">'+modeNames[playMode]+'</span>';
      saveSettings();
    });

    document.getElementById('downloadBtn').addEventListener('click', function(){
      if (currentIndex >= 0 && playlist[currentIndex]) {
        const a = document.createElement('a');
        a.href = playlist[currentIndex].url;
        a.download = playlist[currentIndex].fileName || playlist[currentIndex].name;
        a.click();
      }
    });

    document.getElementById('progressBar').addEventListener('click', function(e){
      if (!audio.duration) return;
      const rect = this.getBoundingClientRect();
      audio.currentTime = ((e.clientX-rect.left)/rect.width)*audio.duration;
    });

    const volSlider = document.getElementById('volSlider');
    volSlider.addEventListener('click', function(e){
      const rect = this.getBoundingClientRect();
      volume = Math.max(0, Math.min(1, (e.clientX-rect.left)/rect.width));
      audio.volume = volume;
      document.getElementById('volFill').style.width = (volume*100)+'%';
      document.getElementById('volIcon').innerHTML = volume===0?'\u{1F508}':'\u{1F50A}';
      saveSettings();
    });

    document.getElementById('volIcon').addEventListener('click', function(){
      if(volume>0){this._prev=volume;volume=0;}else{volume=this._prev||0.8;}
      audio.volume=volume;
      document.getElementById('volFill').style.width=(volume*100)+'%';
      this.innerHTML=volume===0?'\u{1F508}':'\u{1F50A}';
      saveSettings();
    });

    document.getElementById('searchInput').addEventListener('input', function(){
      searchQuery = this.value; filterAndSort();
    });

    document.getElementById('sortNameBtn').addEventListener('click', function(){
      sortBy = sortBy==='name'?'default':'name';
      this.classList.toggle('active', sortBy==='name');
      document.getElementById('sortDateBtn').classList.remove('active');
      filterAndSort();
    });

    document.getElementById('sortDateBtn').addEventListener('click', function(){
      sortBy = sortBy==='date'?'default':'date';
      this.classList.toggle('active', sortBy==='date');
      document.getElementById('sortNameBtn').classList.remove('active');
      filterAndSort();
    });

    document.getElementById('plToggle').addEventListener('click', function(){
      playlistOpen = !playlistOpen;
      document.getElementById('playlist').classList.toggle('open', playlistOpen);
      document.getElementById('plArrow').classList.toggle('open', playlistOpen);
    });

    document.querySelectorAll('.playlist-item').forEach(item => {
      item.addEventListener('click', () => {
        const idx = parseInt(item.dataset.index);
        if(idx!==currentIndex){currentIndex=idx;loadTrack(idx,true);}else togglePlay();
      });
    });

    audio.addEventListener('timeupdate', function(){
      if (!audio.duration) return;
      document.getElementById('progressFill').style.width = (audio.currentTime/audio.duration*100)+'%';
      document.getElementById('timeCurrent').textContent = formatTime(audio.currentTime);
      updateLyrics(audio.currentTime);
    });
    audio.addEventListener('loadedmetadata', function(){
      document.getElementById('timeTotal').textContent = formatTime(audio.duration);
    });
    audio.addEventListener('ended', playNext);
    audio.addEventListener('play', function(){ isPlaying=true; updatePlayBtn(); updateDisc(); });
    audio.addEventListener('pause', function(){ isPlaying=false; updatePlayBtn(); updateDisc(); });
  }

  document.addEventListener('keydown', function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
    switch(e.code){
      case 'Space': e.preventDefault(); togglePlay(); break;
      case 'ArrowRight': e.preventDefault(); playNext(); break;
      case 'ArrowLeft': e.preventDefault(); playPrev(); break;
      case 'ArrowUp': e.preventDefault();
        volume=Math.min(1,volume+0.1); audio.volume=volume;
        document.getElementById('volFill').style.width=(volume*100)+'%'; saveSettings(); break;
      case 'ArrowDown': e.preventDefault();
        volume=Math.max(0,volume-0.1); audio.volume=volume;
        document.getElementById('volFill').style.width=(volume*100)+'%'; saveSettings(); break;
      case 'KeyL': e.preventDefault();
        lyricsEnabled=!lyricsEnabled;
        const ls=document.getElementById('lyricsSection');
        if(ls) ls.style.display=lyricsEnabled?'block':'none';
        saveSettings(); break;
    }
  });
})();
</script>
</body>
</html>

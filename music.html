<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Player</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --fabric-bg:#f5f1e8;
  --fabric-bg-warm:#e8dfd1;
  --fabric-surface:rgba(255,255,255,0.92);
  --fabric-surface-soft:rgba(250,247,240,0.88);
  --fabric-border:rgba(180,160,130,0.18);
  --fabric-border-strong:rgba(160,140,110,0.28);
  --fabric-shadow:0 4px 12px rgba(80,60,40,0.06);
  --fabric-shadow-hover:0 8px 24px rgba(80,60,40,0.1);
  --fabric-shadow-lg:0 12px 32px rgba(80,60,40,0.08);
  --fabric-text:#2f2f2f;
  --fabric-text-muted:#6b6b6b;
  --fabric-text-dim:#9a9a9a;
  --fabric-primary:#8b7355;
  --fabric-primary-strong:#a08060;
  --fabric-primary-soft:#c4a882;
  --fabric-accent:#7a9e7e;
  --fabric-accent-soft:#a8c4aa;
  --fabric-radius-lg:20px;
  --fabric-radius-md:16px;
  --fabric-radius-sm:12px;
  --fabric-radius-xs:8px;
  --fabric-ease:cubic-bezier(0.22,1,0.36,1);
  --fabric-transition:220ms var(--fabric-ease);
}
html{background:var(--fabric-bg)}
body{
  min-height:100vh;
  font-family:-apple-system,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--fabric-text);
  background:var(--fabric-bg);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow-x:hidden;
  position:relative;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(180,160,130,0.015) 2px,rgba(180,160,130,0.015) 4px),
    repeating-linear-gradient(90deg,transparent,transparent 2px,rgba(180,160,130,0.015) 2px,rgba(180,160,130,0.015) 4px);
  opacity:0.7;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 20% 0%,rgba(232,223,209,0.4) 0%,transparent 50%),
    radial-gradient(ellipse at 80% 100%,rgba(245,241,232,0.3) 0%,transparent 50%);
}

.player-shell{
  position:relative;
  width:min(1240px,100%);
  border:1px dashed var(--fabric-border);
  border-radius:var(--fabric-radius-lg);
  background:var(--fabric-surface);
  box-shadow:var(--fabric-shadow-lg);
  overflow:hidden;
}
.player-shell::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.5),transparent 30%,transparent 70%,rgba(232,223,209,0.1));
  pointer-events:none;
}
.player-shell::after{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(45deg,transparent,transparent 2px,rgba(180,160,130,0.02) 2px,rgba(180,160,130,0.02) 4px);
  pointer-events:none;
}
.app-stage{position:relative;z-index:1}

.loading,.empty-state{
  min-height:min(760px,calc(100vh - 40px));
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:56px 28px;
  text-align:center;
  color:var(--fabric-text-muted);
}
.loading-spinner{
  width:40px;
  height:40px;
  border-radius:50%;
  border:3px solid rgba(180,160,130,0.15);
  border-top-color:var(--fabric-primary);
  animation:spin .8s linear infinite;
  margin-bottom:14px;
}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.empty-state .icon{font-size:48px;opacity:.5;margin-bottom:12px}
.empty-state p{font-size:16px;color:var(--fabric-text)}
.empty-state .hint{font-size:13px;margin-top:8px;opacity:.72;max-width:360px;line-height:1.6}

.player-layout{
  display:grid;
  grid-template-columns:minmax(0,1.08fr) minmax(340px,.92fr);
  min-height:min(860px,calc(100vh - 40px));
}

.player-main{
  position:relative;
  padding:32px;
  display:flex;
  flex-direction:column;
  gap:24px;
  min-width:0;
}
.player-main::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,0.3),transparent 24%,transparent 76%,rgba(232,223,209,0.08));
  pointer-events:none;
}

.hero-panel{
  position:relative;
  display:grid;
  grid-template-columns:minmax(260px,360px) minmax(0,1fr);
  gap:32px;
  align-items:center;
  min-width:0;
}

.cover-card{
  position:relative;
  aspect-ratio:1/1;
  border-radius:20px;
  overflow:hidden;
  border:1px dashed var(--fabric-border);
  background:var(--fabric-surface-soft);
  box-shadow:var(--fabric-shadow-hover);
  isolation:isolate;
}
.cover-bg{
  position:absolute;
  inset:-8%;
  background-size:cover;
  background-position:center;
  filter:blur(48px) saturate(0.9) brightness(0.85);
  transform:scale(1.14);
  opacity:.7;
  transition:background-image .6s var(--fabric-ease),opacity .3s var(--fabric-ease);
}
.cover-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(245,241,232,0.2),rgba(245,241,232,0.5));
}
.cover-disc-wrap{
  position:relative;
  z-index:1;
  width:min(72%,280px);
  aspect-ratio:1/1;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
}
.cover-disc{
  width:100%;
  height:100%;
  border-radius:50%;
  position:relative;
  overflow:hidden;
  background:radial-gradient(circle at 35% 35%,rgba(255,255,255,0.6),var(--fabric-bg-warm) 40%,var(--fabric-bg) 74%);
  box-shadow:0 0 0 8px rgba(180,160,130,0.12),var(--fabric-shadow-hover);
}
.cover-disc.spinning{animation:discSpin 14s linear infinite}
.cover-disc.paused{animation-play-state:paused}
@keyframes discSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.disc-ring{position:absolute;border-radius:50%;border:1px dashed rgba(180,160,130,0.15);inset:auto}
.disc-ring:nth-child(1){width:84%;height:84%;top:8%;left:8%}
.disc-ring:nth-child(2){width:92%;height:92%;top:4%;left:4%}
.disc-ring:nth-child(3){width:100%;height:100%;top:0;left:0;border-color:rgba(180,160,130,0.2)}
.album-cover{
  position:absolute;
  inset:14%;
  width:72%;
  height:72%;
  border-radius:50%;
  object-fit:cover;
  z-index:2;
  box-shadow:var(--fabric-shadow-hover);
}
.disc-hole{
  position:absolute;
  inset:calc(50% - 10px);
  width:20px;
  height:20px;
  border-radius:50%;
  background:var(--fabric-bg);
  z-index:3;
  box-shadow:0 0 0 4px rgba(180,160,130,0.1);
}
.default-cover-icon{
  position:absolute;
  inset:calc(50% - 26px);
  z-index:2;
  font-size:52px;
  opacity:.35;
}

.now-playing{
  display:flex;
  flex-direction:column;
  gap:20px;
  min-width:0;
}
.eyebrow{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:12px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.16em;
  color:var(--fabric-text-dim);
}
.eyebrow .dot{
  width:9px;height:9px;border-radius:50%;
  background:linear-gradient(135deg,var(--fabric-primary),var(--fabric-accent));
  box-shadow:0 0 12px rgba(139,115,85,0.3);
}
.track-copy{display:flex;flex-direction:column;gap:10px;min-width:0}
.track-name{
  font-size:clamp(28px,4.2vw,50px);
  font-weight:800;
  line-height:1.02;
  letter-spacing:-.04em;
  color:var(--fabric-text);
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}
.track-meta,
.track-file{
  font-size:14px;
  color:var(--fabric-text-muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.track-file{font-size:13px;color:var(--fabric-text-dim)}

.detail-pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 14px;
  border-radius:var(--fabric-radius-xs);
  border:1px dashed var(--fabric-border);
  background:var(--fabric-surface-soft);
  color:var(--fabric-text-muted);
  font-size:12px;
}
.pill strong{font-size:13px;color:var(--fabric-text)}

.control-panel{
  border:1px dashed var(--fabric-border);
  background:var(--fabric-surface);
  border-radius:var(--fabric-radius-md);
  padding:24px;
  box-shadow:var(--fabric-shadow);
  display:flex;
  flex-direction:column;
  gap:20px;
}
.progress-meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:12px;
  color:var(--fabric-text-dim);
  gap:12px;
}
.progress-meta strong{font-size:13px;color:var(--fabric-text-muted);font-weight:600}
.progress-bar{
  position:relative;
  width:100%;
  height:8px;
  border-radius:999px;
  background:var(--fabric-surface-soft);
  cursor:pointer;
  overflow:visible;
}
.progress-fill{
  position:relative;
  height:100%;
  border-radius:999px;
  width:0%;
  max-width:100%;
  background:linear-gradient(90deg,var(--fabric-primary),var(--fabric-accent));
  transition:width .1s linear;
}
.progress-fill::after{
  content:"";
  position:absolute;
  right:-8px;
  top:50%;
  transform:translateY(-50%);
  width:16px;
  height:16px;
  border-radius:50%;
  background:var(--fabric-surface);
  box-shadow:var(--fabric-shadow);
  border:2px solid var(--fabric-primary);
  opacity:0;
  transition:opacity .2s var(--fabric-ease),transform .2s var(--fabric-ease);
}
.progress-bar:hover .progress-fill::after{opacity:1;transform:translateY(-50%) scale(1.04)}

.transport-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
  gap:20px;
}
.transport-actions,
.utility-actions{display:flex;align-items:center;gap:10px}
.transport-actions{justify-content:flex-start}
.utility-actions{justify-content:flex-end}
.primary-controls{display:flex;align-items:center;justify-content:center;gap:14px}
.ctrl-btn{
  position:relative;
  border:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  background:var(--fabric-surface-soft);
  color:var(--fabric-text-muted);
  border-radius:var(--fabric-radius-xs);
  transition:transform var(--fabric-transition),background var(--fabric-transition),color var(--fabric-transition),box-shadow var(--fabric-transition),border-color var(--fabric-transition);
  border:1px dashed var(--fabric-border);
}
.ctrl-btn:hover{transform:translateY(-1px);background:var(--fabric-surface);color:var(--fabric-text);box-shadow:var(--fabric-shadow)}
.ctrl-btn:active{transform:translateY(1px)}
.ctrl-btn.icon-btn{width:44px;height:44px;font-size:16px}
.ctrl-btn.nav-btn{width:52px;height:52px;font-size:19px}
.ctrl-btn.play-btn{
  width:72px;height:72px;font-size:24px;
  color:#fff;
  background:linear-gradient(135deg,var(--fabric-primary),var(--fabric-primary-strong));
  box-shadow:0 6px 20px rgba(139,115,85,0.25);
  border-color:rgba(255,255,255,0.2);
}
.ctrl-btn.play-btn:hover{box-shadow:0 8px 26px rgba(139,115,85,0.32)}
.mode-btn.active-visual{color:var(--fabric-text)}
.mode-tip{
  position:absolute;
  bottom:calc(100% + 10px);
  left:50%;
  transform:translateX(-50%);
  padding:6px 10px;
  border-radius:var(--fabric-radius-xs);
  font-size:11px;
  color:var(--fabric-text);
  background:var(--fabric-surface);
  border:1px dashed var(--fabric-border);
  box-shadow:var(--fabric-shadow);
  opacity:0;
  pointer-events:none;
  white-space:nowrap;
  transition:opacity .2s var(--fabric-ease);
}
.mode-btn:hover .mode-tip{opacity:1}

.secondary-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:20px;
  align-items:center;
}
.volume-card,
.shortcut-hint{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}
.volume-card{padding:12px 14px;border-radius:var(--fabric-radius-sm);background:var(--fabric-surface-soft);border:1px dashed var(--fabric-border)}
.volume-label{font-size:12px;color:var(--fabric-text-dim);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.volume-slider{
  flex:1;
  min-width:120px;
  height:6px;
  border-radius:999px;
  background:var(--fabric-surface);
  cursor:pointer;
  overflow:hidden;
}
.volume-fill{height:100%;max-width:100%;border-radius:999px;background:linear-gradient(90deg,var(--fabric-primary),var(--fabric-accent))}
.shortcut-hint{justify-content:flex-end;font-size:12px;color:var(--fabric-text-dim);flex-wrap:wrap}
.shortcut-hint kbd{
  padding:4px 8px;
  border-radius:var(--fabric-radius-xs);
  border:1px dashed var(--fabric-border);
  background:var(--fabric-surface-soft);
  color:var(--fabric-text-muted);
  font:inherit;
}

.playlist-panel{
  position:relative;
  min-width:0;
  border-left:1px dashed var(--fabric-border);
  background:var(--fabric-surface-soft);
  display:flex;
  flex-direction:column;
}
.playlist-panel::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,0.2),transparent 24%);
  pointer-events:none;
}
.playlist-top{
  position:relative;
  z-index:1;
  padding:32px 24px 20px;
  display:flex;
  flex-direction:column;
  gap:20px;
}
.playlist-title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}
.playlist-heading{display:flex;flex-direction:column;gap:8px;min-width:0}
.playlist-heading h2{font-size:24px;letter-spacing:-.03em;color:var(--fabric-text)}
.playlist-heading p{font-size:13px;color:var(--fabric-text-muted);line-height:1.5}
.playlist-toggle{
  min-width:46px;
  width:46px;
  height:46px;
  font-size:14px;
  background:var(--fabric-surface-soft);
}
.playlist-toggle .arrow{display:inline-block;transition:transform .28s var(--fabric-ease)}
.playlist-toggle .arrow.open{transform:rotate(180deg)}

.playlist-toolbar{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto;
  gap:10px;
}
.search-box{position:relative;min-width:0}
.search-box input{
  width:100%;
  height:44px;
  padding:0 14px 0 40px;
  border-radius:var(--fabric-radius-sm);
  border:1px dashed var(--fabric-border);
  background:var(--fabric-surface);
  color:var(--fabric-text);
  outline:none;
  font-size:13px;
  transition:border-color var(--fabric-transition),background var(--fabric-transition),box-shadow var(--fabric-transition);
}
.search-box input:focus{border-color:var(--fabric-primary-soft);background:var(--fabric-surface);box-shadow:0 0 0 3px rgba(139,115,85,0.1)}
.search-box input::placeholder{color:var(--fabric-text-dim)}
.search-box::before{
  content:"\1F50D";
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  font-size:13px;
  opacity:.58;
}
.toolbar-btn{
  min-width:46px;
  height:44px;
  padding:0 14px;
  border-radius:var(--fabric-radius-sm);
  border:1px dashed var(--fabric-border);
  background:var(--fabric-surface);
  color:var(--fabric-text-muted);
  cursor:pointer;
  font-size:13px;
  font-weight:600;
  transition:transform var(--fabric-transition),background var(--fabric-transition),border-color var(--fabric-transition),color var(--fabric-transition);
}
.toolbar-btn:hover{transform:translateY(-1px);background:var(--fabric-surface-soft);color:var(--fabric-text)}
.toolbar-btn.active{background:rgba(139,115,85,0.1);border-color:var(--fabric-primary-soft);color:var(--fabric-primary)}

.playlist-summary{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  font-size:12px;
  color:var(--fabric-text-dim);
}
.playlist-summary strong{font-size:13px;color:var(--fabric-text-muted)}

.playlist-scroll-wrap{
  position:relative;
  z-index:1;
  flex:1;
  min-height:0;
  padding:0 16px 16px;
}
.playlist{
  height:100%;
  max-height:none;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding-right:4px;
  transition:opacity .24s var(--fabric-ease),transform .24s var(--fabric-ease),max-height .28s var(--fabric-ease),padding .28s var(--fabric-ease);
}
.playlist.closed{
  max-height:0;
  overflow:hidden;
  opacity:0;
  transform:translateY(-10px);
  padding-bottom:0;
  pointer-events:none;
}
.playlist::-webkit-scrollbar{width:6px}
.playlist::-webkit-scrollbar-thumb{background:rgba(180,160,130,0.25);border-radius:999px}
.playlist::-webkit-scrollbar-track{background:transparent}

.playlist-item{
  position:relative;
  display:grid;
  grid-template-columns:32px minmax(0,1fr) auto;
  gap:14px;
  align-items:center;
  width:100%;
  padding:14px 16px;
  border-radius:var(--fabric-radius-md);
  border:1px dashed var(--fabric-border);
  background:var(--fabric-surface);
  cursor:pointer;
  transition:transform var(--fabric-transition),background var(--fabric-transition),border-color var(--fabric-transition),box-shadow var(--fabric-transition);
}
.playlist-item:hover{transform:translateY(-1px);background:var(--fabric-surface);border-color:var(--fabric-border-strong);box-shadow:var(--fabric-shadow)}
.playlist-item.active{background:linear-gradient(135deg,rgba(139,115,85,0.08),rgba(122,158,126,0.06));border-color:var(--fabric-primary-soft);box-shadow:var(--fabric-shadow-hover)}
.playlist-item.active::before{
  content:"";
  position:absolute;
  left:0;
  top:14px;
  bottom:14px;
  width:4px;
  border-radius:0 4px 4px 0;
  background:linear-gradient(180deg,var(--fabric-primary),var(--fabric-accent));
}
.pl-index{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:700;
  color:var(--fabric-text-dim);
}
.playlist-item.active .pl-index{color:var(--fabric-primary)}
.pl-info{min-width:0;display:flex;flex-direction:column;gap:4px}
.pl-name{
  font-size:14px;
  font-weight:600;
  color:var(--fabric-text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.playlist-item.active .pl-name{color:var(--fabric-text)}
.pl-artist{
  font-size:12px;
  color:var(--fabric-text-dim);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.playlist-item.active .pl-artist{color:var(--fabric-text-muted)}
.pl-duration{font-size:12px;color:var(--fabric-text-dim);white-space:nowrap}
.playlist-item.active .pl-duration{color:var(--fabric-text-muted)}
.pl-playing-icon{width:16px;height:14px;display:flex;align-items:flex-end;gap:2px}
.pl-playing-icon span{width:3px;background:var(--fabric-primary);border-radius:2px;animation:eq .6s ease infinite alternate}
.pl-playing-icon span:nth-child(1){height:6px;animation-delay:0s}
.pl-playing-icon span:nth-child(2){height:10px;animation-delay:.15s}
.pl-playing-icon span:nth-child(3){height:4px;animation-delay:.3s}
@keyframes eq{to{height:14px}}

.lyrics-card{
  position:relative;
  border:1px dashed var(--fabric-border);
  border-radius:var(--fabric-radius-md);
  background:var(--fabric-surface);
  box-shadow:var(--fabric-shadow);
  overflow:hidden;
  min-height:260px;
  display:flex;
  flex-direction:column;
}
.lyrics-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:18px 20px;
  border-bottom:1px dashed var(--fabric-border);
}
.lyrics-head h3{font-size:16px;letter-spacing:-.02em;color:var(--fabric-text)}
.lyrics-head p{font-size:12px;color:var(--fabric-text-dim);margin-top:4px}
.lyrics-status{font-size:11px;color:var(--fabric-text-dim);padding:6px 10px;border-radius:var(--fabric-radius-xs);background:var(--fabric-surface-soft);border:1px dashed var(--fabric-border)}
.lyrics-section{
  flex:1;
  overflow:auto;
  padding:18px 20px 26px;
  scroll-behavior:smooth;
  mask-image:linear-gradient(to bottom,transparent 0,#000 10%,#000 88%,transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 10%,#000 88%,transparent 100%);
}
.lyrics-section::-webkit-scrollbar{width:0;height:0}
.lyrics-content{display:flex;flex-direction:column;gap:6px;text-align:center}
.lyrics-line{
  padding:8px 14px;
  border-radius:var(--fabric-radius-sm);
  font-size:14px;
  line-height:1.85;
  color:var(--fabric-text-dim);
  cursor:pointer;
  transition:transform var(--fabric-transition),background var(--fabric-transition),color var(--fabric-transition),opacity var(--fabric-transition);
}
.lyrics-line:hover{color:var(--fabric-text-muted);background:var(--fabric-surface-soft)}
.lyrics-line.active{
  color:var(--fabric-text);
  background:linear-gradient(135deg,rgba(139,115,85,0.08),rgba(122,158,126,0.06));
  transform:scale(1.02);
  font-weight:700;
}
.lyrics-empty{padding:42px 12px;text-align:center;color:var(--fabric-text-dim);font-size:13px}

.auth-card{
  display:flex;
  gap:8px;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  margin-top:18px;
}
.auth-card input{
  width:min(220px,100%);
  padding:12px 14px;
  border:1px dashed var(--fabric-border);
  border-radius:var(--fabric-radius-sm);
  background:var(--fabric-surface);
  color:var(--fabric-text);
  font-size:14px;
  outline:none;
}
.auth-card input:focus{border-color:var(--fabric-primary-soft);box-shadow:0 0 0 3px rgba(139,115,85,0.1)}
.auth-card button{
  padding:12px 16px;
  border:none;
  border-radius:var(--fabric-radius-sm);
  background:linear-gradient(135deg,var(--fabric-primary),var(--fabric-primary-strong));
  color:#fff;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  border:1px dashed rgba(255,255,255,0.2);
}
.auth-card button:hover{box-shadow:0 4px 14px rgba(139,115,85,0.2)}
.auth-card button:active{transform:translateY(1px)}

@media(max-width:1100px){
  .player-layout{grid-template-columns:1fr}
  .playlist-panel{border-left:none;border-top:1px dashed var(--fabric-border)}
  .playlist{max-height:420px}
}
@media(max-width:840px){
  body{padding:0}
  .player-shell{width:100%;border-radius:0;border-left:none;border-right:none}
  .player-main,.playlist-top{padding:24px}
  .hero-panel{grid-template-columns:1fr;gap:24px}
  .cover-disc-wrap{width:min(76vw,300px)}
  .transport-row{grid-template-columns:1fr;gap:16px}
  .transport-actions,.utility-actions,.primary-controls{justify-content:center}
  .secondary-row{grid-template-columns:1fr}
  .shortcut-hint{justify-content:flex-start}
}
@media(max-width:640px){
  .player-main,.playlist-top{padding:20px}
  .playlist-toolbar{grid-template-columns:1fr 1fr 1fr}
  .search-box{grid-column:1/-1}
  .track-name{font-size:34px}
  .ctrl-btn.play-btn{width:64px;height:64px}
  .ctrl-btn.nav-btn{width:48px;height:48px}
  .playlist-item{grid-template-columns:28px minmax(0,1fr)}
  .pl-duration{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<div class="player-shell" id="app">
  <div class="app-stage">
    <div class="loading" id="loadingState">
      <div class="loading-spinner"></div>
      <p>Loading...</p>
    </div>
  </div>
</div>

<script>
(function(){
  const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playlist = [];
  let filteredPlaylist = [];
  let currentIndex = -1;
  let isPlaying = false;
  let volume = 0.8;
  let searchQuery = '';
  let sortBy = 'default';
  let playlistExpanded = true;
  let audio = null;

  const ui = {
    mounted: false,
    app: document.getElementById('app'),
    loadingState: document.getElementById('loadingState')
  };

  function loadSettings(){
    try{
      const saved = localStorage.getItem('musicPlayerSettings');
      if(saved){
        const s = JSON.parse(saved);
        volume = s.volume ?? 0.8;
        playlistExpanded = s.playlistExpanded !== false;
      }
    }catch(e){}
  }

  function saveSettings(){
    try{
      localStorage.setItem('musicPlayerSettings', JSON.stringify({ volume, playlistExpanded }));
    }catch(e){}
  }

  function getAuthParam() {
    const params = new URLSearchParams(window.location.search);
    const authCode = params.get('authCode');
    return authCode ? 'authCode=' + encodeURIComponent(authCode) : '';
  }

  function showAuthPrompt() {
    ui.loadingState.innerHTML =
      '<div class="empty-state" style="min-height:auto;padding:0">' +
      '<div class="icon">\u{1F512}</div>' +
      '<p>\u9700\u8981\u8ba4\u8bc1</p>' +
      '<div class="hint">\u8bf7\u8f93\u5165\u8bbf\u95ee\u5bc6\u7801\u4ee5\u7ee7\u7eed\u6d4f\u89c8\u5f53\u524d\u97f3\u4e50\u5217\u8868</div>' +
      '<div class="auth-card">' +
      '<input type="password" id="authInput" placeholder="\u5bc6\u7801">' +
      '<button onclick="var c=document.getElementById(\'authInput\').value;if(c){var u=new URL(location.href);u.searchParams.set(\'authCode\',c);location.href=u.toString()}">\u786e\u5b9a</button>' +
      '</div></div>';
    var inp = document.getElementById('authInput');
    if (inp) {
      inp.focus();
      inp.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          var c = this.value;
          if (c) { var u = new URL(location.href); u.searchParams.set('authCode', c); location.href = u.toString(); }
        }
      });
    }
  }

  function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function escAttr(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatTime(sec) {
    if (!sec || isNaN(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function parseMetadata(filename) {
    const name = filename.replace(/\.[^/.]+$/, '');
    const parts = name.split(' - ');
    if (parts.length >= 2) {
      return { title: parts[1], artist: parts[0] };
    }
    return { title: name, artist: 'Unknown Artist' };
  }

  function renderApp() {
    if (ui.mounted) return;
    ui.mounted = true;

    ui.app.innerHTML = `
      <div class="app-stage">
        <div class="player-layout">
          <div class="player-main">
            <div class="hero-panel">
              <div class="cover-card">
                <div class="cover-bg" id="coverBg"></div>
                <div class="cover-disc-wrap">
                  <div class="cover-disc" id="coverDisc">
                    <div class="disc-ring"></div>
                    <div class="disc-ring"></div>
                    <div class="disc-ring"></div>
                    <img class="album-cover" id="albumCover" src="" alt="Album Cover">
                    <div class="disc-hole"></div>
                  </div>
                  <div class="default-cover-icon" id="defaultCoverIcon">\u{1F3B5}</div>
                </div>
              </div>
              <div class="now-playing">
                <div class="eyebrow">
                  <span class="dot"></span>
                  <span>NOW PLAYING</span>
                </div>
                <div class="track-copy">
                  <h1 class="track-name" id="trackName">Select a track</h1>
                  <div class="track-meta" id="trackMeta">-</div>
                  <div class="track-file" id="trackFile">-</div>
                </div>
                <div class="detail-pills" id="detailPills"></div>
              </div>
            </div>
            <div class="control-panel">
              <div class="progress-meta">
                <strong id="currentTime">0:00</strong>
                <div class="progress-bar" id="progressBar">
                  <div class="progress-fill" id="progressFill"></div>
                </div>
                <strong id="totalTime">0:00</strong>
              </div>
              <div class="transport-row">
                <div class="transport-actions">
                  <button class="ctrl-btn icon-btn mode-btn" id="shuffleBtn" title="Shuffle">\u{1F500}</button>
                  <button class="ctrl-btn icon-btn mode-btn" id="repeatBtn" title="Repeat">\u{1F501}</button>
                </div>
                <div class="primary-controls">
                  <button class="ctrl-btn nav-btn" id="prevBtn" title="Previous">\u{23EE}</button>
                  <button class="ctrl-btn play-btn" id="playBtn" title="Play">\u{25B6}</button>
                  <button class="ctrl-btn nav-btn" id="nextBtn" title="Next">\u{23ED}</button>
                </div>
                <div class="utility-actions">
                  <button class="ctrl-btn icon-btn" id="volumeBtn" title="Volume">\u{1F50A}</button>
                </div>
              </div>
              <div class="secondary-row">
                <div class="volume-card">
                  <span class="volume-label">Volume</span>
                  <div class="volume-slider" id="volumeSlider">
                    <div class="volume-fill" id="volumeFill" style="width:80%"></div>
                  </div>
                </div>
                <div class="shortcut-hint">
                  <kbd>Space</kbd> Play/Pause
                  <kbd>\u2190</kbd><kbd>\u2192</kbd> Prev/Next
                </div>
              </div>
            </div>
            <div class="lyrics-card">
              <div class="lyrics-head">
                <div>
                  <h3>Lyrics</h3>
                  <p>Synchronized lyrics display</p>
                </div>
                <span class="lyrics-status" id="lyricsStatus">No lyrics</span>
              </div>
              <div class="lyrics-section" id="lyricsSection">
                <div class="lyrics-content" id="lyricsContent">
                  <div class="lyrics-empty">No lyrics available for this track</div>
                </div>
              </div>
            </div>
          </div>
          <div class="playlist-panel">
            <div class="playlist-top">
              <div class="playlist-title-row">
                <div class="playlist-heading">
                  <h2>Playlist<span id="playlistCount"></span></h2>
                  <p>Browse, search, and play your music collection</p>
                </div>
                <button class="ctrl-btn playlist-toggle" id="playlistToggle" title="Toggle playlist">
                  <span class="arrow" id="toggleArrow">\u{25BC}</span>
                </button>
              </div>
              <div class="playlist-toolbar">
                <div class="search-box">
                  <input type="text" id="searchInput" placeholder="Search tracks...">
                </div>
                <button class="toolbar-btn" id="sortNameBtn" title="Sort by name">A-Z</button>
                <button class="toolbar-btn" id="sortDateBtn" title="Sort by date">\u{1F4C5}</button>
              </div>
              <div class="playlist-summary">
                <strong id="playlistSummaryCount">0 tracks</strong>
                <span>Click to play</span>
              </div>
            </div>
            <div class="playlist-scroll-wrap">
              <div class="playlist" id="playlist"></div>
            </div>
          </div>
        </div>
      </div>
    `;

    audio = new Audio();
    audio.volume = volume;
    bindEvents();
    updatePlaylistUI();
    if (!playlistExpanded) togglePlaylist();
  }

  function bindEvents() {
    document.getElementById('playBtn').addEventListener('click', togglePlay);
    document.getElementById('prevBtn').addEventListener('click', playPrev);
    document.getElementById('nextBtn').addEventListener('click', playNext);
    document.getElementById('shuffleBtn').addEventListener('click', toggleShuffle);
    document.getElementById('repeatBtn').addEventListener('click', toggleRepeat);
    document.getElementById('volumeBtn').addEventListener('click', toggleMute);
    document.getElementById('volumeSlider').addEventListener('click', handleVolumeClick);
    document.getElementById('progressBar').addEventListener('click', handleProgressClick);
    document.getElementById('searchInput').addEventListener('input', handleSearch);
    document.getElementById('sortNameBtn').addEventListener('click', () => sortPlaylist('name'));
    document.getElementById('sortDateBtn').addEventListener('click', () => sortPlaylist('date'));
    document.getElementById('playlistToggle').addEventListener('click', togglePlaylist);

    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('ended', handleTrackEnd);
    audio.addEventListener('loadedmetadata', () => {
      document.getElementById('totalTime').textContent = formatTime(audio.duration);
    });

    document.addEventListener('keydown', handleKeydown);
  }

  function togglePlay() {
    if (currentIndex < 0 && filteredPlaylist.length > 0) {
      playTrack(0);
      return;
    }
    if (isPlaying) {
      audio.pause();
      isPlaying = false;
    } else {
      audio.play();
      isPlaying = true;
    }
    updatePlayButton();
    updateDiscAnimation();
  }

  function playTrack(index) {
    if (index < 0 || index >= filteredPlaylist.length) return;
    currentIndex = index;
    const track = filteredPlaylist[index];
    audio.src = track.url + (getAuthParam() ? '?' + getAuthParam() : '');
    audio.play();
    isPlaying = true;
    updatePlayButton();
    updateDiscAnimation();
    updateNowPlaying(track);
    updatePlaylistUI();
  }

  function playPrev() {
    if (filteredPlaylist.length === 0) return;
    const newIndex = currentIndex <= 0 ? filteredPlaylist.length - 1 : currentIndex - 1;
    playTrack(newIndex);
  }

  function playNext() {
    if (filteredPlaylist.length === 0) return;
    const newIndex = currentIndex >= filteredPlaylist.length - 1 ? 0 : currentIndex + 1;
    playTrack(newIndex);
  }

  function toggleShuffle() {
    document.getElementById('shuffleBtn').classList.toggle('active-visual');
  }

  function toggleRepeat() {
    document.getElementById('repeatBtn').classList.toggle('active-visual');
  }

  function toggleMute() {
    audio.muted = !audio.muted;
    document.getElementById('volumeBtn').textContent = audio.muted ? '\u{1F507}' : '\u{1F50A}';
  }

  function handleVolumeClick(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    volume = Math.max(0, Math.min(1, percent));
    audio.volume = volume;
    document.getElementById('volumeFill').style.width = (volume * 100) + '%';
    saveSettings();
  }

  function handleProgressClick(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    audio.currentTime = percent * audio.duration;
  }

  function handleSearch(e) {
    searchQuery = e.target.value.toLowerCase();
    filterPlaylist();
    updatePlaylistUI();
  }

  function sortPlaylist(type) {
    sortBy = type;
    document.getElementById('sortNameBtn').classList.toggle('active', type === 'name');
    document.getElementById('sortDateBtn').classList.toggle('active', type === 'date');
    filterPlaylist();
    updatePlaylistUI();
  }

  function filterPlaylist() {
    filteredPlaylist = playlist.filter(track => {
      const name = (track.name || '').toLowerCase();
      return name.includes(searchQuery);
    });
    if (sortBy === 'name') {
      filteredPlaylist.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    } else if (sortBy === 'date') {
      filteredPlaylist.sort((a, b) => (b.uploadDate || 0) - (a.uploadDate || 0));
    }
  }

  function togglePlaylist() {
    playlistExpanded = !playlistExpanded;
    document.getElementById('playlist').classList.toggle('closed', !playlistExpanded);
    document.getElementById('toggleArrow').classList.toggle('open', playlistExpanded);
    saveSettings();
  }

  function updateProgress() {
    if (audio.duration) {
      const percent = (audio.currentTime / audio.duration) * 100;
      document.getElementById('progressFill').style.width = percent + '%';
      document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
    }
  }

  function handleTrackEnd() {
    playNext();
  }

  function updatePlayButton() {
    document.getElementById('playBtn').textContent = isPlaying ? '\u{23F8}' : '\u{25B6}';
  }

  function updateDiscAnimation() {
    const disc = document.getElementById('coverDisc');
    if (isPlaying) {
      disc.classList.add('spinning');
      disc.classList.remove('paused');
    } else {
      disc.classList.add('paused');
    }
  }

  function updateNowPlaying(track) {
    const meta = parseMetadata(track.name || 'Unknown');
    document.getElementById('trackName').textContent = meta.title;
    document.getElementById('trackMeta').textContent = meta.artist;
    document.getElementById('trackFile').textContent = track.name || '';
    document.getElementById('detailPills').innerHTML = `
      <div class="pill"><strong>Format</strong> ${track.name.split('.').pop().toUpperCase()}</div>
    `;
    document.getElementById('albumCover').style.display = 'none';
    document.getElementById('defaultCoverIcon').style.display = 'block';
    document.getElementById('coverBg').style.backgroundImage = '';
  }

  function updatePlaylistUI() {
    const container = document.getElementById('playlist');
    document.getElementById('playlistCount').textContent = ` (${filteredPlaylist.length})`;
    document.getElementById('playlistSummaryCount').textContent = filteredPlaylist.length + ' tracks';

    if (filteredPlaylist.length === 0) {
      container.innerHTML = '<div class="lyrics-empty">No tracks found</div>';
      return;
    }

    container.innerHTML = filteredPlaylist.map((track, i) => {
      const meta = parseMetadata(track.name || 'Unknown');
      const isActive = i === currentIndex;
      return `
        <div class="playlist-item${isActive ? ' active' : ''}" data-index="${i}">
          <div class="pl-index">${isActive && isPlaying ? '<div class="pl-playing-icon"><span></span><span></span><span></span></div>' : (i + 1)}</div>
          <div class="pl-info">
            <div class="pl-name">${escHtml(meta.title)}</div>
            <div class="pl-artist">${escHtml(meta.artist)}</div>
          </div>
          <div class="pl-duration">${formatTime(track.duration)}</div>
        </div>
      `;
    }).join('');

    container.querySelectorAll('.playlist-item').forEach(item => {
      item.addEventListener('click', () => {
        const index = parseInt(item.dataset.index);
        if (index === currentIndex) {
          togglePlay();
        } else {
          playTrack(index);
        }
      });
    });
  }

  function handleKeydown(e) {
    if (e.target.tagName === 'INPUT') return;
    switch(e.code) {
      case 'Space':
        e.preventDefault();
        togglePlay();
        break;
      case 'ArrowLeft':
        playPrev();
        break;
      case 'ArrowRight':
        playNext();
        break;
    }
  }

  async function loadPlaylist() {
    try {
      const authParam = getAuthParam();
      const url = '/api/music/list' + (authParam ? '?' + authParam : '');
      const response = await fetch(url);
      if (!response.ok) {
        if (response.status === 401) {
          showAuthPrompt();
          return;
        }
        throw new Error('Failed to load playlist');
      }
      const data = await response.json();
      playlist = (data.files || []).map(f => ({
        name: f.name,
        url: f.url,
        duration: f.duration || 0,
        uploadDate: f.uploadDate || 0
      }));
      filteredPlaylist = [...playlist];
      renderApp();
    } catch (error) {
      console.error('Error loading playlist:', error);
      ui.loadingState.innerHTML = `
        <div class="empty-state">
          <div class="icon">\u{1F4ED}</div>
          <p>Unable to load playlist</p>
          <div class="hint">${escHtml(error.message)}</div>
        </div>
      `;
    }
  }

  loadSettings();
  loadPlaylist();
})();
</script>
</body>
</html>

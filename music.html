<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音乐播放器</title>
<link rel="stylesheet" href="/css/theme-m3.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{

  --display:"Iowan Old Style","Palatino Linotype","Noto Serif CJK SC","Songti SC",serif;--body:"Aptos","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
html{background:var(--paper);color-scheme:light}
body{min-height:100vh;font-family:var(--body);color:var(--ink);background:radial-gradient(circle at 12% -8%,rgba(169,95,50,.16),transparent 34%),radial-gradient(circle at 90% 6%,rgba(63,97,114,.13),transparent 32%),linear-gradient(135deg,var(--paper-2),var(--paper));padding:28px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:linear-gradient(rgba(42,35,27,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(42,35,27,.035) 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(to bottom,#000,transparent 82%)}
.player-shell{position:relative;width:min(1280px,100%);margin:auto;min-height:calc(100vh - 56px);overflow:hidden;border:1px solid var(--line);border-radius:36px;background:rgba(255,250,241,.78);box-shadow:var(--shadow)}
.player-shell::before{content:"";position:absolute;inset:18px;border:1px solid rgba(42,35,27,.08);border-radius:28px;pointer-events:none}.app-stage{position:relative;z-index:1;min-height:inherit}

.empty-state .icon{font-size:44px;opacity:.58}.loading p,.empty-state p{font:700 20px/1.2 var(--display);color:var(--ink);letter-spacing:.02em}.empty-state .hint{max-width:360px;font-size:13px;line-height:1.7;color:var(--muted)}
.player-header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end;padding:36px 40px 22px}.brand-block{display:flex;align-items:center;gap:18px;min-width:0}
.brand-mark{width:58px;height:58px;flex:0 0 auto;border-radius:50%;display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:15px;color:var(--paper-2);background:radial-gradient(circle at 35% 28%,#d9a26c,var(--copper) 50%,var(--copper-dark));box-shadow:0 16px 34px rgba(169,95,50,.22)}
.brand-mark span{width:4px;border-radius:99px;background:currentColor;animation:eq .8s ease-in-out infinite alternate}.brand-mark span:nth-child(1){height:13px;animation-delay:.05s}.brand-mark span:nth-child(2){height:24px;animation-delay:.2s}.brand-mark span:nth-child(3){height:18px;animation-delay:.35s}@keyframes eq{to{height:28px}}
.header-copy{min-width:0}.header-kicker{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--copper-dark);margin-bottom:8px}.header-copy h1{font:800 clamp(32px,5vw,58px)/.95 var(--display);letter-spacing:-.04em;color:var(--ink)}.header-copy p{margin-top:10px;color:var(--muted);font-size:14px;line-height:1.7}
.header-stats{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.stat-chip{min-width:112px;padding:12px 14px;border:1px solid var(--line);border-radius:18px;background:rgba(255,250,241,.72)}.stat-chip span{display:block;margin-bottom:5px;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}.stat-chip strong{display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--ink)}
.player-layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:calc(100vh - 196px);border-top:1px solid var(--line)}.player-main{min-width:0;padding:30px 40px 40px;display:grid;gap:22px;align-content:start}.hero-panel{display:grid;grid-template-columns:minmax(240px,340px) minmax(0,1fr);gap:22px;align-items:stretch}

.cover-disc{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:radial-gradient(circle,#f8efe1 0 13%,#2b2723 14% 19%,#4a4540 20% 45%,#1d1a17 46% 100%);box-shadow:0 22px 46px rgba(38,29,19,.22)}.cover-disc.spinning{animation:discSpin 18s linear infinite}.cover-disc.paused{animation-play-state:paused}@keyframes discSpin{to{transform:rotate(360deg)}}
.disc-ring{position:absolute;inset:10%;border:1px solid rgba(255,250,241,.12);border-radius:50%}.disc-ring:nth-child(2){inset:22%}.disc-ring:nth-child(3){inset:34%}.album-cover{position:absolute;inset:24%;width:52%;height:52%;border-radius:50%;object-fit:cover;z-index:2;box-shadow:0 8px 20px rgba(0,0,0,.24)}.default-cover-icon{position:absolute;inset:calc(50% - 24px);z-index:2;font-size:48px;opacity:.72;color:var(--paper-2)}.disc-hole{position:absolute;z-index:3;left:50%;top:50%;width:18px;height:18px;border-radius:50%;background:var(--paper-2);transform:translate(-50%,-50%);box-shadow:0 0 0 8px rgba(255,250,241,.18)}

.control-panel,.lyrics-card{border:1px solid var(--line);border-radius:28px;background:rgba(255,250,241,.66);box-shadow:var(--shadow-soft)}.control-panel{padding:22px;display:grid;gap:18px}.progress-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}.progress-meta strong{font-size:13px;color:var(--ink)}.progress-bar{position:relative;height:9px;border-radius:999px;background:rgba(42,35,27,.11);cursor:pointer;overflow:visible}.progress-bar::before{content:"";position:absolute;inset:-10px 0}.progress-fill{position:relative;height:100%;max-width:100%;border-radius:inherit;background:linear-gradient(90deg,var(--copper),var(--olive));box-shadow:0 8px 18px rgba(105,120,93,.18);transition:width .1s linear}.progress-fill::after{content:"";position:absolute;right:-7px;top:50%;width:16px;height:16px;border-radius:50%;background:var(--paper-2);border:2px solid var(--copper);transform:translateY(-50%);box-shadow:0 8px 18px rgba(51,39,24,.16)}

.playlist-panel{position:relative;min-width:0;border-left:1px solid var(--line);background:rgba(235,225,208,.34);display:flex;flex-direction:column}.playlist-top{padding:30px 24px 18px;display:grid;gap:18px}.playlist-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.playlist-heading{min-width:0}.playlist-heading h2{font:800 30px/1 var(--display);letter-spacing:-.03em}.playlist-heading p{margin-top:8px;font-size:13px;line-height:1.55;color:var(--muted)}.playlist-toggle{width:42px;height:42px;flex:0 0 auto}.playlist-toggle .arrow{display:inline-block;transition:transform .2s var(--ease)}.playlist-toggle .arrow.open{transform:rotate(180deg)}.playlist-toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px}.search-box{position:relative;min-width:0}.search-box::before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:17px;color:var(--faint)}.search-box input{width:100%;height:42px;padding:0 12px 0 38px;border:1px solid var(--line);border-radius:14px;background:rgba(255,250,241,.75);font:inherit;font-size:13px;color:var(--ink);outline:none}.search-box input:focus{border-color:var(--line-strong);background:var(--paper-2)}.search-box input::placeholder{color:var(--faint)}.toolbar-btn{min-width:42px;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,250,241,.75);color:var(--muted);font:800 12px var(--body);cursor:pointer;transition:background .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease)}.toolbar-btn:hover,.toolbar-btn.active{background:var(--ink);border-color:var(--ink);color:var(--paper-2)}.playlist-summary{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}.playlist-summary strong{color:var(--ink)}.playlist-scroll-wrap{flex:1;min-height:0;padding:0 14px 18px}.playlist{height:100%;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px 0 0;transition:max-height .2s var(--ease),opacity .2s var(--ease),transform .2s var(--ease)}.playlist.closed{max-height:0;overflow:hidden;opacity:0;transform:translateY(-6px);pointer-events:none}.playlist::-webkit-scrollbar{width:6px}.playlist::-webkit-scrollbar-thumb{background:rgba(42,35,27,.18);border-radius:999px}
.playlist-item{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border:1px solid transparent;border-radius:18px;background:transparent;color:inherit;text-align:left;cursor:pointer;transition:background .18s var(--ease),border-color .18s var(--ease),transform .18s var(--ease)}.playlist-item:hover{background:rgba(255,250,241,.62);border-color:var(--line)}.playlist-item.active{background:var(--paper-2);border-color:var(--line-strong);box-shadow:var(--shadow-soft)}.pl-cover{position:relative;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--paper-3);overflow:visible}.pl-cover img,.pl-cover-fallback{width:100%;height:100%;border-radius:14px;object-fit:cover;display:flex;align-items:center;justify-content:center}.pl-cover-fallback{font-size:17px;color:var(--copper-dark);background:linear-gradient(135deg,#fff7e9,#ded0bb)}.pl-index{position:absolute;right:-7px;bottom:-7px;min-width:21px;height:21px;padding:0 5px;border-radius:999px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--paper-2);font-size:10px;font-weight:900;color:var(--muted)}.playlist-item.active .pl-index{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}.pl-info{min-width:0;display:flex;flex-direction:column;gap:4px}.pl-name{font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl-artist{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl-duration{font-size:12px;color:var(--faint);white-space:nowrap}.pl-playing-icon{width:15px;height:13px;display:flex;align-items:flex-end;gap:2px}.pl-playing-icon span{width:3px;background:currentColor;border-radius:2px;animation:eq .65s ease infinite alternate}.pl-playing-icon span:nth-child(2){animation-delay:.15s}.pl-playing-icon span:nth-child(3){animation-delay:.3s}
.lyrics-card{min-height:250px;display:flex;flex-direction:column;overflow:hidden}.lyrics-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}.lyrics-head h3{font:800 21px/1 var(--display)}.lyrics-head p{margin-top:5px;font-size:12px;color:var(--muted)}.lyrics-status{flex:0 0 auto;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(246,240,228,.76);font-size:11px;font-weight:800;color:var(--copper-dark)}.lyrics-section{flex:1;overflow:auto;padding:20px;scroll-behavior:smooth;mask-image:linear-gradient(to bottom,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 10%,#000 90%,transparent)}.lyrics-section::-webkit-scrollbar{width:0}.lyrics-content{display:grid;gap:6px;text-align:center}.lyrics-line{padding:9px 14px;border-radius:14px;font-size:15px;line-height:1.85;color:var(--muted);cursor:pointer;transition:background .2s var(--ease),color .2s var(--ease),transform .2s var(--ease)}.lyrics-line:hover{background:rgba(255,250,241,.55);color:var(--ink)}.lyrics-line.active{background:var(--ink);color:var(--paper-2);font-weight:800;transform:scale(1.015)}.lyrics-empty{padding:34px 12px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:18px;background:rgba(255,250,241,.46)}
.auth-card{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:18px}.auth-card input{width:min(220px,100%);padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--paper-2);color:var(--ink);font:inherit;outline:none}.auth-card button{padding:12px 20px;border:none;border-radius:14px;background:var(--ink);color:var(--paper-2);font:800 14px var(--body);cursor:pointer}
@media(max-width:1180px){.player-layout{grid-template-columns:1fr}.playlist-panel{border-left:none;border-top:1px solid var(--line)}.playlist{max-height:420px}.player-shell{min-height:auto}.hero-panel{grid-template-columns:minmax(220px,320px) minmax(0,1fr)}}@media(max-width:840px){body{padding:14px}.player-shell{border-radius:28px}.player-header{grid-template-columns:1fr;align-items:start;padding:28px 24px 18px}.header-stats{justify-content:flex-start}.stat-chip{flex:1;min-width:120px}.player-main,.playlist-top{padding:22px}.hero-panel{grid-template-columns:1fr}.cover-card{width:min(360px,100%);justify-self:center}.transport-row,.secondary-row{grid-template-columns:1fr}.transport-actions,.utility-actions,.primary-controls,.shortcut-hint{justify-content:center}}@media(max-width:620px){body{padding:0}.player-shell{min-height:100vh;border-radius:0;border-left:none;border-right:none}.player-shell::before{display:none}.brand-mark{width:50px;height:50px}.header-stats{display:grid;grid-template-columns:1fr 1fr;width:100%}.player-main,.playlist-top{padding:18px}.now-playing,.control-panel{padding:18px}.track-name{font-size:34px}.playlist-toolbar{grid-template-columns:1fr 1fr}.search-box{grid-column:1/-1}.playlist-item{grid-template-columns:44px minmax(0,1fr)}.pl-duration{display:none}.ctrl-btn.play-btn{width:64px;height:64px}.lyrics-line{font-size:14px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<body>

<div class="player-shell" id="app">
  <div class="app-stage" id="mainContent">
    <div class="loading" id="loadingState">
      <div class="loading-spinner"></div>
      <p>加载中...</p>
    </div>
  </div>
</div>

<audio id="audio" preload="auto"></audio>

<script>
(function(){
  const audio = document.getElementById('audio');
  const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playlist = [];
  let filteredPlaylist = [];
  let currentIndex = -1;
  let isPlaying = false;
  let playMode = 2;
  const modeIcons = ['\u{1F501}','\u{1F502}','\u{1F500}'];
  const modeNames = ['顺序播放','单曲循环','随机播放'];
  let volume = 0.8;
  let playlistOpen = true;
  let currentLyrics = [];
  let lyricsEnabled = true;
  let searchQuery = '';
  let sortBy = 'default';
  let isLoadingMore = false;
  let totalMusicCount = 0;
  let isSeekingProgress = false;
  let isAdjustingVolume = false;

  const ui = {
    mounted: false,
    mainContent: document.getElementById('mainContent')
  };

  function getAuthParam() {
    const params = new URLSearchParams(window.location.search);
    const authCode = params.get('authCode');
    return authCode ? '&authCode=' + encodeURIComponent(authCode) : '';
  }

  function showAuthPrompt() {
    ui.mainContent.innerHTML =
      '<div class="empty-state">' +
      '<div class="icon">\u{1F512}</div>' +
      '<p>需要认证</p>' +
      '<div class="hint">请输入访问密码以继续访问当前音乐列表</div>' +
      '<div class="auth-card">' +
      '<input type="password" id="authInput" placeholder="密码">' +
      '<button onclick="var c=document.getElementById(\'authInput\').value;if(c){var u=new URL(location.href);u.searchParams.set(\'authCode\',c);location.href=u.toString()}">确定</button>' +
      '</div></div>';
    const inp = document.getElementById('authInput');
    if (inp) {
      inp.focus();
      inp.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          var c = this.value;
          if (c) { var u = new URL(location.href); u.searchParams.set('authCode', c); location.href = u.toString(); }
        }
      });
    }
  }

  function loadSettings(){
    try{
      const saved = localStorage.getItem('musicPlayerSettings');
      if(saved){
        const s = JSON.parse(saved);
        volume = s.volume || 0.8;
        playMode = s.playMode !== undefined ? s.playMode : 2;
        lyricsEnabled = s.lyricsEnabled !== false;
      }
    }catch(e){}
  }

  function saveSettings(){
    try{
      localStorage.setItem('musicPlayerSettings', JSON.stringify({ volume, playMode, lyricsEnabled }));
    }catch(e){}
  }

  function fetchMusicPage(page, pageSize) {
    return fetch(`/api/music/list?page=${page}&pageSize=${pageSize}${getAuthParam()}`)
      .then(async r => {
        if (r.status === 401) {
          showAuthPrompt();
          return null;
        }
        if (r.status === 403) {
          const loading = document.getElementById('loadingState');
          if (loading) {
            loading.innerHTML =
              '<div class="empty-state" style="min-height:auto;padding:0">' +
              '<div class="icon">\u{1F6AB}</div>' +
              '<p>音乐播放器未启用</p>' +
              '<div class="hint">请在后台管理 - 其他设置中启用音乐播放器</div></div>';
          }
          return null;
        }
        if (!r.ok) {
          const body = await r.json().catch(() => ({}));
          throw new Error(body.message || '服务不可用');
        }
        return r.json();
      });
  }

  function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function escAttr(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatTime(sec) {
    if (!sec || isNaN(sec)) return '0:00';
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function formatTrackMeta(track) {
    return track && (track.fileName || track.name || '') || '';
  }

  function getVisibleCountText() {
    if (totalMusicCount > 0) {
      return filteredPlaylist.length + ' / ' + totalMusicCount + ' 首' + (isLoadingMore ? ' · 加载中' : '');
    }
    return filteredPlaylist.length + ' 首';
  }

  function getPlaylistDescription() {
    if (searchQuery) return '当前列表已按搜索结果筛选';
    if (sortBy === 'name') return '按歌曲名称排序';

    return '支持搜索、排序与歌词联动，点击歌曲即可切换';
  }

    audio.volume = volume;
    cacheUiRefs();

  function cacheUiRefs() {
    ui.coverBg = document.getElementById('coverBg');
    ui.albumCover = document.getElementById('albumCover');
    ui.defaultCoverIcon = document.getElementById('defaultCoverIcon');
    ui.disc = document.getElementById('disc');
    ui.trackName = document.getElementById('trackName');
    ui.trackMeta = document.getElementById('trackMeta');
    ui.trackFile = document.getElementById('trackFile');
    ui.progressBar = document.getElementById('progressBar');
    ui.progressFill = document.getElementById('progressFill');
    ui.timeCurrent = document.getElementById('timeCurrent');
    ui.timeTotal = document.getElementById('timeTotal');
    ui.playBtn = document.getElementById('playBtn');
    ui.modeBtn = document.getElementById('modeBtn');
    ui.modeLabel = document.getElementById('modeLabel');
    ui.lyricsLabel = document.getElementById('lyricsLabel');
    ui.headerModeLabel = document.getElementById('headerModeLabel');
    ui.headerLyricsLabel = document.getElementById('headerLyricsLabel');
    ui.playlistCount = document.getElementById('playlistCount');
    ui.playlistCountHero = document.getElementById('playlistCountHero');
    ui.headerPlaylistCount = document.getElementById('headerPlaylistCount');
    ui.playlistDescription = document.getElementById('playlistDescription');
    ui.volSlider = document.getElementById('volSlider');
    ui.volFill = document.getElementById('volFill');
    ui.volIcon = document.getElementById('volIcon');
    ui.lyricsSection = document.getElementById('lyricsSection');
    ui.lyricsContent = document.getElementById('lyricsContent');
    ui.lyricsStatus = document.getElementById('lyricsStatus');
    ui.playlist = document.getElementById('playlist');
    ui.plArrow = document.getElementById('plArrow');
    ui.searchInput = document.getElementById('searchInput');
    ui.sortNameBtn = document.getElementById('sortNameBtn');
    ui.sortDateBtn = document.getElementById('sortDateBtn');
  }

  function renderPlaylistItems() {
    const items = filteredPlaylist.map((track, i) => {
      const originalIndex = playlist.findIndex(item => item._id === track._id);
      const isActive = originalIndex === currentIndex;
      const subtitle = track.fileName || track.name || '';
      const cover = track.cover
        ? `<img src="${escAttr(track.cover)}" alt="" loading="lazy" decoding="async">`
        : '<span class="pl-cover-fallback">♪</span>';
      return `<button class="playlist-item${isActive ? ' active' : ''}" data-index="${originalIndex}" type="button">
        <span class="pl-cover">${cover}<span class="pl-index">${isActive
          ? '<span class="pl-playing-icon"><span></span><span></span><span></span></span>'
          : (i + 1)}</span></span>
        <span class="pl-info">
          <span class="pl-name">${escHtml(track.name)}</span>
          <span class="pl-artist">${escHtml(subtitle)}</span>
        </span>
        <span class="pl-duration">${isActive ? '播放中' : formatTime(0)}</span>
      </button>`;
    }).join('');
    return items || '<div class="lyrics-empty" style="padding:28px 12px">无匹配结果</div>';
  }

  function updatePlaylistUI() {
    if (ui.playlist) ui.playlist.innerHTML = renderPlaylistItems();
    updatePlaylistMeta();
  }

  function updatePlaylistMeta() {
    const countText = getVisibleCountText();
    if (ui.playlistCount) ui.playlistCount.textContent = countText;
    if (ui.playlistCountHero) ui.playlistCountHero.textContent = countText;
    if (ui.headerPlaylistCount) ui.headerPlaylistCount.textContent = countText;
    if (ui.playlistDescription) ui.playlistDescription.textContent = getPlaylistDescription();
  }

  function updateProgressFromClientX(clientX) {
    if (!ui.progressBar || !audio.duration) return;
    const rect = ui.progressBar.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    audio.currentTime = ratio * audio.duration;
    if (ui.progressFill) ui.progressFill.style.width = (ratio * 100) + '%';
    if (ui.timeCurrent) ui.timeCurrent.textContent = formatTime(audio.currentTime);
    updateLyrics(audio.currentTime);
  }

  function updateVolumeFromClientX(clientX) {
    if (!ui.volSlider) return;
    const rect = ui.volSlider.getBoundingClientRect();
    volume = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    audio.volume = volume;
    saveSettings();
    syncStaticUi();
  }

  function syncStaticUi() {
    updatePlayBtn();
    updateDisc();
    if (ui.volFill) ui.volFill.style.width = (volume * 100) + '%';
    if (ui.volIcon) ui.volIcon.innerHTML = volume === 0 ? '\u{1F508}' : '\u{1F50A}';
    if (ui.modeLabel) ui.modeLabel.textContent = modeNames[playMode];
    if (ui.headerModeLabel) ui.headerModeLabel.textContent = modeNames[playMode];
    if (ui.modeBtn) {
      const icon = ui.modeBtn.querySelector('.mode-icon');
      const tip = ui.modeBtn.querySelector('.mode-tip');
      if (icon) icon.textContent = modeIcons[playMode];
      if (tip) tip.textContent = modeNames[playMode];
    }
    if (ui.lyricsLabel) ui.lyricsLabel.textContent = lyricsEnabled ? '已开启' : '已关闭';
    if (ui.headerLyricsLabel) ui.headerLyricsLabel.textContent = lyricsEnabled ? '已开启' : '已关闭';
    if (ui.lyricsStatus) ui.lyricsStatus.textContent = lyricsEnabled ? (currentLyrics.length ? '同步中' : '暂无歌词') : '已隐藏';
    if (ui.lyricsSection) ui.lyricsSection.style.display = lyricsEnabled ? 'block' : 'none';
    if (ui.plArrow) ui.plArrow.classList.toggle('open', playlistOpen);
    if (ui.playlist) ui.playlist.classList.toggle('closed', !playlistOpen);
    if (ui.sortNameBtn) ui.sortNameBtn.classList.toggle('active', sortBy === 'name');
    if (ui.sortDateBtn) ui.sortDateBtn.classList.toggle('active', sortBy === 'date');
    updatePlaylistMeta();
  }

  function parseLyrics(lrcText) {
    if (!lrcText) return [];
    const lines = lrcText.split('\n');
    const lyrics = [];
    const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/g;
    lines.forEach(line => {
      const matches = [...line.matchAll(timeRegex)];
      if (matches.length > 0) {
        const text = line.replace(timeRegex, '').trim();
        if (text) {
          matches.forEach(match => {
            const m = parseInt(match[1], 10);
            const s = parseInt(match[2], 10);
            const ms = parseInt(match[3].padEnd(3, '0'), 10);
            lyrics.push({ time: m * 60 + s + ms / 1000, text });
          });
        }
      }
    });
    return lyrics.sort((a, b) => a.time - b.time);
  }

  function renderLyrics() {
    if (!ui.lyricsContent) return;
    if (!currentLyrics.length) {
      ui.lyricsContent.innerHTML = '<div class="lyrics-empty">\u{1F3B6} 暂无歌词</div>';
      if (ui.lyricsStatus) ui.lyricsStatus.textContent = lyricsEnabled ? '暂无歌词' : '已隐藏';
      return;
    }
    ui.lyricsContent.innerHTML = currentLyrics.map(line =>
      `<div class="lyrics-line" data-time="${line.time}">${escHtml(line.text)}</div>`
    ).join('');
    if (ui.lyricsStatus) ui.lyricsStatus.textContent = lyricsEnabled ? '同步中' : '已隐藏';
  }

  function updateLyrics(currentTime) {
    if (!currentLyrics.length || !lyricsEnabled || !ui.lyricsContent) return;
    let activeIndex = -1;
    for (let i = currentLyrics.length - 1; i >= 0; i--) {
      if (currentTime >= currentLyrics[i].time) { activeIndex = i; break; }
    }
    const lines = ui.lyricsContent.querySelectorAll('.lyrics-line');
    lines.forEach((line, i) => line.classList.toggle('active', i === activeIndex));
    if (activeIndex >= 0 && lines[activeIndex] && ui.lyricsSection && !prefersReducedMotion) {
      const lineEl = lines[activeIndex];
      const sRect = ui.lyricsSection.getBoundingClientRect();
      const lRect = lineEl.getBoundingClientRect();
      const offset = lRect.top - sRect.top - sRect.height / 2 + lRect.height / 2;
      ui.lyricsSection.scrollTop += offset * 0.35;
    }
  }

  async function loadTrack(idx, autoPlay) {
    if (idx < 0 || idx >= playlist.length) return;
    currentIndex = idx;
    const track = playlist[idx];
    audio.src = track.url;

    if (ui.trackName) ui.trackName.textContent = track.name;
    if (ui.trackMeta) ui.trackMeta.textContent = formatTrackMeta(track);
    if (ui.trackFile) ui.trackFile.textContent = track.fileName || track.url || '';
    if (ui.progressFill) ui.progressFill.style.width = '0%';
    if (ui.timeCurrent) ui.timeCurrent.textContent = '0:00';
    if (ui.timeTotal) ui.timeTotal.textContent = '0:00';

    if (ui.albumCover && ui.coverBg && ui.defaultCoverIcon) {
      if (track.cover) {
        ui.albumCover.src = track.cover;
        ui.albumCover.style.display = 'block';
        ui.coverBg.style.backgroundImage = `url(${track.cover})`;
        ui.defaultCoverIcon.style.display = 'none';
        ui.albumCover.onerror = function() {
          ui.albumCover.style.display = 'none';
          ui.coverBg.style.backgroundImage = '';
          ui.defaultCoverIcon.style.display = 'block';
        };
      } else {
        ui.albumCover.style.display = 'none';
        ui.coverBg.style.backgroundImage = '';
        ui.defaultCoverIcon.style.display = 'block';
      }
    }

    currentLyrics = [];
    if (track.lrcUrl && !track.lyrics) {
      try {
        const res = await fetch(track.lrcUrl);
        if (res.ok) track.lyrics = await res.text();
      } catch(e) {}
    }
    currentLyrics = parseLyrics(track.lyrics);
    renderLyrics();
    updatePlaylistUI();
    syncStaticUi();

    if (autoPlay) {
      audio.play().then(() => { isPlaying = true; updatePlayBtn(); updateDisc(); }).catch(() => {});
    }
  }

  function updatePlayBtn() {
    if (ui.playBtn) ui.playBtn.innerHTML = isPlaying ? '\u23F8\uFE0F' : '\u25B6\uFE0F';
  }

  function updateDisc() {
    if (!ui.disc) return;
    if (isPlaying) {
      ui.disc.classList.add('spinning');
      ui.disc.classList.remove('paused');
    } else {
      ui.disc.classList.add('paused');
    }
  }

  function togglePlay() {
    if (!playlist.length) return;
    if (isPlaying) audio.pause();
    else audio.play().catch(() => {});
  }

  function playNext() {
    if (!playlist.length) return;
    let next;
    if (playMode === 1) next = currentIndex;
    else if (playMode === 2) {
      do { next = Math.floor(Math.random() * playlist.length); }
      while (next === currentIndex && playlist.length > 1);
    } else next = (currentIndex + 1) % playlist.length;
    loadTrack(next, true);
  }

  function playPrev() {
    if (!playlist.length) return;
    let prev;
    if (playMode === 2) {
      do { prev = Math.floor(Math.random() * playlist.length); }
      while (prev === currentIndex && playlist.length > 1);
    } else prev = (currentIndex - 1 + playlist.length) % playlist.length;
    loadTrack(prev, true);
  }

  function filterAndSort() {
    const query = searchQuery.toLowerCase();
    filteredPlaylist = playlist.filter(track =>
      (track.name || '').toLowerCase().includes(query) ||
      (track.fileName || '').toLowerCase().includes(query)
    );
    if (sortBy === 'name') filteredPlaylist.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
    else if (sortBy === 'date') filteredPlaylist.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    updatePlaylistUI();
    syncStaticUi();
  }

  function appendToPlaylist(files, startId) {
    const newItems = files.map((f, i) => ({
      ...f,
      _id: startId + i,
      lyrics: null,
      cover: f.coverUrl || null,
      lrcUrl: f.lrcUrl || null
    }));
    playlist = playlist.concat(newItems);
    filteredPlaylist = [...playlist];
    if (searchQuery || sortBy !== 'default') filterAndSort();
    else {
      updatePlaylistUI();
      syncStaticUi();
    }
  }

  async function loadRemainingPages(totalPages, pageSize) {
    isLoadingMore = true;
    updatePlaylistMeta();
    for (let page = 2; page <= totalPages; page++) {
      try {
        const data = await fetchMusicPage(page, pageSize);
        if (!data || !data.files || data.files.length === 0) break;
        appendToPlaylist(data.files, playlist.length);
      } catch(e) {
        console.warn('Failed to load page ' + page + ':', e.message);
        break;
      }
    }
    isLoadingMore = false;
    updatePlaylistMeta();
  }

  function bindEventsOnce() {
    if (ui.mounted) return;
    ui.mounted = true;

    ui.mainContent.addEventListener('click', function(e) {
      const playlistItem = e.target.closest('.playlist-item');
      if (playlistItem && ui.playlist && ui.playlist.contains(playlistItem)) {
        const idx = parseInt(playlistItem.dataset.index, 10);
        if (!isNaN(idx)) {
          if (idx !== currentIndex) loadTrack(idx, true);
          else togglePlay();
        }
        return;
      }

      const lyricLine = e.target.closest('.lyrics-line');
      if (lyricLine && ui.lyricsContent && ui.lyricsContent.contains(lyricLine)) {
        const t = parseFloat(lyricLine.dataset.time);
        if (!isNaN(t)) audio.currentTime = t;
        return;
      }

      if (e.target.closest('#playBtn')) { togglePlay(); return; }
      if (e.target.closest('#nextBtn')) { playNext(); return; }
      if (e.target.closest('#prevBtn')) { playPrev(); return; }

      if (e.target.closest('#modeBtn')) {
        playMode = (playMode + 1) % 3;
        saveSettings();
        syncStaticUi();
        return;
      }

      if (e.target.closest('#downloadBtn')) {
        if (currentIndex >= 0 && playlist[currentIndex]) {
          const a = document.createElement('a');
          a.href = playlist[currentIndex].url;
          a.download = playlist[currentIndex].fileName || playlist[currentIndex].name;
          a.click();
        }
        return;
      }

      if (e.target.closest('#volIcon')) {
        const button = document.getElementById('volIcon');
        if (volume > 0) { button._prev = volume; volume = 0; }
        else { volume = button._prev || 0.8; }
        audio.volume = volume;
        saveSettings();
        syncStaticUi();
        return;
      }

      if (e.target.closest('#plToggle')) {
        playlistOpen = !playlistOpen;
        syncStaticUi();
      }
    });

    ui.mainContent.addEventListener('input', function(e) {
      if (e.target.id === 'searchInput') {
        searchQuery = e.target.value;
        filterAndSort();
      }
    });

    ui.mainContent.addEventListener('click', function(e) {
      if (e.target.id === 'sortNameBtn') {
        sortBy = sortBy === 'name' ? 'default' : 'name';
        filterAndSort();
      }
      if (e.target.id === 'sortDateBtn') {
        sortBy = sortBy === 'date' ? 'default' : 'date';
        filterAndSort();
      }
    });

    ui.mainContent.addEventListener('click', function(e) {
      const progressBar = e.target.closest('#progressBar');
      if (progressBar) updateProgressFromClientX(e.clientX);
      const volSlider = e.target.closest('#volSlider');
      if (volSlider) updateVolumeFromClientX(e.clientX);
    });

    ui.mainContent.addEventListener('pointerdown', function(e) {
      const progressBar = e.target.closest('#progressBar');
      if (progressBar) {
        isSeekingProgress = true;
        updateProgressFromClientX(e.clientX);
        if (progressBar.setPointerCapture && e.pointerId !== undefined) progressBar.setPointerCapture(e.pointerId);
        e.preventDefault();
        return;
      }
      const volSlider = e.target.closest('#volSlider');
      if (volSlider) {
        isAdjustingVolume = true;
        updateVolumeFromClientX(e.clientX);
        if (volSlider.setPointerCapture && e.pointerId !== undefined) volSlider.setPointerCapture(e.pointerId);
        e.preventDefault();
      }
    });

    window.addEventListener('pointermove', function(e) {
      if (isSeekingProgress) updateProgressFromClientX(e.clientX);
      if (isAdjustingVolume) updateVolumeFromClientX(e.clientX);
    });

    window.addEventListener('pointerup', function() {
      isSeekingProgress = false;
      isAdjustingVolume = false;
    });

    window.addEventListener('pointercancel', function() {
      isSeekingProgress = false;
      isAdjustingVolume = false;
    });

    audio.addEventListener('timeupdate', function(){
      if (!audio.duration) return;
      if (ui.progressFill) ui.progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
      if (ui.timeCurrent) ui.timeCurrent.textContent = formatTime(audio.currentTime);
      updateLyrics(audio.currentTime);
    });
    audio.addEventListener('loadedmetadata', function(){
      if (ui.timeTotal) ui.timeTotal.textContent = formatTime(audio.duration);
    });
    audio.addEventListener('ended', playNext);
    audio.addEventListener('play', function(){ isPlaying = true; updatePlayBtn(); updateDisc(); updatePlaylistUI(); });
    audio.addEventListener('pause', function(){ isPlaying = false; updatePlayBtn(); updateDisc(); updatePlaylistUI(); });

    document.addEventListener('keydown', function(e){
      if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      switch(e.code){
        case 'Space': e.preventDefault(); togglePlay(); break;
        case 'ArrowRight': e.preventDefault(); playNext(); break;
        case 'ArrowLeft': e.preventDefault(); playPrev(); break;
        case 'ArrowUp':
          e.preventDefault();
          volume = Math.min(1, volume + 0.1);
          audio.volume = volume;
          saveSettings();
          syncStaticUi();
          break;
        case 'ArrowDown':
          e.preventDefault();
          volume = Math.max(0, volume - 0.1);
          audio.volume = volume;
          saveSettings();
          syncStaticUi();
          break;
        case 'KeyL':
          e.preventDefault();
          lyricsEnabled = !lyricsEnabled;
          saveSettings();
          syncStaticUi();
          break;
      }
    });
  }

  loadSettings();

  const PAGE_SIZE = 50;
  fetchMusicPage(1, PAGE_SIZE)
    .then(data => {
      if (!data) return;
      totalMusicCount = data.totalCount || 0;
      playlist = (data.files || []).map((f, i) => ({
        ...f,
        _id: i,
        lyrics: null,
        cover: f.coverUrl || null,
        lrcUrl: f.lrcUrl || null
      }));
      filteredPlaylist = [...playlist];
      renderPlayer();
      if (playlist.length > 0) {
        currentIndex = 0;
        loadTrack(0, false);
      }
      if (data.hasMore) loadRemainingPages(data.totalPages, PAGE_SIZE);
    })
    .catch(err => {
      const loading = document.getElementById('loadingState');
      if (loading) {
        loading.innerHTML =
          '<div class="empty-state" style="min-height:auto;padding:0">' +
          '<div class="icon">\u26A0\uFE0F</div>' +
          '<p>' + (err.message || '加载失败') + '</p>' +
          '<div class="hint">请检查网络连接</div></div>';
      }
    });
})();
</script>
</body>
</html>

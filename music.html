<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Player</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --nc-red:#ec4141;
  --nc-red-light:#ff6b6b;
  --nc-red-dark:#c93636;
  --bg-deep:#121212;
  --bg-main:#1a1a1a;
  --bg-elevated:#242424;
  --bg-card:#2a2a2a;
  --bg-hover:#333;
  --text-primary:#ffffff;
  --text-secondary:rgba(255,255,255,0.7);
  --text-tertiary:rgba(255,255,255,0.5);
  --text-muted:rgba(255,255,255,0.35);
  --border-subtle:rgba(255,255,255,0.06);
  --border-light:rgba(255,255,255,0.1);
  --shadow-soft:0 8px 32px rgba(0,0,0,0.4);
  --shadow-medium:0 16px 48px rgba(0,0,0,0.5);
  --shadow-strong:0 24px 64px rgba(0,0,0,0.6);
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
  --radius-xl:24px;
  --radius-full:9999px;
  --ease-out:cubic-bezier(0.16,1,0.3,1);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
  --ease-smooth:cubic-bezier(0.4,0,0.2,1);
}
html{background:var(--bg-deep);color-scheme:dark}
body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--text-primary);
  background:var(--bg-deep);
  overflow-x:hidden;
  line-height:1.5;
}

.app-container{
  position:relative;
  width:100%;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.dynamic-bg{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
}
.dynamic-bg::before{
  content:"";
  position:absolute;
  inset:-50%;
  background-size:cover;
  background-position:center;
  filter:blur(80px) saturate(1.5) brightness(0.4);
  transform:scale(1.5);
  opacity:0;
  transition:opacity 0.8s var(--ease-smooth);
}
.dynamic-bg.active::before{opacity:0.6}
.dynamic-bg::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(18,18,18,0.2) 0%,rgba(18,18,18,0.8) 50%,rgba(18,18,18,0.95) 100%);
}

.loading-screen,.empty-screen{
  position:relative;
  z-index:1;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 24px;
  text-align:center;
}
.loading-spinner{
  width:48px;
  height:48px;
  border-radius:50%;
  border:3px solid var(--border-light);
  border-top-color:var(--nc-red);
  animation:spin 1s linear infinite;
  margin-bottom:20px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-icon{font-size:64px;opacity:0.4;margin-bottom:16px}
.empty-title{font-size:20px;font-weight:600;margin-bottom:8px}
.empty-hint{font-size:14px;color:var(--text-tertiary);max-width:320px}

.auth-form{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:24px;
  width:100%;
  max-width:280px;
}
.auth-form input{
  width:100%;
  padding:14px 18px;
  border:1px solid var(--border-light);
  border-radius:var(--radius-lg);
  background:var(--bg-elevated);
  color:var(--text-primary);
  font-size:15px;
  outline:none;
  transition:border-color 0.2s,background 0.2s;
}
.auth-form input:focus{
  border-color:var(--nc-red);
  background:var(--bg-card);
}
.auth-form button{
  padding:14px 24px;
  border:none;
  border-radius:var(--radius-lg);
  background:linear-gradient(135deg,var(--nc-red),var(--nc-red-dark));
  color:#fff;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:transform 0.2s,box-shadow 0.2s;
}
.auth-form button:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(236,65,65,0.4);
}

.main-layout{
  position:relative;
  z-index:1;
  flex:1;
  display:grid;
  grid-template-columns:1fr 360px;
  gap:0;
  max-width:1600px;
  margin:0 auto;
  width:100%;
}

.player-section{
  display:flex;
  flex-direction:column;
  padding:40px 48px;
  min-height:100vh;
}

.cover-area{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px 0;
}

.disc-container{
  position:relative;
  width:min(380px,50vw);
  aspect-ratio:1;
}
.disc-needle{
  position:absolute;
  top:-12%;
  left:50%;
  width:28%;
  height:auto;
  transform-origin:top left;
  transform:rotate(-25deg);
  transition:transform 0.4s var(--ease-spring);
  z-index:10;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5));
}
.disc-needle.playing{transform:rotate(0deg)}
.disc-needle svg{width:100%;height:auto}
.disc-wrapper{
  position:relative;
  width:100%;
  height:100%;
}
.disc-outer{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:linear-gradient(145deg,#1a1a1a,#0a0a0a);
  box-shadow:
    0 0 0 8px rgba(0,0,0,0.3),
    0 20px 60px rgba(0,0,0,0.6),
    inset 0 0 80px rgba(0,0,0,0.5);
}
.disc-grooves{
  position:absolute;
  inset:8%;
  border-radius:50%;
  background:repeating-radial-gradient(
    circle at center,
    rgba(60,60,60,0.3) 0px,
    rgba(40,40,40,0.2) 1px,
    rgba(60,60,60,0.3) 2px,
    rgba(30,30,30,0.2) 3px
  );
}
.disc-cover-wrap{
  position:absolute;
  inset:18%;
  border-radius:50%;
  overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
}
.disc-cover{
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity 0.5s var(--ease-smooth);
}
.disc-cover.loaded{opacity:1}
.disc-cover-placeholder{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--bg-elevated),var(--bg-card));
  font-size:72px;
  opacity:0.3;
  transition:opacity 0.3s;
}
.disc-cover.loaded+.disc-cover-placeholder{opacity:0}
.disc-center{
  position:absolute;
  inset:calc(50% - 12px);
  border-radius:50%;
  background:radial-gradient(circle,var(--bg-elevated),var(--bg-deep));
  box-shadow:0 2px 8px rgba(0,0,0,0.5);
}
.disc-center::after{
  content:"";
  position:absolute;
  inset:calc(50% - 4px);
  border-radius:50%;
  background:var(--nc-red);
}

.disc-spin{
  position:absolute;
  inset:8%;
  border-radius:50%;
  transition:transform 0s;
}
.disc-spin.rotating{animation:discRotate 20s linear infinite}
.disc-spin.paused{animation-play-state:paused}
@keyframes discRotate{to{transform:rotate(360deg)}}

.song-info{
  text-align:center;
  margin-top:40px;
  max-width:100%;
  padding:0 20px;
}
.song-title{
  font-size:28px;
  font-weight:700;
  margin-bottom:8px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  transition:color 0.3s;
}
.song-artist{
  font-size:16px;
  color:var(--text-secondary);
  margin-bottom:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.song-file{
  font-size:13px;
  color:var(--text-muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.control-area{
  padding:24px 0;
}
.progress-section{
  margin-bottom:24px;
}
.progress-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  font-size:12px;
  color:var(--text-tertiary);
}
.progress-time{font-variant-numeric:tabular-nums}
.progress-track{
  position:relative;
  height:4px;
  background:var(--bg-elevated);
  border-radius:var(--radius-full);
  cursor:pointer;
  overflow:visible;
}
.progress-track:hover{height:6px}
.progress-fill{
  position:relative;
  height:100%;
  background:linear-gradient(90deg,var(--nc-red),var(--nc-red-light));
  border-radius:var(--radius-full);
  width:0%;
  transition:width 0.1s linear;
}
.progress-thumb{
  position:absolute;
  right:-6px;
  top:50%;
  transform:translateY(-50%) scale(0);
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--text-primary);
  box-shadow:0 2px 8px rgba(0,0,0,0.3);
  transition:transform 0.2s var(--ease-spring);
}
.progress-track:hover .progress-thumb{transform:translateY(-50%) scale(1)}

.main-controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
  margin-bottom:20px;
}
.ctrl-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  border:none;
  background:transparent;
  color:var(--text-secondary);
  cursor:pointer;
  border-radius:50%;
  transition:transform 0.2s var(--ease-spring),color 0.2s,background 0.2s;
}
.ctrl-btn:hover{
  color:var(--text-primary);
  transform:scale(1.1);
}
.ctrl-btn:active{transform:scale(0.95)}
.ctrl-btn.small{width:40px;height:40px;font-size:18px}
.ctrl-btn.medium{width:48px;height:48px;font-size:22px}
.ctrl-btn.large{
  width:64px;
  height:64px;
  font-size:28px;
  background:linear-gradient(135deg,var(--nc-red),var(--nc-red-dark));
  color:#fff;
  box-shadow:0 8px 24px rgba(236,65,65,0.4);
}
.ctrl-btn.large:hover{
  transform:scale(1.08);
  box-shadow:0 12px 32px rgba(236,65,65,0.5);
}

.secondary-controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}
.volume-control{
  display:flex;
  align-items:center;
  gap:12px;
}
.volume-slider{
  width:100px;
  height:4px;
  background:var(--bg-elevated);
  border-radius:var(--radius-full);
  cursor:pointer;
  position:relative;
}
.volume-fill{
  height:100%;
  background:var(--nc-red);
  border-radius:var(--radius-full);
  transition:width 0.1s;
}
.volume-icon{font-size:18px;cursor:pointer;transition:transform 0.2s}
.volume-icon:hover{transform:scale(1.1)}

.extra-actions{
  display:flex;
  align-items:center;
  gap:8px;
}
.action-btn{
  padding:8px 14px;
  border:1px solid var(--border-light);
  border-radius:var(--radius-lg);
  background:transparent;
  color:var(--text-tertiary);
  font-size:12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  transition:all 0.2s;
}
.action-btn:hover{
  border-color:var(--nc-red);
  color:var(--nc-red);
  background:rgba(236,65,65,0.1);
}
.action-btn.active{
  border-color:var(--nc-red);
  color:var(--nc-red);
  background:rgba(236,65,65,0.15);
}

.lyrics-section{
  margin-top:24px;
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-xl);
  background:rgba(255,255,255,0.02);
  overflow:hidden;
}
.lyrics-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 20px;
  border-bottom:1px solid var(--border-subtle);
}
.lyrics-title{font-size:15px;font-weight:600}
.lyrics-subtitle{font-size:12px;color:var(--text-muted);margin-top:2px}
.lyrics-status{
  font-size:11px;
  padding:4px 10px;
  border-radius:var(--radius-full);
  background:var(--bg-elevated);
  color:var(--text-tertiary);
}
.lyrics-content{
  max-height:200px;
  overflow-y:auto;
  padding:16px 20px;
  scroll-behavior:smooth;
  mask-image:linear-gradient(to bottom,transparent 0%,#000 8%,#000 92%,transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 8%,#000 92%,transparent 100%);
}
.lyrics-content::-webkit-scrollbar{width:4px}
.lyrics-content::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:var(--radius-full)}
.lyrics-line{
  padding:10px 16px;
  border-radius:var(--radius-md);
  font-size:14px;
  color:var(--text-muted);
  text-align:center;
  cursor:pointer;
  transition:all 0.3s var(--ease-smooth);
}
.lyrics-line:hover{color:var(--text-tertiary);background:rgba(255,255,255,0.03)}
.lyrics-line.active{
  color:var(--text-primary);
  font-size:16px;
  font-weight:600;
  background:rgba(236,65,65,0.1);
}
.lyrics-empty{
  padding:40px 20px;
  text-align:center;
  color:var(--text-muted);
  font-size:14px;
}

.playlist-section{
  display:flex;
  flex-direction:column;
  background:var(--bg-main);
  border-left:1px solid var(--border-subtle);
  min-height:100vh;
}
.playlist-header{
  padding:24px 24px 16px;
  border-bottom:1px solid var(--border-subtle);
}
.playlist-title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}
.playlist-title{font-size:20px;font-weight:700}
.playlist-desc{font-size:13px;color:var(--text-tertiary);margin-top:4px}
.playlist-toggle{
  width:36px;
  height:36px;
  border:none;
  background:var(--bg-elevated);
  color:var(--text-secondary);
  border-radius:50%;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.2s;
}
.playlist-toggle:hover{background:var(--bg-hover);color:var(--text-primary)}
.toggle-arrow{transition:transform 0.3s var(--ease-spring)}
.toggle-arrow.open{transform:rotate(180deg)}

.playlist-tools{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:10px;
  margin-bottom:12px;
}
.search-input-wrap{
  position:relative;
}
.search-input-wrap::before{
  content:"🔍";
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  font-size:14px;
  opacity:0.5;
}
.search-input{
  width:100%;
  height:40px;
  padding:0 14px 0 40px;
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-lg);
  background:var(--bg-elevated);
  color:var(--text-primary);
  font-size:13px;
  outline:none;
  transition:all 0.2s;
}
.search-input:focus{
  border-color:var(--nc-red);
  background:var(--bg-card);
}
.search-input::placeholder{color:var(--text-muted)}
.sort-btn{
  min-width:44px;
  height:40px;
  padding:0 14px;
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-lg);
  background:var(--bg-elevated);
  color:var(--text-tertiary);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:all 0.2s;
}
.sort-btn:hover{border-color:var(--border-light);color:var(--text-secondary)}
.sort-btn.active{
  border-color:var(--nc-red);
  color:var(--nc-red);
  background:rgba(236,65,65,0.1);
}

.playlist-meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:var(--text-muted);
}
.playlist-count{font-weight:600;color:var(--text-tertiary)}

.playlist-scroll{
  flex:1;
  overflow-y:auto;
  padding:12px 16px;
}
.playlist-scroll::-webkit-scrollbar{width:6px}
.playlist-scroll::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:var(--radius-full)}
.playlist-scroll::-webkit-scrollbar-track{background:transparent}

.playlist-items{
  display:flex;
  flex-direction:column;
  gap:4px;
  transition:opacity 0.3s,max-height 0.3s;
}
.playlist-items.collapsed{
  opacity:0;
  max-height:0;
  overflow:hidden;
  pointer-events:none;
}
.track-item{
  display:grid;
  grid-template-columns:36px 1fr auto;
  gap:12px;
  align-items:center;
  padding:12px 14px;
  border-radius:var(--radius-md);
  cursor:pointer;
  transition:all 0.2s var(--ease-smooth);
}
.track-item:hover{background:var(--bg-hover)}
.track-item.active{
  background:rgba(236,65,65,0.12);
}
.track-item.active::before{
  content:"";
  position:absolute;
  left:0;
  top:8px;
  bottom:8px;
  width:3px;
  border-radius:0 3px 3px 0;
  background:var(--nc-red);
}
.track-num{
  font-size:13px;
  font-weight:600;
  color:var(--text-muted);
  text-align:center;
}
.track-item.active .track-num{color:var(--nc-red)}
.track-info{min-width:0}
.track-name-pl{
  font-size:14px;
  font-weight:500;
  color:var(--text-primary);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.track-item.active .track-name-pl{color:var(--nc-red)}
.track-artist-pl{
  font-size:12px;
  color:var(--text-muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  margin-top:2px;
}
.track-item.active .track-artist-pl{color:var(--text-tertiary)}
.track-dur{
  font-size:12px;
  color:var(--text-muted);
  white-space:nowrap;
}
.track-playing{
  display:flex;
  align-items:flex-end;
  gap:2px;
  height:14px;
}
.track-playing span{
  width:3px;
  background:var(--nc-red);
  border-radius:2px;
  animation:wave 0.6s ease-in-out infinite alternate;
}
.track-playing span:nth-child(1){height:5px;animation-delay:0s}
.track-playing span:nth-child(2){height:10px;animation-delay:0.15s}
.track-playing span:nth-child(3){height:6px;animation-delay:0.3s}
@keyframes wave{to{height:14px}}

.no-results{
  padding:40px 20px;
  text-align:center;
  color:var(--text-muted);
  font-size:14px;
}

@media(max-width:1200px){
  .main-layout{grid-template-columns:1fr}
  .playlist-section{
    border-left:none;
    border-top:1px solid var(--border-subtle);
    min-height:auto;
    max-height:50vh;
  }
  .player-section{min-height:auto;padding:32px 24px}
}
@media(max-width:768px){
  .player-section{padding:24px 16px}
  .disc-container{width:min(280px,60vw)}
  .song-title{font-size:22px}
  .song-artist{font-size:14px}
  .main-controls{gap:12px}
  .ctrl-btn.large{width:56px;height:56px;font-size:24px}
  .ctrl-btn.medium{width:44px;height:44px;font-size:20px}
  .secondary-controls{flex-direction:column;gap:16px}
  .volume-control{width:100%;justify-content:center}
  .volume-slider{flex:1;max-width:160px}
  .playlist-header{padding:20px 16px 12px}
  .playlist-tools{grid-template-columns:1fr 1fr 1fr}
  .search-input-wrap{grid-column:1/-1}
  .track-item{grid-template-columns:32px 1fr}
  .track-dur{display:none}
}
@media(max-width:480px){
  .disc-container{width:min(220px,65vw)}
  .song-title{font-size:20px}
  .extra-actions{flex-wrap:wrap;justify-content:center}
  .lyrics-section{margin-top:16px}
  .lyrics-content{max-height:160px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:0.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:0.01ms!important;
  }
}
</style>
</head>
<body>

<div class="app-container">
  <div class="dynamic-bg" id="dynamicBg"></div>
  <audio id="audio" preload="metadata"></audio>

  <div id="appStage">
    <div class="loading-screen" id="loadingState">
      <div class="loading-spinner"></div>
      <p>加载中...</p>
    </div>
  </div>
</div>

<script>
(function(){
  const audio = document.getElementById('audio');
  const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playlist = [];
  let filteredPlaylist = [];
  let currentIndex = -1;
  let isPlaying = false;
  let playMode = 2;
  const modeIcons = ['🔁','🔂','🔀'];
  const modeNames = ['顺序播放','单曲循环','随机播放'];
  let volume = 0.8;
  let playlistOpen = true;
  let currentLyrics = [];
  let lyricsEnabled = true;
  let searchQuery = '';
  let sortBy = 'default';
  let isLoadingMore = false;
  let totalMusicCount = 0;
  let currentCoverUrl = '';

  const ui = { mounted: false };

  function getAuthParam() {
    const params = new URLSearchParams(window.location.search);
    const authCode = params.get('authCode');
    return authCode ? '&authCode=' + encodeURIComponent(authCode) : '';
  }

  function showAuthPrompt() {
    document.getElementById('appStage').innerHTML =
      '<div class="empty-screen">' +
      '<div class="empty-icon">🔐</div>' +
      '<div class="empty-title">需要认证</div>' +
      '<p class="empty-hint">请输入访问密码以继续</p>' +
      '<div class="auth-form">' +
      '<input type="password" id="authInput" placeholder="请输入密码">' +
      '<button id="authBtn">确定</button>' +
      '</div></div>';
    const inp = document.getElementById('authInput');
    const btn = document.getElementById('authBtn');
    if (inp) {
      inp.focus();
      inp.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') submitAuth();
      });
    }
    if (btn) btn.addEventListener('click', submitAuth);
  }

  function submitAuth() {
    const c = document.getElementById('authInput').value;
    if (c) {
      var u = new URL(location.href);
      u.searchParams.set('authCode', c);
      location.href = u.toString();
    }
  }

  function loadSettings(){
    try{
      const saved = localStorage.getItem('musicPlayerSettings');
      if(saved){
        const s = JSON.parse(saved);
        volume = s.volume || 0.8;
        playMode = s.playMode !== undefined ? s.playMode : 2;
        lyricsEnabled = s.lyricsEnabled !== false;
      }
    }catch(e){}
  }

  function saveSettings(){
    try{
      localStorage.setItem('musicPlayerSettings', JSON.stringify({ volume, playMode, lyricsEnabled }));
    }catch(e){}
  }

  function fetchMusicPage(page, pageSize) {
    return fetch(`/api/music/list?page=${page}&pageSize=${pageSize}${getAuthParam()}`)
      .then(async r => {
        if (r.status === 401) {
          showAuthPrompt();
          return null;
        }
        if (r.status === 403) {
          document.getElementById('appStage').innerHTML =
            '<div class="empty-screen">' +
            '<div class="empty-icon">🚫</div>' +
            '<div class="empty-title">音乐播放器未启用</div>' +
            '<p class="empty-hint">请在后台管理 - 其他设置中启用音乐播放器</p></div>';
          return null;
        }
        if (!r.ok) {
          const body = await r.json().catch(() => ({}));
          throw new Error(body.message || '服务不可用');
        }
        return r.json();
      });
  }

  function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function escAttr(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatTime(sec) {
    if (!sec || isNaN(sec)) return '0:00';
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function getVisibleCountText() {
    if (totalMusicCount > 0) {
      return filteredPlaylist.length + ' / ' + totalMusicCount + ' 首' + (isLoadingMore ? ' ...' : '');
    }
    return filteredPlaylist.length + ' 首';
  }

  function getPlaylistDesc() {
    if (searchQuery) return '搜索结果';
    if (sortBy === 'name') return '按名称排序';
    if (sortBy === 'date') return '按时间排序';
    return '支持搜索、排序、键盘快捷键';
  }

    document.getElementById('appStage').innerHTML = `

          <section class="lyrics-section" id="lyricsSection" style="display:${lyricsEnabled ? 'block' : 'none'}">
            <div class="lyrics-header">
              <div>
                <div class="lyrics-title">歌词</div>
                <div class="lyrics-subtitle">点击歌词行可跳转播放位置</div>
              </div>
              <div class="lyrics-status" id="lyricsStatus">暂无歌词</div>
            </div>
            <div class="lyrics-content" id="lyricsContent">
              <div class="lyrics-empty">🎵 暂无歌词</div>
            </div>
          </section>
        </section>

        <aside class="playlist-section">
          <div class="playlist-header">
            <div class="playlist-title-row">
              <div>
                <div class="playlist-title">播放列表</div>
                <div class="playlist-desc" id="playlistDesc">${getPlaylistDesc()}</div>
              </div>
              <button class="playlist-toggle" id="plToggle" title="折叠/展开">
                <span class="toggle-arrow ${playlistOpen ? 'open' : ''}" id="toggleArrow">▼</span>
              </button>
            </div>

            <div class="playlist-tools">
              <div class="search-input-wrap">
                <input type="text" class="search-input" id="searchInput" placeholder="搜索歌曲..." value="${escAttr(searchQuery)}">
              </div>
              <button class="sort-btn ${sortBy === 'name' ? 'active' : ''}" id="sortNameBtn">A-Z</button>
              <button class="sort-btn ${sortBy === 'date' ? 'active' : ''}" id="sortDateBtn">📅</button>
            </div>

            <div class="playlist-meta">
              <span class="playlist-count" id="playlistCount">${getVisibleCountText()}</span>
              <span>点击播放</span>

      </div>`;

    audio.volume = volume;
    cacheUiRefs();
    bindEvents();
    syncUi();
  }

  function cacheUiRefs() {
    ui.dynamicBg = document.getElementById('dynamicBg');
    ui.discNeedle = document.getElementById('discNeedle');
    ui.discSpin = document.getElementById('discSpin');
    ui.discCover = document.getElementById('discCover');
    ui.coverPlaceholder = document.getElementById('coverPlaceholder');
    ui.songTitle = document.getElementById('songTitle');
    ui.songArtist = document.getElementById('songArtist');
    ui.songFile = document.getElementById('songFile');
    ui.progressFill = document.getElementById('progressFill');
    ui.timeCurrent = document.getElementById('timeCurrent');
    ui.timeTotal = document.getElementById('timeTotal');
    ui.playBtn = document.getElementById('playBtn');
    ui.modeBtn = document.getElementById('modeBtn');
    ui.volFill = document.getElementById('volFill');
    ui.volIcon = document.getElementById('volIcon');
    ui.lyricsSection = document.getElementById('lyricsSection');
    ui.lyricsContent = document.getElementById('lyricsContent');
    ui.lyricsStatus = document.getElementById('lyricsStatus');
    ui.lyricsBtn = document.getElementById('lyricsBtn');
    ui.playlistItems = document.getElementById('playlistItems');
    ui.toggleArrow = document.getElementById('toggleArrow');
    ui.searchInput = document.getElementById('searchInput');
    ui.sortNameBtn = document.getElementById('sortNameBtn');
    ui.sortDateBtn = document.getElementById('sortDateBtn');
    ui.playlistCount = document.getElementById('playlistCount');
    ui.playlistDesc = document.getElementById('playlistDesc');
  }

  function renderPlaylistItems() {
    if (filteredPlaylist.length === 0) {
      return '<div class="no-results">无匹配结果</div>';
    }
    return filteredPlaylist.map((track, i) => {
      const originalIndex = playlist.findIndex(item => item._id === track._id);
      const isActive = originalIndex === currentIndex;
      const subtitle = track.fileName || track.name || '';
      return `<div class="track-item${isActive ? ' active' : ''}" data-index="${originalIndex}">
        <span class="track-num">${isActive
          ? '<span class="track-playing"><span></span><span></span><span></span></span>'
          : (i + 1)}</span>
        <span class="track-info">
          <span class="track-name-pl">${escHtml(track.name)}</span>
          <span class="track-artist-pl">${escHtml(subtitle)}</span>
        </span>
        <span class="track-dur">${isActive ? '播放中' : formatTime(0)}</span>
      </div>`;
    }).join('');
  }

  function updatePlaylistUI() {
    if (ui.playlistItems) ui.playlistItems.innerHTML = renderPlaylistItems();
    updatePlaylistMeta();
  }

  function updatePlaylistMeta() {
    const countText = getVisibleCountText();
    if (ui.playlistCount) ui.playlistCount.textContent = countText;
    if (ui.playlistDesc) ui.playlistDesc.textContent = getPlaylistDesc();
  }

  function syncUi() {
    updatePlayBtn();
    updateDisc();
    if (ui.volFill) ui.volFill.style.width = (volume * 100) + '%';
    if (ui.volIcon) ui.volIcon.textContent = volume === 0 ? '🔇' : (volume < 0.5 ? '🔉' : '🔊');
    if (ui.modeBtn) {
      ui.modeBtn.innerHTML = `<span>${modeIcons[playMode]}</span><span>${modeNames[playMode]}</span>`;
    }
    if (ui.lyricsBtn) ui.lyricsBtn.classList.toggle('active', lyricsEnabled);
    if (ui.lyricsSection) ui.lyricsSection.style.display = lyricsEnabled ? 'block' : 'none';
    if (ui.lyricsStatus) ui.lyricsStatus.textContent = lyricsEnabled ? (currentLyrics.length ? '同步中' : '暂无歌词') : '已隐藏';
    if (ui.toggleArrow) ui.toggleArrow.classList.toggle('open', playlistOpen);
    if (ui.playlistItems) ui.playlistItems.classList.toggle('collapsed', !playlistOpen);
    if (ui.sortNameBtn) ui.sortNameBtn.classList.toggle('active', sortBy === 'name');
    if (ui.sortDateBtn) ui.sortDateBtn.classList.toggle('active', sortBy === 'date');
    updatePlaylistMeta();
  }

  function parseLyrics(lrcText) {
    if (!lrcText) return [];
    const lines = lrcText.split('\n');
    const lyrics = [];
    const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/g;
    lines.forEach(line => {
      const matches = [...line.matchAll(timeRegex)];
      if (matches.length > 0) {
        const text = line.replace(timeRegex, '').trim();
        if (text) {
          matches.forEach(match => {
            const m = parseInt(match[1], 10);
            const s = parseInt(match[2], 10);
            const ms = parseInt(match[3].padEnd(3, '0'), 10);
            lyrics.push({ time: m * 60 + s + ms / 1000, text });
          });
        }
      }
    });
    return lyrics.sort((a, b) => a.time - b.time);
  }

  function renderLyrics() {
    if (!ui.lyricsContent) return;
    if (!currentLyrics.length) {
      ui.lyricsContent.innerHTML = '<div class="lyrics-empty">🎵 暂无歌词</div>';
      if (ui.lyricsStatus) ui.lyricsStatus.textContent = lyricsEnabled ? '暂无歌词' : '已隐藏';
      return;
    }
    ui.lyricsContent.innerHTML = currentLyrics.map(line =>
      `<div class="lyrics-line" data-time="${line.time}">${escHtml(line.text)}</div>`
    ).join('');
    if (ui.lyricsStatus) ui.lyricsStatus.textContent = lyricsEnabled ? '同步中' : '已隐藏';
  }

  function updateLyrics(currentTime) {
    if (!currentLyrics.length || !lyricsEnabled || !ui.lyricsContent) return;
    let activeIndex = -1;
    for (let i = currentLyrics.length - 1; i >= 0; i--) {
      if (currentTime >= currentLyrics[i].time) { activeIndex = i; break; }
    }
    const lines = ui.lyricsContent.querySelectorAll('.lyrics-line');
    lines.forEach((line, i) => line.classList.toggle('active', i === activeIndex));
    if (activeIndex >= 0 && lines[activeIndex] && ui.lyricsSection && !prefersReducedMotion) {
      const lineEl = lines[activeIndex];
      const sRect = ui.lyricsSection.getBoundingClientRect();
      const lRect = lineEl.getBoundingClientRect();
      const offset = lRect.top - sRect.top - sRect.height / 2 + lRect.height / 2;
      ui.lyricsSection.scrollTop += offset * 0.35;
    }
  }

  function updateDynamicBg(coverUrl) {
    if (!ui.dynamicBg) return;
    if (coverUrl && coverUrl !== currentCoverUrl) {
      currentCoverUrl = coverUrl;
      const bgEl = ui.dynamicBg;
      const img = new Image();
      img.onload = function() {
        bgEl.style.setProperty('--bg-image', `url(${coverUrl})`);
        (bgEl.querySelector('::before') || bgEl).style.backgroundImage = `url(${coverUrl})`;
        bgEl.classList.add('active');
      };
      img.src = coverUrl;
    } else if (!coverUrl) {
      ui.dynamicBg.classList.remove('active');
      currentCoverUrl = '';
    }
  }

  async function loadTrack(idx, autoPlay) {
    if (idx < 0 || idx >= playlist.length) return;
    currentIndex = idx;
    const track = playlist[idx];
    audio.src = track.url;

    if (ui.songTitle) ui.songTitle.textContent = track.name;
    if (ui.songArtist) ui.songArtist.textContent = track.fileName || track.name || '';
    if (ui.songFile) ui.songFile.textContent = track.url || '';
    if (ui.progressFill) ui.progressFill.style.width = '0%';
    if (ui.timeCurrent) ui.timeCurrent.textContent = '0:00';
    if (ui.timeTotal) ui.timeTotal.textContent = '0:00';

    if (ui.discCover && ui.coverPlaceholder) {
      if (track.cover) {
        ui.discCover.src = track.cover;
        ui.discCover.classList.remove('loaded');
        ui.discCover.onload = function() {
          ui.discCover.classList.add('loaded');
        };
        ui.discCover.onerror = function() {
          ui.discCover.classList.remove('loaded');
          ui.discCover.src = '';
        };
        updateDynamicBg(track.cover);
      } else {
        ui.discCover.classList.remove('loaded');
        ui.discCover.src = '';
        updateDynamicBg(null);
      }
    }

    currentLyrics = [];
    if (track.lrcUrl && !track.lyrics) {
      try {
        const res = await fetch(track.lrcUrl);
        if (res.ok) track.lyrics = await res.text();
      } catch(e) {}
    }
    currentLyrics = parseLyrics(track.lyrics);
    renderLyrics();
    updatePlaylistUI();
    syncUi();

    if (autoPlay) {
      audio.play().then(() => { isPlaying = true; updatePlayBtn(); updateDisc(); }).catch(() => {});
    }
  }

  function updatePlayBtn() {
    if (ui.playBtn) ui.playBtn.textContent = isPlaying ? '⏸' : '▶';
  }

  function updateDisc() {
    if (!ui.discSpin || !ui.discNeedle) return;
    if (isPlaying) {
      ui.discSpin.classList.add('rotating');
      ui.discSpin.classList.remove('paused');
      ui.discNeedle.classList.add('playing');
    } else {
      ui.discSpin.classList.add('paused');
      ui.discNeedle.classList.remove('playing');
    }
  }

  function togglePlay() {
    if (!playlist.length) return;
    if (isPlaying) audio.pause();
    else audio.play().catch(() => {});
  }

  function playNext() {
    if (!playlist.length) return;
    let next;
    if (playMode === 1) next = currentIndex;
    else if (playMode === 2) {
      do { next = Math.floor(Math.random() * playlist.length); }
      while (next === currentIndex && playlist.length > 1);
    } else next = (currentIndex + 1) % playlist.length;
    loadTrack(next, true);
  }

  function playPrev() {
    if (!playlist.length) return;
    let prev;
    if (playMode === 2) {
      do { prev = Math.floor(Math.random() * playlist.length); }
      while (prev === currentIndex && playlist.length > 1);
    } else prev = (currentIndex - 1 + playlist.length) % playlist.length;
    loadTrack(prev, true);
  }

  function filterAndSort() {
    filteredPlaylist = playlist.filter(track =>
      track.name.toLowerCase().includes(searchQuery.toLowerCase())
    );
    if (sortBy === 'name') filteredPlaylist.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
    else if (sortBy === 'date') filteredPlaylist.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    updatePlaylistUI();
    syncUi();
  }

  function appendToPlaylist(files, startId) {
    const newItems = files.map((f, i) => ({
      ...f,
      _id: startId + i,
      lyrics: null,
      cover: f.coverUrl || null,
      lrcUrl: f.lrcUrl || null
    }));
    playlist = playlist.concat(newItems);
    filterAndSort();
  }

  function loadRemainingPages(totalPages, pageSize) {
    let page = 2;
    function loadNext() {
      if (page > totalPages) return;
      isLoadingMore = true;
      updatePlaylistMeta();
      fetchMusicPage(page, pageSize)
        .then(data => {
          if (!data) return;
          appendToPlaylist(data.files || [], playlist.length);
          page++;
          if (page <= totalPages) {
            setTimeout(loadNext, 100);
          } else {
            isLoadingMore = false;
            updatePlaylistMeta();
          }
        })
        .catch(() => { isLoadingMore = false; updatePlaylistMeta(); });
    }
    loadNext();
  }

  function bindEvents() {
    if (ui.mounted) return;
    ui.mounted = true;

    document.getElementById('playBtn')?.addEventListener('click', togglePlay);
    document.getElementById('prevBtn')?.addEventListener('click', playPrev);
    document.getElementById('nextBtn')?.addEventListener('click', playNext);

    document.getElementById('modeBtn')?.addEventListener('click', function() {
      playMode = (playMode + 1) % 3;
      saveSettings();
      syncUi();
    });

    document.getElementById('lyricsBtn')?.addEventListener('click', function() {
      lyricsEnabled = !lyricsEnabled;
      saveSettings();
      syncUi();
    });

    document.getElementById('downloadBtn')?.addEventListener('click', function() {
      if (currentIndex >= 0 && playlist[currentIndex]) {
        const track = playlist[currentIndex];
        const a = document.createElement('a');
        a.href = track.url;
        a.download = track.name || 'audio';
        a.click();
      }
    });

    document.getElementById('plToggle')?.addEventListener('click', function() {
      playlistOpen = !playlistOpen;
      syncUi();
    });

    ui.searchInput?.addEventListener('input', function(e) {
      searchQuery = e.target.value;
      filterAndSort();
    });

    document.getElementById('sortNameBtn')?.addEventListener('click', function() {
      sortBy = sortBy === 'name' ? 'default' : 'name';
      filterAndSort();
    });

    document.getElementById('sortDateBtn')?.addEventListener('click', function() {
      sortBy = sortBy === 'date' ? 'default' : 'date';
      filterAndSort();
    });

    document.getElementById('progressTrack')?.addEventListener('click', function(e) {
      if (!audio.duration) return;
      const rect = this.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    });

    document.getElementById('volSlider')?.addEventListener('click', function(e) {
      const rect = this.getBoundingClientRect();
      volume = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      audio.volume = volume;
      saveSettings();
      syncUi();
    });

    ui.volIcon?.addEventListener('click', function() {
      if (volume > 0) {
        volume = 0;
        audio.volume = 0;
      } else {
        volume = 0.8;
        audio.volume = 0.8;
      }
      saveSettings();
      syncUi();
    });

    document.getElementById('playlistItems')?.addEventListener('click', function(e) {
      const item = e.target.closest('.track-item');
      if (item) {
        const idx = parseInt(item.dataset.index, 10);
        if (!isNaN(idx)) loadTrack(idx, true);
      }
    });

    ui.lyricsContent?.addEventListener('click', function(e) {
      const line = e.target.closest('.lyrics-line');
      if (line && line.dataset.time) {
        audio.currentTime = parseFloat(line.dataset.time);
      }
    });

    audio.addEventListener('timeupdate', function() {
      if (!audio.duration) return;
      if (ui.progressFill) ui.progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
      if (ui.timeCurrent) ui.timeCurrent.textContent = formatTime(audio.currentTime);
      updateLyrics(audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', function() {
      if (ui.timeTotal) ui.timeTotal.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', playNext);

    audio.addEventListener('play', function() {
      isPlaying = true;
      updatePlayBtn();
      updateDisc();
      updatePlaylistUI();
    });

    audio.addEventListener('pause', function() {
      isPlaying = false;
      updatePlayBtn();
      updateDisc();
      updatePlaylistUI();
    });

    document.addEventListener('keydown', function(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      switch (e.code) {
        case 'Space':
          e.preventDefault();
          togglePlay();
          break;
        case 'ArrowRight':
          e.preventDefault();
          playNext();
          break;
        case 'ArrowLeft':
          e.preventDefault();
          playPrev();
          break;
        case 'ArrowUp':
          e.preventDefault();
          volume = Math.min(1, volume + 0.1);
          audio.volume = volume;
          saveSettings();
          syncUi();
          break;
        case 'ArrowDown':
          e.preventDefault();
          volume = Math.max(0, volume - 0.1);
          audio.volume = volume;
          saveSettings();
          syncUi();
          break;
        case 'KeyL':
          e.preventDefault();
          lyricsEnabled = !lyricsEnabled;
          saveSettings();
          syncUi();
          break;
      }
    });
  }

  loadSettings();

  const PAGE_SIZE = 50;
  fetchMusicPage(1, PAGE_SIZE)
    .then(data => {
      if (!data) return;
      totalMusicCount = data.totalCount || 0;
      playlist = (data.files || []).map((f, i) => ({
        ...f,
        _id: i,
        lyrics: null,
        cover: f.coverUrl || null,
        lrcUrl: f.lrcUrl || null
      }));
      filteredPlaylist = [...playlist];
      renderPlayer();
      if (playlist.length > 0) {
        currentIndex = 0;
        loadTrack(0, false);
      }
      if (data.hasMore) loadRemainingPages(data.totalPages, PAGE_SIZE);
    })
    .catch(err => {
      document.getElementById('appStage').innerHTML =
        '<div class="empty-screen">' +
        '<div class="empty-icon">⚠️</div>' +
        '<div class="empty-title">' + (err.message || '加载失败') + '</div>' +
        '<p class="empty-hint">请检查网络连接</p></div>';
    });
})();
</script>
</body>
</html>

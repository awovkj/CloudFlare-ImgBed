<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Player</title>
<link rel="stylesheet" href="/css/theme-m3.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:var(--md-primary);
  --primary-strong:#274fb5;
  --primary-soft:color-mix(in srgb,var(--md-primary) 14%,transparent);
  --secondary:var(--md-secondary);
  --secondary-strong:#2e6f69;
  --secondary-soft:color-mix(in srgb,var(--md-secondary) 14%,transparent);
  --accent:#7ecbff;
  --success:var(--md-success);
  --bg:var(--md-background);
  --bg-elevated:var(--md-surface-container-low);
  --bg-panel:var(--md-surface-container-low);
  --bg-soft:var(--md-surface-container);
  --bg-soft-strong:var(--md-surface-container-high);
  --text:var(--md-on-surface);
  --text-muted:var(--md-on-surface-variant);
  --text-dim:var(--md-on-surface-muted);
  --border:var(--md-outline-variant);
  --border-hover:var(--md-outline);
  --border-strong:var(--md-primary);
  --shadow-xs:var(--md-elev-1);
  --shadow-sm:var(--md-elev-2);
  --shadow-md:var(--md-elev-2);
  --shadow-lg:var(--md-elev-3);
  --shadow-xl:var(--md-elev-3);
  --shadow-primary:var(--md-elev-2);
  --shadow-secondary:var(--md-elev-2);
  --radius-xs:var(--md-shape-sm);
  --radius-sm:var(--md-shape-sm);
  --radius-md:var(--md-shape-md);
  --radius-lg:var(--md-shape-lg);
  --radius-xl:var(--md-shape-lg);
  --radius-2xl:var(--md-shape-xl);
  --radius-3xl:var(--md-shape-xl);
  --radius-full:var(--md-shape-full);
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-7:32px; --space-8:40px; --space-9:48px;
  --blur:0px; --blur-sm:0px; --blur-lg:0px;
  --ease:var(--md-ease-standard);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
}
html{background:var(--bg);color-scheme:light}
body{
  min-height:100vh;
  font-family:var(--md-font-sans);
  color:var(--text);
  background:var(--md-hero-gradient),var(--md-background);
  padding:18px;
  -webkit-font-smoothing:antialiased;
}
body::before,body::after{display:none}

.app-shell{
  width:100%;
  min-height:calc(100vh - 36px);
  border-radius:var(--md-shape-xl);
  border:1px solid var(--md-outline-variant);
  overflow:hidden;
  position:relative;
  background:var(--md-surface-container-low);
  box-shadow:var(--md-elev-2);
}
.app-shell::before{display:none}

.app-container{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:minmax(0,1.55fr) minmax(320px,.8fr);
  min-height:calc(100vh - 36px);
}

.video-main{
  min-width:0;
  padding:var(--space-7);
  display:flex;
  flex-direction:column;
  gap:var(--space-6);
}

.loading,.empty-state{
  min-height:calc(100vh - 140px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:56px 28px;
  color:var(--text-muted);
}
.loading-spinner{
  width:40px;
  height:40px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,0.1);
  border-top-color:var(--primary);
  animation:spin .8s linear infinite;
  margin-bottom:14px;
}
.empty-state .icon{font-size:48px;opacity:.42;margin-bottom:12px}
.empty-state p{font-size:16px;color:var(--text)}
.empty-state .hint{font-size:13px;line-height:1.6;margin-top:8px;max-width:360px;opacity:.72}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.hero-stage{
  display:flex;
  flex-direction:column;
  gap:var(--space-5);
}

.video-stage-card{
  position:relative;
  border-radius:28px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.08);
  background:#000;
  box-shadow:var(--shadow-lg);
}
.video-stage-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,0.04),transparent 20%,transparent 72%,rgba(0,0,0,0.2));
  pointer-events:none;
  z-index:2;
}
.video-wrapper{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 22%,rgba(94,181,255,0.18),transparent 28%),
    radial-gradient(circle at 50% 78%,rgba(55,198,182,0.16),transparent 24%),
    #000;
  cursor:pointer;
}
.video-wrapper video{width:100%;height:100%;object-fit:contain;background:#000}
.video-wrapper.fullscreen-active{position:fixed;inset:0;z-index:9999;border-radius:0}

.video-title-bar{
  position:absolute;
  top:0;left:0;right:0;
  padding:16px 20px 32px;
  background:linear-gradient(180deg,rgba(0,0,0,0.72),transparent);
  font-size:13px;
  color:rgba(255,255,255,0.72);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  z-index:4;
  opacity:0;
  transition:opacity .24s var(--ease);
}
.video-wrapper:hover .video-title-bar,
.video-title-bar.visible{opacity:1}

.play-overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  z-index:4;
}
.play-overlay-btn{
  width:84px;
  height:84px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  color:var(--md-on-primary);
  background:var(--md-primary);
  box-shadow:var(--md-elev-2);
  opacity:0;
  transform:scale(.92);
  transition:opacity .18s var(--ease),transform .18s var(--ease);
}
.play-overlay-btn.show{opacity:1;transform:scale(1)}

.video-controls{
  position:absolute;
  left:0;right:0;bottom:0;
  padding:20px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,0.82) 38%,rgba(0,0,0,0.94));
  z-index:4;
  opacity:0;
  transition:opacity .24s var(--ease);
}
.video-stage-card:hover .video-controls,
.video-controls.visible{opacity:1}
.video-progress{
  position:relative;
  width:100%;
  height:7px;
  margin-bottom:14px;
  border-radius:999px;
  background:rgba(255,255,255,0.14);
  cursor:pointer;
  overflow:visible;
}
.video-progress-buffer{
  position:absolute;
  inset:0 auto 0 0;
  height:100%;
  border-radius:999px;
  background:rgba(255,255,255,0.15);
}
.video-progress-fill{
  position:relative;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--md-primary),var(--md-secondary));
  max-width:100%;
  transition:width .1s linear;
}
.video-progress-fill::after{
  content:"";
  position:absolute;
  right:-8px;
  top:50%;
  transform:translateY(-50%);
  width:16px;
  height:16px;
  border-radius:50%;
  background:#fff;
  opacity:0;
  box-shadow:0 6px 18px rgba(0,0,0,0.32);
  transition:opacity .18s var(--ease);
}
.video-progress:hover .video-progress-fill::after{opacity:1}

.controls-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:12px;
  align-items:center;
}
.controls-left,
.controls-right{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.controls-right{justify-content:flex-end}
.ctrl-btn{
  width:40px;
  height:40px;
  border-radius:var(--radius-full);
  border:1px solid var(--border);
  background:var(--bg-soft);
  color:rgba(255,255,255,0.88);
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  transition:transform .2s var(--ease),background .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease);
}
.ctrl-btn:hover{transform:translateY(-2px);background:var(--bg-soft-strong);border-color:var(--border-hover);color:#fff;box-shadow:var(--shadow-xs)}
.ctrl-btn:active{transform:translateY(0)}
.ctrl-btn.play-btn{
  width:48px;
  height:48px;
  font-size:22px;
  background:var(--md-primary);
  border-color:rgba(255,255,255,0.14);
  box-shadow:var(--shadow-primary);
}
.ctrl-btn.play-btn:hover{box-shadow:0 20px 32px rgba(47,137,255,0.28)}
.time-display{font-size:12px;color:rgba(255,255,255,0.72);font-variant-numeric:tabular-nums;white-space:nowrap}

.volume-group{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
}
.volume-slider{
  width:86px;
  height:5px;
  border-radius:999px;
  background:rgba(255,255,255,0.16);
  cursor:pointer;
  overflow:hidden;
}
.volume-fill{height:100%;max-width:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--secondary))}

.video-info-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) 260px;
  gap:var(--space-5);
  align-items:start;
}
.video-copy-card,
.watch-meta-card{
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  background:var(--bg-panel);
  box-shadow:var(--shadow-lg);
}
.video-copy-card{padding:22px 24px}
.watch-meta-card{
  padding:18px;
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}
.stage-label{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.14em;
  color:var(--text-dim);
  margin-bottom:10px;
}
.stage-label .pulse{
  width:9px;height:9px;border-radius:50%;
  background:var(--md-primary);
  box-shadow:0 0 16px rgba(47,137,255,0.28);
}
.video-title{
  font-size:clamp(26px,3.6vw,38px);
  font-weight:800;
  letter-spacing:-.04em;
  line-height:1.06;
  color:var(--text);
}
.video-meta{margin-top:10px;font-size:14px;color:var(--text-muted);line-height:1.7}
.video-file{margin-top:8px;font-size:13px;color:var(--text-dim);word-break:break-all}

.meta-pill{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  border-radius:var(--radius-lg);
  background:var(--bg-soft);
  border:1px solid var(--border);
  transition:border-color .2s var(--ease),background .2s var(--ease);
}
.meta-pill:hover{border-color:var(--border-hover);background:var(--bg-soft-strong)}
.meta-pill span{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em}
.meta-pill strong{font-size:14px;color:var(--text);font-weight:600}

.playlist-sidebar{
  position:relative;
  min-width:0;
  border-left:1px solid var(--border);
  background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.015));
  display:flex;
  flex-direction:column;
  transition:max-width .28s var(--ease),opacity .28s var(--ease),border-color .28s var(--ease);
  max-width:420px;
}
.playlist-sidebar.collapsed{max-width:0;opacity:0;border-left-color:transparent;overflow:hidden}
.sidebar-inner{display:flex;flex-direction:column;min-height:100%;padding:var(--space-7) var(--space-5) var(--space-5);gap:var(--space-5)}

.sidebar-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}
.sidebar-heading h2{font-size:24px;letter-spacing:-.03em}
.sidebar-heading p{font-size:13px;color:var(--text-muted);margin-top:8px;line-height:1.55}
.count{font-size:12px;color:var(--text-dim);font-weight:500;margin-left:8px}

.sidebar-toolbar{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto;
  gap:10px;
}
.search-box{position:relative;min-width:0}
.search-box input{
  width:100%;
  height:44px;
  padding:0 14px 0 40px;
  border-radius:var(--radius-md);
  border:1px solid var(--border);
  background:var(--bg-soft);
  color:var(--text);
  font-size:13px;
  outline:none;
  transition:border-color .2s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease);
}
.search-box input:focus{border-color:var(--border-strong);background:var(--bg-soft-strong);box-shadow:0 0 0 4px rgba(255,255,255,0.04),var(--shadow-xs)}
.search-box input::placeholder{color:var(--text-dim)}
.search-box::before{content:"\1F50D";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.58;transition:opacity .2s var(--ease)}
.search-box:focus-within::before{opacity:.8}
.toolbar-btn{
  min-width:46px;
  height:44px;
  padding:0 14px;
  border-radius:var(--radius-md);
  border:1px solid var(--border);
  background:var(--bg-soft);
  color:var(--text-muted);
  cursor:pointer;
  font-size:13px;
  font-weight:700;
  transition:transform .2s var(--ease),background .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease);
}
.toolbar-btn:hover{background:var(--md-surface-container-highest);color:var(--text);box-shadow:var(--md-elev-1)}
.toolbar-btn:active{box-shadow:none}
.toolbar-btn.active{background:var(--md-primary-container);border-color:transparent;color:var(--md-on-primary-container)}

.playlist-summary{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  font-size:12px;
  color:var(--text-dim);
}
.playlist-summary strong{font-size:13px;color:var(--text-muted)}

.playlist-items{
  flex:1;
  min-height:0;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding-right:4px;
}
.playlist-items::-webkit-scrollbar{width:6px}
.playlist-items::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:999px}
.playlist-items::-webkit-scrollbar-track{background:transparent}

.playlist-item{
  width:100%;
  display:grid;
  grid-template-columns:120px minmax(0,1fr) auto;
  gap:14px;
  align-items:center;
  padding:12px;
  border-radius:var(--radius-lg);
  border:1px solid var(--border);
  background:var(--bg-soft);
  cursor:pointer;
  position:relative;
  transition:transform .22s var(--ease),background .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease);
}
.playlist-item:hover{background:var(--md-surface-container-high);border-color:var(--border-hover);box-shadow:var(--md-elev-1)}
.playlist-item:active{box-shadow:none}
.playlist-item.active{background:var(--md-primary-container);border-color:transparent;box-shadow:var(--md-elev-1);color:var(--md-on-primary-container)}
.playlist-item.active::before{
  content:"";
  position:absolute;
  left:0;
  top:12px;
  bottom:12px;
  width:4px;
  border-radius:0 4px 4px 0;
  background:var(--md-primary);
}
.pl-thumb{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  border-radius:14px;
  overflow:hidden;
  background:var(--md-surface-container-high);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text-dim);
  font-size:18px;
}
.pl-thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .35s var(--ease),filter .35s var(--ease);
}
.playlist-item:hover .pl-thumb img{transform:scale(1.04);filter:saturate(1.08)}
.pl-thumb::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,0.26));
  pointer-events:none;
}
.pl-info{min-width:0;display:flex;flex-direction:column;gap:5px}
.pl-name{
  font-size:14px;
  font-weight:700;
  color:var(--text);
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.pl-meta{font-size:12px;color:var(--text-dim)}
.playlist-item.active .pl-meta{color:rgba(255,255,255,0.74)}
.pl-playing-icon{width:16px;height:14px;display:flex;align-items:flex-end;gap:2px}
.pl-playing-icon span{width:3px;background:#fff;border-radius:2px;animation:eq .6s ease infinite alternate}
.pl-playing-icon span:nth-child(1){height:6px;animation-delay:0s}
.pl-playing-icon span:nth-child(2){height:10px;animation-delay:.15s}
.pl-playing-icon span:nth-child(3){height:4px;animation-delay:.3s}
@keyframes eq{to{height:14px}}

.auth-card{
  display:flex;
  gap:8px;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  margin-top:18px;
}
.auth-card input{
  width:min(220px,100%);
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  background:var(--bg-soft);
  color:var(--text);
  font-size:14px;
  outline:none;
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease);
}
.auth-card input:focus{border-color:var(--border-strong);box-shadow:0 0 0 4px rgba(255,255,255,0.04)}
.auth-card button{
  padding:12px 20px;
  border:none;
  border-radius:var(--radius-md);
  background:var(--md-primary);
  color:#fff;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  box-shadow:var(--shadow-primary);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease);
}
.auth-card button:hover{transform:translateY(-2px);box-shadow:0 20px 40px rgba(47,137,255,0.28)}
.auth-card button:active{transform:translateY(0)}

@media(max-width:1180px){
  .app-container{grid-template-columns:1fr}
  .playlist-sidebar{border-left:none;border-top:1px solid var(--border);max-width:none}
  .playlist-sidebar.collapsed{max-height:0}
  .sidebar-inner{padding-top:24px}
}
@media(max-width:860px){
  body{padding:0}
  .app-shell{min-height:100vh;border-radius:0;border-left:none;border-right:none}
  .video-main{padding:20px}
  .sidebar-inner{padding:20px}
  .video-info-grid{grid-template-columns:1fr}
}
@media(max-width:640px){
  .sidebar-toolbar{grid-template-columns:1fr 1fr 1fr}
  .search-box{grid-column:1/-1}
  .playlist-item{grid-template-columns:96px minmax(0,1fr)}
  .pl-playing-icon{display:none}
  .controls-row{grid-template-columns:1fr}
  .controls-right{justify-content:flex-start}
  .video-controls{padding:16px}
  .video-title{font-size:30px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<div class="app-shell">
  <div class="app-container" id="app">
    <div class="video-main" id="videoMain">
      <div class="loading" id="loadingState">
        <div class="loading-spinner"></div>
        <p>Loading...</p>
      </div>
    </div>
    <aside class="playlist-sidebar" id="sidebar">
      <div class="sidebar-inner">
        <div class="sidebar-header">
          <div class="sidebar-heading">
            <h2>推荐列表<span class="count" id="playlistCount"></span></h2>
            <p id="playlistHint">筛选、排序并快速切换视频，保留当前字幕和播放逻辑。</p>
          </div>
          <button class="ctrl-btn" id="toggleSidebarBtn" title="Toggle playlist" style="font-size:14px">&times;</button>
        </div>
        <div class="sidebar-toolbar">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search videos...">
          </div>
          <button class="toolbar-btn" id="sortNameBtn" title="Sort by name">A-Z</button>
          <button class="toolbar-btn" id="sortDateBtn" title="Sort by date">&#x1F4C5;</button>
        </div>
        <div class="playlist-summary">
          <strong id="playlistSummaryCount">0</strong>
          <span>单击切换，当前视频再次单击为播放/暂停</span>
        </div>
        <div class="playlist-items" id="playlistItems"></div>
      </div>
    </aside>
  </div>
</div>

<script>
(function(){
  const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playlist = [];
  let filteredPlaylist = [];
  let currentIndex = -1;
  let isPlaying = false;
  let volume = 0.8;
  let searchQuery = '';
  let sortBy = 'default';
  let sidebarOpen = true;
  let controlsTimer = null;
  let video = null;

  const ui = {
    mounted: false,
    app: document.getElementById('app'),
    sidebar: document.getElementById('sidebar'),
    loadingState: document.getElementById('loadingState')
  };

  function loadSettings(){
    try{
      const saved = localStorage.getItem('videoPlayerSettings');
      if(saved){
        const s = JSON.parse(saved);
        volume = s.volume ?? 0.8;
        sidebarOpen = s.sidebarOpen !== false;
      }
    }catch(e){}
  }

  function saveSettings(){
    try{
      localStorage.setItem('videoPlayerSettings', JSON.stringify({ volume, sidebarOpen }));
    }catch(e){}
  }

  function getAuthParam() {
    const params = new URLSearchParams(window.location.search);
    const authCode = params.get('authCode');
    return authCode ? 'authCode=' + encodeURIComponent(authCode) : '';
  }

  function showAuthPrompt() {
    ui.loadingState.innerHTML =
      '<div class="empty-state" style="min-height:auto;padding:0">' +
      '<div class="icon">\u{1F512}</div>' +
      '<p>需要认证</p>' +
      '<div class="hint">请输入访问密码以继续浏览当前视频列表</div>' +
      '<div class="auth-card">' +
      '<input type="password" id="authInput" placeholder="密码">' +
      '<button onclick="var c=document.getElementById(\'authInput\').value;if(c){var u=new URL(location.href);u.searchParams.set(\'authCode\',c);location.href=u.toString()}">确定</button>' +
      '</div></div>';
    var inp = document.getElementById('authInput');
    if (inp) {
      inp.focus();
      inp.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          var c = this.value;
          if (c) { var u = new URL(location.href); u.searchParams.set('authCode', c); location.href = u.toString(); }
        }
      });
    }
  }

  function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function escAttr(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatTime(sec) {
    if (!sec || isNaN(sec)) return '0:00';
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    if (h > 0) return h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function formatSize(bytes) {
    if (!bytes) return '';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
  }

  function getPlaylistSummaryText() {
    if (searchQuery) return '已过滤推荐列表';
    if (sortBy === 'name') return '按名称排序';
    if (sortBy === 'date') return '按时间排序';
    return '自动保留字幕、全屏与播放快捷键';
  }

  function renderPlayer() {
    const mainEl = document.getElementById('videoMain');
    mainEl.innerHTML = `
      <section class="hero-stage">
        <div class="video-stage-card">
          <div class="video-wrapper" id="videoWrapper">
            <div class="video-title-bar" id="videoTitleBar">-</div>
            <video id="video" preload="auto" playsinline></video>
            <div class="play-overlay">
              <div class="play-overlay-btn" id="playOverlay">\u25B6</div>
            </div>
            <div class="video-controls" id="videoControls">
              <div class="video-progress" id="progressBar">
                <div class="video-progress-buffer" id="progressBuffer" style="width:0%"></div>
                <div class="video-progress-fill" id="progressFill" style="width:0%"></div>
              </div>
              <div class="controls-row">
                <div class="controls-left">
                  <button class="ctrl-btn play-btn" id="playBtn" title="Play">\u25B6\uFE0F</button>
                  <button class="ctrl-btn" id="prevBtn" title="Previous">\u23EE</button>
                  <button class="ctrl-btn" id="nextBtn" title="Next">\u23ED</button>
                  <div class="volume-group">
                    <button class="ctrl-btn" id="volBtn" title="Mute or unmute" style="font-size:14px">\u{1F50A}</button>
                    <div class="volume-slider" id="volSlider">
                      <div class="volume-fill" id="volFill" style="width:${volume * 100}%"></div>
                    </div>
                  </div>
                  <span class="time-display"><span id="timeCurrent">0:00</span> / <span id="timeTotal">0:00</span></span>
                </div>
                <div class="controls-right">
                  <button class="ctrl-btn" id="subBtn" title="Subtitles" style="font-size:13px">\u{1F4AC}</button>
                  <button class="ctrl-btn" id="sidebarBtn" title="Playlist" style="font-size:14px">\u2630</button>
                  <button class="ctrl-btn" id="fullscreenBtn" title="Fullscreen" style="font-size:14px">\u26F6</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="video-info-grid">
          <section class="video-copy-card">
            <div class="stage-label"><span class="pulse"></span><span>Watching now</span></div>
            <div class="video-title" id="videoTitle">-</div>
            <div class="video-meta" id="videoMeta">准备开始播放</div>
            <div class="video-file" id="videoFile">-</div>
          </section>
          <aside class="watch-meta-card">
            <div class="meta-pill"><span>列表</span><strong id="metaCount">0</strong></div>
            <div class="meta-pill"><span>字幕</span><strong id="metaSubtitle">不可用</strong></div>
            <div class="meta-pill"><span>侧栏</span><strong id="metaSidebar">已展开</strong></div>
          </aside>
        </div>
      </section>`;

    video = document.getElementById('video');
    video.volume = volume;
    cacheUiRefs();
    updatePlaylistUI();
    bindEventsOnce();
    syncStaticUi();
    if (!sidebarOpen) ui.sidebar.classList.add('collapsed');
  }

  function cacheUiRefs() {
    ui.videoWrapper = document.getElementById('videoWrapper');
    ui.videoControls = document.getElementById('videoControls');
    ui.progressBar = document.getElementById('progressBar');
    ui.progressBuffer = document.getElementById('progressBuffer');
    ui.progressFill = document.getElementById('progressFill');
    ui.playBtn = document.getElementById('playBtn');
    ui.playOverlay = document.getElementById('playOverlay');
    ui.videoTitleBar = document.getElementById('videoTitleBar');
    ui.videoTitle = document.getElementById('videoTitle');
    ui.videoMeta = document.getElementById('videoMeta');
    ui.videoFile = document.getElementById('videoFile');
    ui.timeCurrent = document.getElementById('timeCurrent');
    ui.timeTotal = document.getElementById('timeTotal');
    ui.volBtn = document.getElementById('volBtn');
    ui.volFill = document.getElementById('volFill');
    ui.playlistCount = document.getElementById('playlistCount');
    ui.playlistSummaryCount = document.getElementById('playlistSummaryCount');
    ui.playlistHint = document.getElementById('playlistHint');
    ui.metaCount = document.getElementById('metaCount');
    ui.metaSubtitle = document.getElementById('metaSubtitle');
    ui.metaSidebar = document.getElementById('metaSidebar');
    ui.playlistItems = document.getElementById('playlistItems');
    ui.searchInput = document.getElementById('searchInput');
    ui.sortNameBtn = document.getElementById('sortNameBtn');
    ui.sortDateBtn = document.getElementById('sortDateBtn');
  }

  function renderPlaylistItems() {
    return filteredPlaylist.map(track => {
      const originalIndex = playlist.findIndex(item => item._id === track._id);
      const active = originalIndex === currentIndex;
      const thumbHtml = track.posterUrl
        ? `<img src="${escAttr(track.posterUrl)}" alt="" loading="lazy" decoding="async">`
        : '\u{1F3AC}';
      return `<button class="playlist-item${active ? ' active' : ''}" data-index="${originalIndex}" type="button">
        <span class="pl-thumb">${thumbHtml}</span>
        <span class="pl-info">
          <span class="pl-name">${escHtml(track.name)}</span>
          <span class="pl-meta">${escHtml(formatSize(track.fileSize) || 'Video')}</span>
        </span>
        ${active ? '<span class="pl-playing-icon"><span></span><span></span><span></span></span>' : ''}
      </button>`;
    }).join('') || '<div class="empty-state" style="padding:20px;height:auto;min-height:auto"><p>无匹配结果</p></div>';
  }

  function updatePlaylistUI() {
    if (ui.playlistItems) ui.playlistItems.innerHTML = renderPlaylistItems();
    updatePlaylistMeta();
  }

  function updatePlaylistMeta() {
    const countText = `(${filteredPlaylist.length})`;
    if (ui.playlistCount) ui.playlistCount.textContent = countText;
    if (ui.playlistSummaryCount) ui.playlistSummaryCount.textContent = filteredPlaylist.length + ' 项';
    if (ui.playlistHint) ui.playlistHint.textContent = getPlaylistSummaryText();
    if (ui.metaCount) ui.metaCount.textContent = filteredPlaylist.length + ' 项';
    if (ui.metaSidebar) ui.metaSidebar.textContent = sidebarOpen ? '已展开' : '已收起';
    if (ui.sortNameBtn) ui.sortNameBtn.classList.toggle('active', sortBy === 'name');
    if (ui.sortDateBtn) ui.sortDateBtn.classList.toggle('active', sortBy === 'date');
  }

  function updatePlayBtn() {
    if (ui.playBtn) ui.playBtn.innerHTML = isPlaying ? '\u23F8\uFE0F' : '\u25B6\uFE0F';
    if (ui.playOverlay) ui.playOverlay.textContent = isPlaying ? '\u23F8' : '\u25B6';
  }

  function showPlayOverlay() {
    if (!ui.playOverlay) return;
    ui.playOverlay.classList.add('show');
    setTimeout(() => ui.playOverlay.classList.remove('show'), prefersReducedMotion ? 0 : 380);
  }

  function showControls() {
    if (ui.videoControls) ui.videoControls.classList.add('visible');
    if (ui.videoTitleBar) ui.videoTitleBar.classList.add('visible');
    clearTimeout(controlsTimer);
    controlsTimer = setTimeout(() => {
      if (isPlaying && ui.videoControls) ui.videoControls.classList.remove('visible');
      if (isPlaying && ui.videoTitleBar) ui.videoTitleBar.classList.remove('visible');
    }, 3000);
  }

  function syncStaticUi() {
    if (ui.sidebar) ui.sidebar.classList.toggle('collapsed', !sidebarOpen);
    if (ui.volFill) ui.volFill.style.width = (volume * 100) + '%';
    if (ui.volBtn) ui.volBtn.innerHTML = volume === 0 ? '\u{1F508}' : '\u{1F50A}';
    updatePlayBtn();
    updatePlaylistMeta();
    const current = playlist[currentIndex];
    if (ui.metaSubtitle) ui.metaSubtitle.textContent = current && current.subtitleUrl ? '可用' : '不可用';
  }

  function loadTrack(idx, autoPlay) {
    if (idx < 0 || idx >= playlist.length || !video) return;
    currentIndex = idx;
    const track = playlist[idx];

    video.src = track.url;
    if (track.posterUrl) video.poster = track.posterUrl;
    else video.removeAttribute('poster');

    while (video.firstChild) video.removeChild(video.firstChild);

    if (track.subtitleUrl) {
      const trackEl = document.createElement('track');
      trackEl.kind = 'subtitles';
      trackEl.src = track.subtitleUrl;
      trackEl.srclang = 'zh';
      trackEl.label = 'Subtitles';
      trackEl.default = true;
      video.appendChild(trackEl);
      video.addEventListener('loadedmetadata', function enableSub() {
        if (video.textTracks.length > 0) video.textTracks[0].mode = 'showing';
        video.removeEventListener('loadedmetadata', enableSub);
      });
    }

    if (ui.videoTitleBar) ui.videoTitleBar.textContent = track.name;
    if (ui.videoTitle) ui.videoTitle.textContent = track.name;
    if (ui.videoMeta) ui.videoMeta.textContent = track.subtitleUrl ? '支持字幕切换与双击全屏。' : '可直接播放，支持快捷键与侧栏切换。';
    if (ui.videoFile) ui.videoFile.textContent = track.fileName || track.url || '';
    if (ui.progressFill) ui.progressFill.style.width = '0%';
    if (ui.progressBuffer) ui.progressBuffer.style.width = '0%';
    if (ui.timeCurrent) ui.timeCurrent.textContent = '0:00';
    if (ui.timeTotal) ui.timeTotal.textContent = '0:00';

    updatePlaylistUI();
    syncStaticUi();
    scrollToActive();

    if (autoPlay) {
      video.play().then(() => { isPlaying = true; updatePlayBtn(); }).catch(() => {});
    }
  }

  function togglePlay() {
    if (!playlist.length || !video) return;
    if (isPlaying) video.pause();
    else video.play().catch(() => {});
  }

  function playNext() {
    if (!playlist.length) return;
    const next = (currentIndex + 1) % playlist.length;
    loadTrack(next, true);
  }

  function playPrev() {
    if (!playlist.length || !video) return;
    if (video.currentTime > 3) {
      video.currentTime = 0;
      return;
    }
    const prev = (currentIndex - 1 + playlist.length) % playlist.length;
    loadTrack(prev, true);
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      const el = document.getElementById('videoMain');
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }

  function toggleSubtitles() {
    if (!video || !video.textTracks.length) return;
    const track = video.textTracks[0];
    track.mode = track.mode === 'showing' ? 'hidden' : 'showing';
  }

  function filterAndSort() {
    filteredPlaylist = playlist.filter(track =>
      track.name.toLowerCase().includes(searchQuery.toLowerCase())
    );
    if (sortBy === 'name') filteredPlaylist.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
    else if (sortBy === 'date') filteredPlaylist.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    updatePlaylistUI();
  }

  function scrollToActive() {
    const active = ui.playlistItems && ui.playlistItems.querySelector('.playlist-item.active');
    if (active) active.scrollIntoView({ block: 'nearest', behavior: prefersReducedMotion ? 'auto' : 'smooth' });
  }

  function bindEventsOnce() {
    if (ui.mounted) return;
    ui.mounted = true;

    ui.app.addEventListener('click', function(e) {
      const playlistItem = e.target.closest('.playlist-item');
      if (playlistItem && ui.playlistItems && ui.playlistItems.contains(playlistItem)) {
        const idx = parseInt(playlistItem.dataset.index, 10);
        if (!isNaN(idx)) {
          if (idx !== currentIndex) loadTrack(idx, true);
          else togglePlay();
        }
        return;
      }

      if (e.target.closest('#playBtn')) { togglePlay(); return; }
      if (e.target.closest('#nextBtn')) { playNext(); return; }
      if (e.target.closest('#prevBtn')) { playPrev(); return; }
      if (e.target.closest('#fullscreenBtn')) { toggleFullscreen(); return; }
      if (e.target.closest('#subBtn')) { toggleSubtitles(); return; }

      if (e.target.closest('#sidebarBtn')) {
        sidebarOpen = !sidebarOpen;
        saveSettings();
        syncStaticUi();
        return;
      }
      if (e.target.closest('#toggleSidebarBtn')) {
        sidebarOpen = false;
        saveSettings();
        syncStaticUi();
        return;
      }

      if (e.target.closest('#volBtn')) {
        const btn = document.getElementById('volBtn');
        if (volume > 0) { btn._prev = volume; volume = 0; }
        else { volume = btn._prev || 0.8; }
        if (video) video.volume = volume;
        saveSettings();
        syncStaticUi();
      }
    });

    ui.app.addEventListener('input', function(e) {
      if (e.target.id === 'searchInput') {
        searchQuery = e.target.value;
        filterAndSort();
      }
    });

    ui.app.addEventListener('click', function(e) {
      if (e.target.id === 'sortNameBtn') {
        sortBy = sortBy === 'name' ? 'default' : 'name';
        filterAndSort();
      }
      if (e.target.id === 'sortDateBtn') {
        sortBy = sortBy === 'date' ? 'default' : 'date';
        filterAndSort();
      }
    });

    ui.app.addEventListener('click', function(e) {
      const progressBar = e.target.closest('#progressBar');
      if (progressBar) {
        if (!video || !video.duration) return;
        const rect = progressBar.getBoundingClientRect();
        video.currentTime = ((e.clientX - rect.left) / rect.width) * video.duration;
        return;
      }
      const volSlider = e.target.closest('#volSlider');
      if (volSlider) {
        const rect = volSlider.getBoundingClientRect();
        volume = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        if (video) video.volume = volume;
        saveSettings();
        syncStaticUi();
      }
    });

    ui.app.addEventListener('click', function(e) {
      const wrapper = e.target.closest('#videoWrapper');
      if (!wrapper) return;
      if (e.target.closest('.video-controls')) return;
      togglePlay();
      showPlayOverlay();
      showControls();
    });

    ui.app.addEventListener('dblclick', function(e) {
      const wrapper = e.target.closest('#videoWrapper');
      if (!wrapper) return;
      if (e.target.closest('.video-controls')) return;
      toggleFullscreen();
    });

    document.getElementById('videoMain').addEventListener('mousemove', showControls);
    document.getElementById('videoMain').addEventListener('mouseleave', function() {
      clearTimeout(controlsTimer);
      if (ui.videoControls && isPlaying) ui.videoControls.classList.remove('visible');
      if (ui.videoTitleBar && isPlaying) ui.videoTitleBar.classList.remove('visible');
    });

    document.addEventListener('keydown', function(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      switch(e.code) {
        case 'Space':
          e.preventDefault(); togglePlay(); showPlayOverlay(); showControls(); break;
        case 'ArrowRight':
          e.preventDefault();
          if (video) video.currentTime = Math.min(video.duration || 0, video.currentTime + 5);
          showControls(); break;
        case 'ArrowLeft':
          e.preventDefault();
          if (video) video.currentTime = Math.max(0, video.currentTime - 5);
          showControls(); break;
        case 'ArrowUp':
          e.preventDefault();
          volume = Math.min(1, volume + 0.1); if (video) video.volume = volume;
          saveSettings(); syncStaticUi(); showControls(); break;
        case 'ArrowDown':
          e.preventDefault();
          volume = Math.max(0, volume - 0.1); if (video) video.volume = volume;
          saveSettings(); syncStaticUi(); showControls(); break;
        case 'KeyF':
          e.preventDefault(); toggleFullscreen(); break;
        case 'KeyN':
          e.preventDefault(); playNext(); break;
        case 'KeyP':
          e.preventDefault(); playPrev(); break;
        case 'KeyM':
          e.preventDefault(); document.getElementById('volBtn') && document.getElementById('volBtn').click(); break;
        case 'KeyC':
          e.preventDefault(); toggleSubtitles(); break;
        case 'Escape':
          if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
          break;
      }
    });

    function attachVideoEvents() {
      if (!video) return;
      video.addEventListener('timeupdate', function() {
        if (!video.duration) return;
        if (ui.progressFill) ui.progressFill.style.width = (video.currentTime / video.duration * 100) + '%';
        if (ui.timeCurrent) ui.timeCurrent.textContent = formatTime(video.currentTime);
      });
      video.addEventListener('progress', function() {
        if (!video.duration || !video.buffered.length) return;
        const end = video.buffered.end(video.buffered.length - 1);
        if (ui.progressBuffer) ui.progressBuffer.style.width = (end / video.duration * 100) + '%';
      });
      video.addEventListener('loadedmetadata', function() {
        if (ui.timeTotal) ui.timeTotal.textContent = formatTime(video.duration);
        syncStaticUi();
      });
      video.addEventListener('ended', playNext);
      video.addEventListener('play', function() { isPlaying = true; updatePlayBtn(); updatePlaylistUI(); showControls(); });
      video.addEventListener('pause', function() { isPlaying = false; updatePlayBtn(); updatePlaylistUI(); showControls(); });
    }
    attachVideoEvents();
  }

  loadSettings();

  const authParam = getAuthParam();
  fetch('/api/video/list' + (authParam ? '?' + authParam : ''))
    .then(r => {
      if (r.status === 401) {
        showAuthPrompt();
        return null;
      }
      if (r.status === 403) {
        return r.json().then(() => {
          ui.loadingState.innerHTML =
            '<div class="empty-state" style="min-height:auto;padding:0"><div class="icon">\u{1F6AB}</div>' +
            '<p>视频播放器未启用</p>' +
            '<div class="hint">请在后台管理 - 其他设置中启用视频播放器</div></div>';
          return null;
        });
      }
      if (!r.ok) throw new Error('服务不可用');
      return r.json();
    })
    .then(data => {
      if (!data) return;
      playlist = (data.files || []).map((f, i) => ({ ...f, _id: i }));
      filteredPlaylist = [...playlist];
      if (playlist.length === 0) {
        ui.loadingState.innerHTML =
          '<div class="empty-state" style="min-height:auto;padding:0"><div class="icon">\u{1F3AC}</div>' +
          '<p>暂无视频文件</p>' +
          '<div class="hint">请上传视频文件到配置的目录中</div></div>';
        return;
      }
      renderPlayer();
      currentIndex = 0;
      loadTrack(0, false);
    })
    .catch(err => {
      ui.loadingState.innerHTML =
        '<div class="empty-state" style="min-height:auto;padding:0"><div class="icon">\u26A0\uFE0F</div>' +
        '<p>' + (err.message || '加载失败') + '</p>' +
        '<div class="hint">请检查网络连接</div></div>';
    });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Player</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --fabric-bg:#f5f1e8;
  --fabric-bg-warm:#e8dfd1;
  --fabric-surface:rgba(255,255,255,0.92);
  --fabric-surface-soft:rgba(250,247,240,0.88);
  --fabric-border:rgba(180,160,130,0.18);
  --fabric-border-strong:rgba(160,140,110,0.28);
  --fabric-shadow:0 4px 12px rgba(80,60,40,0.06);
  --fabric-shadow-hover:0 8px 24px rgba(80,60,40,0.1);
  --fabric-shadow-lg:0 12px 32px rgba(80,60,40,0.08);
  --fabric-text:#2f2f2f;
  --fabric-text-muted:#6b6b6b;
  --fabric-text-dim:#9a9a9a;
  --fabric-primary:#8b7355;
  --fabric-primary-strong:#a08060;
  --fabric-primary-soft:#c4a882;
  --fabric-accent:#7a9e7e;
  --fabric-accent-soft:#a8c4aa;
  --fabric-radius-lg:20px;
  --fabric-radius-md:16px;
  --fabric-radius-sm:12px;
  --fabric-radius-xs:8px;
  --fabric-ease:cubic-bezier(0.22,1,0.36,1);
  --fabric-transition:220ms var(--fabric-ease);
}
html{background:var(--fabric-bg)}
body{
  min-height:100vh;
  font-family:-apple-system,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--fabric-text);
  background:var(--fabric-bg);
  padding:18px;
  position:relative;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(180,160,130,0.015) 2px,rgba(180,160,130,0.015) 4px),
    repeating-linear-gradient(90deg,transparent,transparent 2px,rgba(180,160,130,0.015) 2px,rgba(180,160,130,0.015) 4px);
  opacity:0.7;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 20% 0%,rgba(232,223,209,0.4) 0%,transparent 50%),
    radial-gradient(ellipse at 80% 100%,rgba(245,241,232,0.3) 0%,transparent 50%);
}

.app-shell{
  width:100%;
  min-height:calc(100vh - 36px);
  border-radius:var(--fabric-radius-lg);
  border:1px dashed var(--fabric-border);
  overflow:hidden;
  position:relative;
  background:var(--fabric-surface);
  box-shadow:var(--fabric-shadow-lg);
}
.app-shell::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.5),transparent 26%,transparent 68%,rgba(232,223,209,0.1));
  pointer-events:none;
}
.app-shell::after{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(45deg,transparent,transparent 2px,rgba(180,160,130,0.02) 2px,rgba(180,160,130,0.02) 4px);
  pointer-events:none;
}

.app-container{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:minmax(0,1.55fr) minmax(320px,.8fr);
  min-height:calc(100vh - 36px);
}

.video-main{
  min-width:0;
  padding:32px;
  display:flex;
  flex-direction:column;
  gap:24px;
}

.loading,.empty-state{
  min-height:calc(100vh - 140px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:56px 28px;
  color:var(--fabric-text-muted);
}
.loading-spinner{
  width:40px;
  height:40px;
  border-radius:50%;
  border:3px solid rgba(180,160,130,0.15);
  border-top-color:var(--fabric-primary);
  animation:spin .8s linear infinite;
  margin-bottom:14px;
}
.empty-state .icon{font-size:48px;opacity:.42;margin-bottom:12px}
.empty-state p{font-size:16px;color:var(--fabric-text)}
.empty-state .hint{font-size:13px;line-height:1.6;margin-top:8px;max-width:360px;opacity:.72}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.hero-stage{
  display:flex;
  flex-direction:column;
  gap:20px;
}

.video-stage-card{
  position:relative;
  border-radius:20px;
  overflow:hidden;
  border:1px dashed var(--fabric-border);
  background:#1a1816;
  box-shadow:var(--fabric-shadow-hover);
}
.video-stage-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,0.08),transparent 20%,transparent 72%,rgba(0,0,0,0.15));
  pointer-events:none;
  z-index:2;
}
.video-wrapper{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  background:#1a1816;
  cursor:pointer;
}
.video-wrapper video{width:100%;height:100%;object-fit:contain;background:#1a1816}
.video-wrapper.fullscreen-active{position:fixed;inset:0;z-index:9999;border-radius:0}

.video-title-bar{
  position:absolute;
  top:0;left:0;right:0;
  padding:16px 20px 32px;
  background:linear-gradient(180deg,rgba(26,24,22,0.85),transparent);
  font-size:13px;
  color:rgba(255,255,255,0.85);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  z-index:4;
  opacity:0;
  transition:opacity var(--fabric-transition);
}
.video-wrapper:hover .video-title-bar,
.video-title-bar.visible{opacity:1}

.play-overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  z-index:4;
}
.play-overlay-btn{
  width:84px;
  height:84px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  color:#fff;
  background:linear-gradient(135deg,var(--fabric-primary),var(--fabric-accent));
  box-shadow:0 8px 28px rgba(0,0,0,0.3);
  opacity:0;
  transform:scale(.92);
  transition:opacity var(--fabric-transition),transform var(--fabric-transition);
}
.play-overlay-btn.show{opacity:1;transform:scale(1)}

.video-controls{
  position:absolute;
  left:0;right:0;bottom:0;
  padding:20px;
  background:linear-gradient(180deg,transparent,rgba(26,24,22,0.88) 38%,rgba(26,24,22,0.95));
  z-index:4;
  opacity:0;
  transition:opacity var(--fabric-transition);
}
.video-stage-card:hover .video-controls,
.video-controls.visible{opacity:1}
.video-progress{
  position:relative;
  width:100%;
  height:7px;
  margin-bottom:14px;
  border-radius:999px;
  background:rgba(255,255,255,0.18);
  cursor:pointer;
  overflow:visible;
}
.video-progress-buffer{
  position:absolute;
  inset:0 auto 0 0;
  height:100%;
  border-radius:999px;
  background:rgba(255,255,255,0.2);
}
.video-progress-fill{
  position:relative;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--fabric-primary),var(--fabric-accent));
  max-width:100%;
  transition:width .1s linear;
}
.video-progress-fill::after{
  content:"";
  position:absolute;
  right:-8px;
  top:50%;
  transform:translateY(-50%);
  width:16px;
  height:16px;
  border-radius:50%;
  background:#fff;
  opacity:0;
  box-shadow:var(--fabric-shadow);
  transition:opacity var(--fabric-transition);
}
.video-progress:hover .video-progress-fill::after{opacity:1}

.controls-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:12px;
  align-items:center;
}
.controls-left,
.controls-right{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.controls-right{justify-content:flex-end}
.ctrl-btn{
  width:40px;
  height:40px;
  border-radius:var(--fabric-radius-xs);
  border:1px dashed rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.9);
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  transition:transform var(--fabric-transition),background var(--fabric-transition),border-color var(--fabric-transition),color var(--fabric-transition),box-shadow var(--fabric-transition);
}
.ctrl-btn:hover{transform:translateY(-1px);background:rgba(255,255,255,0.18);border-color:rgba(255,255,255,0.25);color:#fff}
.ctrl-btn:active{transform:translateY(1px)}
.ctrl-btn.play-btn{
  width:48px;
  height:48px;
  font-size:22px;
  background:linear-gradient(135deg,var(--fabric-primary),var(--fabric-accent));
  border-color:rgba(255,255,255,0.2);
  box-shadow:0 6px 18px rgba(0,0,0,0.25);
}
.time-display{font-size:12px;color:rgba(255,255,255,0.85);font-variant-numeric:tabular-nums;white-space:nowrap}

.volume-group{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  border-radius:var(--fabric-radius-xs);
  background:rgba(255,255,255,0.1);
  border:1px dashed rgba(255,255,255,0.15);
}
.volume-slider{
  width:86px;
  height:5px;
  border-radius:999px;
  background:rgba(255,255,255,0.2);
  cursor:pointer;
  overflow:hidden;
}
.volume-fill{height:100%;max-width:100%;border-radius:999px;background:linear-gradient(90deg,var(--fabric-primary),var(--fabric-accent))}

.video-info-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) 260px;
  gap:20px;
  align-items:start;
}
.video-copy-card,
.watch-meta-card{
  border:1px dashed var(--fabric-border);
  border-radius:var(--fabric-radius-md);
  background:var(--fabric-surface);
  box-shadow:var(--fabric-shadow);
}
.video-copy-card{padding:22px 24px}
.watch-meta-card{
  padding:18px;
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}
.stage-label{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.14em;
  color:var(--fabric-text-dim);
  margin-bottom:10px;
}
.stage-label .pulse{
  width:9px;height:9px;border-radius:50%;
  background:linear-gradient(135deg,var(--fabric-primary),var(--fabric-accent));
  box-shadow:0 0 12px rgba(139,115,85,0.3);
}
.video-title{
  font-size:clamp(26px,3.6vw,38px);
  font-weight:800;
  letter-spacing:-.04em;
  line-height:1.06;
  color:var(--fabric-text);
}
.video-meta{margin-top:10px;font-size:14px;color:var(--fabric-text-muted);line-height:1.7}
.video-file{margin-top:8px;font-size:13px;color:var(--fabric-text-dim);word-break:break-all}

.meta-pill{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  border-radius:var(--fabric-radius-sm);
  background:var(--fabric-surface-soft);
  border:1px dashed var(--fabric-border);
}
.meta-pill span{font-size:12px;color:var(--fabric-text-dim);text-transform:uppercase;letter-spacing:.08em}
.meta-pill strong{font-size:14px;color:var(--fabric-text)}

.playlist-sidebar{
  position:relative;
  min-width:0;
  border-left:1px dashed var(--fabric-border);
  background:var(--fabric-surface-soft);
  display:flex;
  flex-direction:column;
  transition:max-width .28s var(--fabric-ease),opacity .28s var(--fabric-ease),border-color .28s var(--fabric-ease);
  max-width:420px;
}
.playlist-sidebar.collapsed{max-width:0;opacity:0;border-left-color:transparent;overflow:hidden}
.sidebar-inner{display:flex;flex-direction:column;min-height:100%;padding:32px 20px 20px;gap:20px}

.sidebar-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}
.sidebar-heading h2{font-size:24px;letter-spacing:-.03em;color:var(--fabric-text)}
.sidebar-heading p{font-size:13px;color:var(--fabric-text-muted);margin-top:8px;line-height:1.55}
.count{font-size:12px;color:var(--fabric-text-dim);font-weight:500;margin-left:8px}

.sidebar-toolbar{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto;
  gap:10px;
}
.search-box{position:relative;min-width:0}
.search-box input{
  width:100%;
  height:44px;
  padding:0 14px 0 40px;
  border-radius:var(--fabric-radius-sm);
  border:1px dashed var(--fabric-border);
  background:var(--fabric-surface);
  color:var(--fabric-text);
  font-size:13px;
  outline:none;
  transition:border-color var(--fabric-transition),background var(--fabric-transition),box-shadow var(--fabric-transition);
}
.search-box input:focus{border-color:var(--fabric-primary-soft);background:var(--fabric-surface);box-shadow:0 0 0 3px rgba(139,115,85,0.1)}
.search-box input::placeholder{color:var(--fabric-text-dim)}
.search-box::before{content:"\1F50D";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.58}
.toolbar-btn{
  min-width:46px;
  height:44px;
  padding:0 14px;
  border-radius:var(--fabric-radius-sm);
  border:1px dashed var(--fabric-border);
  background:var(--fabric-surface);
  color:var(--fabric-text-muted);
  cursor:pointer;
  font-size:13px;
  font-weight:700;
  transition:transform var(--fabric-transition),background var(--fabric-transition),border-color var(--fabric-transition),color var(--fabric-transition);
}
.toolbar-btn:hover{transform:translateY(-1px);background:var(--fabric-surface-soft);color:var(--fabric-text)}
.toolbar-btn.active{background:rgba(139,115,85,0.1);border-color:var(--fabric-primary-soft);color:var(--fabric-primary)}

.playlist-summary{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  font-size:12px;
  color:var(--fabric-text-dim);
}
.playlist-summary strong{font-size:13px;color:var(--fabric-text-muted)}

.playlist-items{
  flex:1;
  min-height:0;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding-right:4px;
}
.playlist-items::-webkit-scrollbar{width:6px}
.playlist-items::-webkit-scrollbar-thumb{background:rgba(180,160,130,0.25);border-radius:999px}
.playlist-items::-webkit-scrollbar-track{background:transparent}

.playlist-item{
  width:100%;
  display:grid;
  grid-template-columns:120px minmax(0,1fr) auto;
  gap:14px;
  align-items:center;
  padding:12px;
  border-radius:var(--fabric-radius-md);
  border:1px dashed var(--fabric-border);
  background:var(--fabric-surface);
  cursor:pointer;
  position:relative;
  transition:transform var(--fabric-transition),background var(--fabric-transition),border-color var(--fabric-transition),box-shadow var(--fabric-transition);
}
.playlist-item:hover{transform:translateY(-1px);background:var(--fabric-surface);border-color:var(--fabric-border-strong);box-shadow:var(--fabric-shadow)}
.playlist-item.active{background:linear-gradient(135deg,rgba(139,115,85,0.08),rgba(122,158,126,0.06));border-color:var(--fabric-primary-soft);box-shadow:var(--fabric-shadow-hover)}
.playlist-item.active::before{
  content:"";
  position:absolute;
  left:0;
  top:12px;
  bottom:12px;
  width:4px;
  border-radius:0 4px 4px 0;
  background:linear-gradient(180deg,var(--fabric-primary),var(--fabric-accent));
}
.pl-thumb{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  border-radius:var(--fabric-radius-sm);
  overflow:hidden;
  background:linear-gradient(135deg,rgba(139,115,85,0.12),rgba(122,158,126,0.12));
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--fabric-text-dim);
  font-size:18px;
}
.pl-thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .35s var(--fabric-ease),filter .35s var(--fabric-ease);
}
.playlist-item:hover .pl-thumb img{transform:scale(1.04);filter:saturate(1.05)}
.pl-thumb::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,0.2));
  pointer-events:none;
}
.pl-info{min-width:0;display:flex;flex-direction:column;gap:5px}
.pl-name{
  font-size:14px;
  font-weight:700;
  color:var(--fabric-text);
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.pl-meta{font-size:12px;color:var(--fabric-text-dim)}
.playlist-item.active .pl-meta{color:var(--fabric-text-muted)}
.pl-playing-icon{width:16px;height:14px;display:flex;align-items:flex-end;gap:2px}
.pl-playing-icon span{width:3px;background:var(--fabric-primary);border-radius:2px;animation:eq .6s ease infinite alternate}
.pl-playing-icon span:nth-child(1){height:6px;animation-delay:0s}
.pl-playing-icon span:nth-child(2){height:10px;animation-delay:.15s}
.pl-playing-icon span:nth-child(3){height:4px;animation-delay:.3s}
@keyframes eq{to{height:14px}}

.auth-card{
  display:flex;
  gap:8px;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  margin-top:18px;
}
.auth-card input{
  width:min(220px,100%);
  padding:12px 14px;
  border:1px dashed var(--fabric-border);
  border-radius:var(--fabric-radius-sm);
  background:var(--fabric-surface);
  color:var(--fabric-text);
  font-size:14px;
  outline:none;
}
.auth-card input:focus{border-color:var(--fabric-primary-soft);box-shadow:0 0 0 3px rgba(139,115,85,0.1)}
.auth-card button{
  padding:12px 16px;
  border:none;
  border-radius:var(--fabric-radius-sm);
  background:linear-gradient(135deg,var(--fabric-primary),var(--fabric-primary-strong));
  color:#fff;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  border:1px dashed rgba(255,255,255,0.2);
}
.auth-card button:hover{box-shadow:0 4px 14px rgba(139,115,85,0.2)}
.auth-card button:active{transform:translateY(1px)}

@media(max-width:1180px){
  .app-container{grid-template-columns:1fr}
  .playlist-sidebar{border-left:none;border-top:1px dashed var(--fabric-border);max-width:none}
  .playlist-sidebar.collapsed{max-height:0}
  .sidebar-inner{padding-top:24px}
}
@media(max-width:860px){
  body{padding:0}
  .app-shell{min-height:100vh;border-radius:0;border-left:none;border-right:none}
  .video-main{padding:20px}
  .sidebar-inner{padding:20px}
  .video-info-grid{grid-template-columns:1fr}
}
@media(max-width:640px){
  .sidebar-toolbar{grid-template-columns:1fr 1fr 1fr}
  .search-box{grid-column:1/-1}
  .playlist-item{grid-template-columns:96px minmax(0,1fr)}
  .pl-playing-icon{display:none}
  .controls-row{grid-template-columns:1fr}
  .controls-right{justify-content:flex-start}
  .video-controls{padding:16px}
  .video-title{font-size:30px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<div class="app-shell">
  <div class="app-container" id="app">
    <div class="video-main" id="videoMain">
      <div class="loading" id="loadingState">
        <div class="loading-spinner"></div>
        <p>Loading...</p>
      </div>
    </div>
    <aside class="playlist-sidebar" id="sidebar">
      <div class="sidebar-inner">
        <div class="sidebar-header">
          <div class="sidebar-heading">
            <h2>Playlist<span class="count" id="playlistCount"></span></h2>
            <p id="playlistHint">Browse, search, and play your video collection</p>
          </div>
          <button class="ctrl-btn" id="toggleSidebarBtn" title="Toggle playlist" style="font-size:14px">&times;</button>
        </div>
        <div class="sidebar-toolbar">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search videos...">
          </div>
          <button class="toolbar-btn" id="sortNameBtn" title="Sort by name">A-Z</button>
          <button class="toolbar-btn" id="sortDateBtn" title="Sort by date">&#x1F4C5;</button>
        </div>
        <div class="playlist-summary">
          <strong id="playlistSummaryCount">0</strong>
          <span>Click to play</span>
        </div>
        <div class="playlist-items" id="playlistItems"></div>
      </div>
    </aside>
  </div>
</div>

<script>
(function(){
  const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playlist = [];
  let filteredPlaylist = [];
  let currentIndex = -1;
  let isPlaying = false;
  let volume = 0.8;
  let searchQuery = '';
  let sortBy = 'default';
  let sidebarOpen = true;
  let controlsTimer = null;
  let video = null;

  const ui = {
    mounted: false,
    app: document.getElementById('app'),
    sidebar: document.getElementById('sidebar'),
    loadingState: document.getElementById('loadingState')
  };

  function loadSettings(){
    try{
      const saved = localStorage.getItem('videoPlayerSettings');
      if(saved){
        const s = JSON.parse(saved);
        volume = s.volume ?? 0.8;
        sidebarOpen = s.sidebarOpen !== false;
      }
    }catch(e){}
  }

  function saveSettings(){
    try{
      localStorage.setItem('videoPlayerSettings', JSON.stringify({ volume, sidebarOpen }));
    }catch(e){}
  }

  function getAuthParam() {
    const params = new URLSearchParams(window.location.search);
    const authCode = params.get('authCode');
    return authCode ? 'authCode=' + encodeURIComponent(authCode) : '';
  }

  function showAuthPrompt() {
    ui.loadingState.innerHTML =
      '<div class="empty-state" style="min-height:auto;padding:0">' +
      '<div class="icon">\u{1F512}</div>' +
      '<p>Authentication Required</p>' +
      '<div class="hint">Please enter the access password to continue browsing the video list</div>' +
      '<div class="auth-card">' +
      '<input type="password" id="authInput" placeholder="Password">' +
      '<button onclick="var c=document.getElementById(\'authInput\').value;if(c){var u=new URL(location.href);u.searchParams.set(\'authCode\',c);location.href=u.toString()}">Confirm</button>' +
      '</div></div>';
    var inp = document.getElementById('authInput');
    if (inp) {
      inp.focus();
      inp.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          var c = this.value;
          if (c) { var u = new URL(location.href); u.searchParams.set('authCode', c); location.href = u.toString(); }
        }
      });
    }
  }

  function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function escAttr(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatTime(sec) {
    if (!sec || isNaN(sec)) return '0:00';
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    if (h > 0) {
      return h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function formatFileSize(bytes) {
    if (!bytes) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) {
      bytes /= 1024;
      i++;
    }
    return bytes.toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
  }

  function renderApp() {
    if (ui.mounted) return;
    ui.mounted = true;

    const videoMain = document.getElementById('videoMain');
    videoMain.innerHTML = `
      <div class="hero-stage">
        <div class="video-stage-card">
          <div class="video-wrapper" id="videoWrapper">
            <video id="videoPlayer" playsinline></video>
            <div class="video-title-bar" id="videoTitleBar"></div>
            <div class="play-overlay">
              <div class="play-overlay-btn" id="playOverlayBtn">\u{25B6}</div>
            </div>
            <div class="video-controls" id="videoControls">
              <div class="video-progress" id="videoProgress">
                <div class="video-progress-buffer" id="videoProgressBuffer"></div>
                <div class="video-progress-fill" id="videoProgressFill"></div>
              </div>
              <div class="controls-row">
                <div class="controls-left">
                  <button class="ctrl-btn play-btn" id="playBtn">\u{25B6}</button>
                  <div class="volume-group">
                    <button class="ctrl-btn" id="volumeBtn" style="width:32px;height:32px;font-size:14px">\u{1F50A}</button>
                    <div class="volume-slider" id="volumeSlider">
                      <div class="volume-fill" id="volumeFill" style="width:80%"></div>
                    </div>
                  </div>
                </div>
                <div class="controls-right">
                  <button class="ctrl-btn" id="fullscreenBtn" title="Fullscreen">\u{26F6}</button>
                  <span class="time-display"><span id="currentTime">0:00</span> / <span id="totalTime">0:00</span></span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="video-info-grid">
          <div class="video-copy-card">
            <div class="stage-label">
              <span class="pulse"></span>
              <span>NOW PLAYING</span>
            </div>
            <h1 class="video-title" id="videoTitle">Select a video</h1>
            <div class="video-meta" id="videoMeta">-</div>
            <div class="video-file" id="videoFile">-</div>
          </div>
          <div class="watch-meta-card">
            <div class="meta-pill">
              <span>Duration</span>
              <strong id="metaDuration">-</strong>
            </div>
            <div class="meta-pill">
              <span>Size</span>
              <strong id="metaSize">-</strong>
            </div>
            <div class="meta-pill">
              <span>Format</span>
              <strong id="metaFormat">-</strong>
            </div>
          </div>
        </div>
      </div>
    `;

    video = document.getElementById('videoPlayer');
    video.volume = volume;
    bindEvents();
    updatePlaylistUI();
    if (!sidebarOpen) toggleSidebar();
  }

  function bindEvents() {
    document.getElementById('playBtn').addEventListener('click', togglePlay);
    document.getElementById('playOverlayBtn').addEventListener('click', togglePlay);
    document.getElementById('videoWrapper').addEventListener('click', handleVideoClick);
    document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
    document.getElementById('volumeBtn').addEventListener('click', toggleMute);
    document.getElementById('volumeSlider').addEventListener('click', handleVolumeClick);
    document.getElementById('videoProgress').addEventListener('click', handleProgressClick);
    document.getElementById('searchInput').addEventListener('input', handleSearch);
    document.getElementById('sortNameBtn').addEventListener('click', () => sortPlaylist('name'));
    document.getElementById('sortDateBtn').addEventListener('click', () => sortPlaylist('date'));
    document.getElementById('toggleSidebarBtn').addEventListener('click', toggleSidebar);

    video.addEventListener('play', () => { isPlaying = true; updatePlayButton(); });
    video.addEventListener('pause', () => { isPlaying = false; updatePlayButton(); });
    video.addEventListener('timeupdate', updateProgress);
    video.addEventListener('loadedmetadata', () => {
      document.getElementById('totalTime').textContent = formatTime(video.duration);
      document.getElementById('metaDuration').textContent = formatTime(video.duration);
    });
    video.addEventListener('progress', updateBuffer);
    video.addEventListener('ended', playNext);

    const wrapper = document.getElementById('videoWrapper');
    wrapper.addEventListener('mousemove', showControls);
    wrapper.addEventListener('mouseleave', hideControls);

    document.addEventListener('keydown', handleKeydown);
    document.addEventListener('fullscreenchange', handleFullscreenChange);
  }

  function handleVideoClick(e) {
    if (e.target.closest('.video-controls') || e.target.closest('.play-overlay-btn')) return;
    togglePlay();
  }

  function togglePlay() {
    if (currentIndex < 0 && filteredPlaylist.length > 0) {
      playVideo(0);
      return;
    }
    if (video.paused) {
      video.play();
    } else {
      video.pause();
    }
  }

  function playVideo(index) {
    if (index < 0 || index >= filteredPlaylist.length) return;
    currentIndex = index;
    const item = filteredPlaylist[index];
    video.src = item.url + (getAuthParam() ? '?' + getAuthParam() : '');
    video.play();
    updateNowPlaying(item);
    updatePlaylistUI();
  }

  function playPrev() {
    if (filteredPlaylist.length === 0) return;
    const newIndex = currentIndex <= 0 ? filteredPlaylist.length - 1 : currentIndex - 1;
    playVideo(newIndex);
  }

  function playNext() {
    if (filteredPlaylist.length === 0) return;
    const newIndex = currentIndex >= filteredPlaylist.length - 1 ? 0 : currentIndex + 1;
    playVideo(newIndex);
  }

  function toggleFullscreen() {
    const wrapper = document.getElementById('videoWrapper');
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      wrapper.requestFullscreen();
    }
  }

  function handleFullscreenChange() {
    const wrapper = document.getElementById('videoWrapper');
    wrapper.classList.toggle('fullscreen-active', !!document.fullscreenElement);
  }

  function toggleMute() {
    video.muted = !video.muted;
    document.getElementById('volumeBtn').textContent = video.muted ? '\u{1F507}' : '\u{1F50A}';
  }

  function handleVolumeClick(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    volume = Math.max(0, Math.min(1, percent));
    video.volume = volume;
    document.getElementById('volumeFill').style.width = (volume * 100) + '%';
    saveSettings();
  }

  function handleProgressClick(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    video.currentTime = percent * video.duration;
  }

  function updateProgress() {
    if (video.duration) {
      const percent = (video.currentTime / video.duration) * 100;
      document.getElementById('videoProgressFill').style.width = percent + '%';
      document.getElementById('currentTime').textContent = formatTime(video.currentTime);
    }
  }

  function updateBuffer() {
    if (video.buffered.length > 0 && video.duration) {
      const bufferedEnd = video.buffered.end(video.buffered.length - 1);
      const percent = (bufferedEnd / video.duration) * 100;
      document.getElementById('videoProgressBuffer').style.width = percent + '%';
    }
  }

  function updatePlayButton() {
    const playIcon = isPlaying ? '\u{23F8}' : '\u{25B6}';
    document.getElementById('playBtn').textContent = playIcon;
    document.getElementById('playOverlayBtn').textContent = playIcon;
    document.getElementById('playOverlayBtn').classList.toggle('show', !isPlaying);
  }

  function showControls() {
    const controls = document.getElementById('videoControls');
    const titleBar = document.getElementById('videoTitleBar');
    controls.classList.add('visible');
    titleBar.classList.add('visible');
    clearTimeout(controlsTimer);
    controlsTimer = setTimeout(hideControls, 3000);
  }

  function hideControls() {
    if (isPlaying) {
      document.getElementById('videoControls').classList.remove('visible');
      document.getElementById('videoTitleBar').classList.remove('visible');
    }
  }

  function handleSearch(e) {
    searchQuery = e.target.value.toLowerCase();
    filterPlaylist();
    updatePlaylistUI();
  }

  function sortPlaylist(type) {
    sortBy = type;
    document.getElementById('sortNameBtn').classList.toggle('active', type === 'name');
    document.getElementById('sortDateBtn').classList.toggle('active', type === 'date');
    filterPlaylist();
    updatePlaylistUI();
  }

  function filterPlaylist() {
    filteredPlaylist = playlist.filter(item => {
      const name = (item.name || '').toLowerCase();
      return name.includes(searchQuery);
    });
    if (sortBy === 'name') {
      filteredPlaylist.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    } else if (sortBy === 'date') {
      filteredPlaylist.sort((a, b) => (b.uploadDate || 0) - (a.uploadDate || 0));
    }
  }

  function toggleSidebar() {
    sidebarOpen = !sidebarOpen;
    document.getElementById('sidebar').classList.toggle('collapsed', !sidebarOpen);
    saveSettings();
  }

  function updateNowPlaying(item) {
    document.getElementById('videoTitle').textContent = item.name || 'Unknown';
    document.getElementById('videoTitleBar').textContent = item.name || '';
    document.getElementById('videoMeta').textContent = 'Video file';
    document.getElementById('videoFile').textContent = item.url || '';
    document.getElementById('metaSize').textContent = formatFileSize(item.size);
    document.getElementById('metaFormat').textContent = (item.name || '').split('.').pop().toUpperCase();
  }

  function updatePlaylistUI() {
    const container = document.getElementById('playlistItems');
    document.getElementById('playlistCount').textContent = ` (${filteredPlaylist.length})`;
    document.getElementById('playlistSummaryCount').textContent = filteredPlaylist.length + ' videos';

    if (filteredPlaylist.length === 0) {
      container.innerHTML = '<div class="empty-state" style="min-height:200px"><p>No videos found</p></div>';
      return;
    }

    container.innerHTML = filteredPlaylist.map((item, i) => {
      const isActive = i === currentIndex;
      const thumb = item.thumbnail || '';
      return `
        <div class="playlist-item${isActive ? ' active' : ''}" data-index="${i}">
          <div class="pl-thumb">
            ${thumb ? `<img src="${escAttr(thumb)}" alt="" loading="lazy">` : '\u{1F3AC}'}
          </div>
          <div class="pl-info">
            <div class="pl-name">${escHtml(item.name || 'Unknown')}</div>
            <div class="pl-meta">${formatTime(item.duration)} \u00B7 ${formatFileSize(item.size)}</div>
          </div>
          ${isActive && isPlaying ? '<div class="pl-playing-icon"><span></span><span></span><span></span></div>' : ''}
        </div>
      `;
    }).join('');

    container.querySelectorAll('.playlist-item').forEach(item => {
      item.addEventListener('click', () => {
        const index = parseInt(item.dataset.index);
        if (index === currentIndex) {
          togglePlay();
        } else {
          playVideo(index);
        }
      });
    });
  }

  function handleKeydown(e) {
    if (e.target.tagName === 'INPUT') return;
    switch(e.code) {
      case 'Space':
        e.preventDefault();
        togglePlay();
        break;
      case 'ArrowLeft':
        video.currentTime = Math.max(0, video.currentTime - 10);
        break;
      case 'ArrowRight':
        video.currentTime = Math.min(video.duration, video.currentTime + 10);
        break;
      case 'KeyF':
        toggleFullscreen();
        break;
      case 'KeyM':
        toggleMute();
        break;
    }
  }

  async function loadPlaylist() {
    try {
      const authParam = getAuthParam();
      const url = '/api/video/list' + (authParam ? '?' + authParam : '');
      const response = await fetch(url);
      if (!response.ok) {
        if (response.status === 401) {
          showAuthPrompt();
          return;
        }
        throw new Error('Failed to load playlist');
      }
      const data = await response.json();
      playlist = (data.files || []).map(f => ({
        name: f.name,
        url: f.url,
        duration: f.duration || 0,
        size: f.size || 0,
        thumbnail: f.thumbnail || '',
        uploadDate: f.uploadDate || 0
      }));
      filteredPlaylist = [...playlist];
      renderApp();
    } catch (error) {
      console.error('Error loading playlist:', error);
      ui.loadingState.innerHTML = `
        <div class="empty-state">
          <div class="icon">\u{1F4ED}</div>
          <p>Unable to load playlist</p>
          <div class="hint">${escHtml(error.message)}</div>
        </div>
      `;
    }
  }

  loadSettings();
  loadPlaylist();
})();
</script>
</body>
</html>

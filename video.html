<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>视频放映室</title>
<link rel="stylesheet" href="/css/theme-m3.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f4efe6;--paper-2:#fffaf2;--paper-3:#e8ded0;--ink:#171514;--muted:#6d655c;--faint:#978b7e;--line:rgba(38,32,26,.14);--line-strong:rgba(38,32,26,.28);--stage:#070707;--stage-2:#11100f;--amber:#b86e32;--amber-dark:#7b3e1f;--teal:#4e7470;--shadow:0 24px 76px rgba(45,35,23,.14);--shadow-soft:0 12px 34px rgba(45,35,23,.09);--radius-sm:12px;--radius-md:18px;--radius-lg:26px;--radius-xl:36px;--radius-full:999px;--ease:cubic-bezier(.2,0,0,1);--display:"Iowan Old Style","Palatino Linotype","Noto Serif CJK SC","Songti SC",serif;--body:"Aptos","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
html{background:var(--paper);color-scheme:light}body{min-height:100vh;padding:24px;font-family:var(--body);color:var(--ink);background:radial-gradient(circle at 12% -10%,rgba(184,110,50,.16),transparent 34%),radial-gradient(circle at 98% 12%,rgba(78,116,112,.13),transparent 32%),linear-gradient(135deg,var(--paper-2),var(--paper));-webkit-font-smoothing:antialiased}body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background:linear-gradient(rgba(38,32,26,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(38,32,26,.035) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 78%)}
.app-shell{width:min(1380px,100%);min-height:calc(100vh - 48px);margin:auto;overflow:hidden;position:relative;border:1px solid var(--line);border-radius:38px;background:rgba(255,250,242,.78);box-shadow:var(--shadow)}.app-shell::before{content:"";position:absolute;inset:18px;border:1px solid rgba(38,32,26,.08);border-radius:30px;pointer-events:none}.app-container{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:calc(100vh - 48px)}.video-main{min-width:0;padding:32px;display:flex;flex-direction:column;gap:18px}.loading,.empty-state{min-height:calc(100vh - 132px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:56px 24px;color:var(--muted)}.loading-spinner{width:42px;height:42px;border-radius:50%;border:2px solid rgba(38,32,26,.12);border-top-color:var(--amber);animation:spin .85s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.empty-state .icon{font-size:44px;opacity:.58}.empty-state p,.loading p{font:800 20px/1.2 var(--display);color:var(--ink)}.empty-state .hint{max-width:360px;font-size:13px;line-height:1.7;color:var(--muted)}
.hero-stage{display:flex;flex-direction:column;gap:18px}.video-stage-card{position:relative;overflow:hidden;border-radius:32px;background:var(--stage);border:1px solid rgba(255,250,242,.12);box-shadow:0 26px 80px rgba(0,0,0,.28)}.video-stage-card::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 18%,transparent 74%,rgba(0,0,0,.36))}.video-wrapper{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:radial-gradient(circle at 50% 10%,rgba(184,110,50,.16),transparent 32%),var(--stage);cursor:pointer}.video-wrapper video{width:100%;height:100%;object-fit:contain;background:#000}.video-wrapper.fullscreen-active{position:fixed;inset:0;z-index:9999;border-radius:0}.video-title-bar{position:absolute;top:0;left:0;right:0;z-index:4;padding:18px 22px 46px;background:linear-gradient(180deg,rgba(0,0,0,.78),transparent);font-size:13px;color:rgba(255,250,242,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s var(--ease)}.video-wrapper:hover .video-title-bar,.video-title-bar.visible{opacity:1}.play-overlay{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;pointer-events:none}.play-overlay-btn{width:82px;height:82px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,250,242,.92);color:var(--ink);font-size:28px;box-shadow:0 18px 46px rgba(0,0,0,.28);opacity:0;transform:scale(.94);transition:opacity .18s var(--ease),transform .18s var(--ease)}.play-overlay-btn.show{opacity:1;transform:scale(1)}
.video-controls{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:18px 20px 20px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.78) 34%,rgba(0,0,0,.92));opacity:0;transition:opacity .2s var(--ease)}.video-stage-card:hover .video-controls,.video-controls.visible{opacity:1}.video-progress{position:relative;width:100%;height:8px;margin-bottom:14px;border-radius:999px;background:rgba(255,250,242,.18);cursor:pointer;overflow:visible}.video-progress::before{content:"";position:absolute;inset:-9px 0}.video-progress-buffer{position:absolute;inset:0 auto 0 0;height:100%;border-radius:inherit;background:rgba(255,250,242,.16)}.video-progress-fill{position:relative;height:100%;max-width:100%;border-radius:inherit;background:linear-gradient(90deg,var(--amber),var(--teal));transform-origin:left center;will-change:transform;transition:transform .08s linear}.video-progress-fill::after{content:"";position:absolute;right:-7px;top:50%;width:16px;height:16px;border-radius:50%;background:var(--paper-2);transform:translateY(-50%);opacity:0;box-shadow:0 8px 20px rgba(0,0,0,.3);transition:opacity .18s var(--ease)}.video-progress:hover .video-progress-fill::after{opacity:1}.controls-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}.controls-left,.controls-right{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}.controls-right{justify-content:flex-end}.ctrl-btn{width:40px;height:40px;border-radius:999px;border:1px solid rgba(255,250,242,.18);background:rgba(255,250,242,.1);color:rgba(255,250,242,.9);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font:700 15px var(--body);transition:background .18s var(--ease),border-color .18s var(--ease),transform .18s var(--ease),box-shadow .18s var(--ease)}.ctrl-btn:hover{background:rgba(255,250,242,.18);border-color:rgba(255,250,242,.34);transform:translateY(-1px)}.ctrl-btn:active{transform:translateY(0)}.ctrl-btn:focus-visible,.toolbar-btn:focus-visible,.search-box input:focus-visible,.auth-card input:focus-visible,.auth-card button:focus-visible{outline:3px solid rgba(184,110,50,.28);outline-offset:2px}.ctrl-btn.play-btn{width:50px;height:50px;border:none;background:var(--paper-2);color:var(--ink);font-size:20px;box-shadow:0 14px 34px rgba(0,0,0,.28)}.time-display{font-size:12px;color:rgba(255,250,242,.72);font-variant-numeric:tabular-nums;white-space:nowrap}.volume-group{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:999px;border:1px solid rgba(255,250,242,.14);background:rgba(255,250,242,.08)}.volume-slider{width:86px;height:6px;border-radius:999px;background:rgba(255,250,242,.18);cursor:pointer;overflow:hidden}.volume-fill{height:100%;max-width:100%;border-radius:inherit;background:linear-gradient(90deg,var(--amber),var(--teal))}
.video-info-grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:stretch}.video-copy-card,.watch-meta-card{border:1px solid var(--line);border-radius:26px;background:rgba(255,250,242,.68);box-shadow:var(--shadow-soft)}.video-copy-card{padding:22px 24px}.watch-meta-card{padding:14px;display:grid;gap:10px}.stage-label{display:flex;align-items:center;gap:9px;margin-bottom:10px;font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}.stage-label .pulse{width:8px;height:8px;border-radius:50%;background:var(--amber)}.video-title{font:800 clamp(28px,3.8vw,48px)/1 var(--display);letter-spacing:-.04em;color:var(--ink)}.video-meta{margin-top:10px;font-size:14px;line-height:1.7;color:var(--muted)}.video-file{margin-top:8px;font-size:12px;color:var(--faint);word-break:break-all}.meta-pill{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:18px;background:rgba(246,239,230,.64)}.meta-pill span{font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}.meta-pill strong{font-size:13px;color:var(--ink)}
.playlist-sidebar{position:relative;min-width:0;border-left:1px solid var(--line);background:rgba(232,222,208,.36);display:flex;flex-direction:column;max-width:440px;transition:max-width .24s var(--ease),opacity .24s var(--ease),border-color .24s var(--ease)}.playlist-sidebar.collapsed{max-width:0;opacity:0;border-left-color:transparent;overflow:hidden}@supports selector(:has(*)){.app-container:has(.playlist-sidebar.collapsed){grid-template-columns:minmax(0,1fr) 0}}.sidebar-inner{display:flex;flex-direction:column;min-height:100%;padding:32px 22px 20px;gap:18px}.sidebar-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.sidebar-heading h2{font:800 30px/1 var(--display);letter-spacing:-.03em}.sidebar-heading p{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.55}.count{margin-left:6px;font:700 12px var(--body);color:var(--faint)}.sidebar-header .ctrl-btn{background:var(--ink);border-color:var(--ink);color:var(--paper-2)}.sidebar-toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px}.search-box{position:relative;min-width:0}.search-box::before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:17px;color:var(--faint)}.search-box input{width:100%;height:42px;padding:0 12px 0 38px;border:1px solid var(--line);border-radius:14px;background:rgba(255,250,242,.75);font:inherit;font-size:13px;color:var(--ink);outline:none}.search-box input:focus{border-color:var(--line-strong);background:var(--paper-2)}.search-box input::placeholder{color:var(--faint)}.toolbar-btn{min-width:42px;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,250,242,.75);color:var(--muted);font:800 12px var(--body);cursor:pointer;transition:background .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease)}.toolbar-btn:hover,.toolbar-btn.active{background:var(--ink);border-color:var(--ink);color:var(--paper-2)}.playlist-summary{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--muted)}.playlist-summary strong{color:var(--ink)}.playlist-items{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:9px;padding-right:4px}.playlist-items::-webkit-scrollbar{width:6px}.playlist-items::-webkit-scrollbar-thumb{background:rgba(38,32,26,.18);border-radius:999px}.playlist-item{width:100%;display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border:1px solid transparent;border-radius:20px;background:transparent;color:inherit;text-align:left;cursor:pointer;position:relative;transition:background .18s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease)}.playlist-item:hover{background:rgba(255,250,242,.62);border-color:var(--line)}.playlist-item.active{background:var(--paper-2);border-color:var(--line-strong);box-shadow:var(--shadow-soft)}.playlist-item.active::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--amber)}.pl-thumb{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--paper-3);display:flex;align-items:center;justify-content:center;color:var(--amber-dark);font-size:18px}.pl-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .25s var(--ease),filter .25s var(--ease)}.playlist-item:hover .pl-thumb img{transform:scale(1.03);filter:saturate(1.04)}.pl-info{min-width:0;display:flex;flex-direction:column;gap:5px}.pl-name{font-size:14px;font-weight:800;color:var(--ink);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.pl-meta{font-size:12px;color:var(--muted)}.pl-playing-icon{width:15px;height:13px;display:flex;align-items:flex-end;gap:2px}.pl-playing-icon span{width:3px;background:var(--amber);border-radius:2px;animation:eq .65s ease infinite alternate}.pl-playing-icon span:nth-child(2){animation-delay:.15s}.pl-playing-icon span:nth-child(3){animation-delay:.3s}@keyframes eq{to{height:13px}}
.auth-card{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:18px}.auth-card input{width:min(220px,100%);padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--paper-2);color:var(--ink);font:inherit;outline:none}.auth-card button{padding:12px 20px;border:none;border-radius:14px;background:var(--ink);color:var(--paper-2);font:800 14px var(--body);cursor:pointer}
@media(max-width:1180px){.app-container{grid-template-columns:1fr}.playlist-sidebar{border-left:none;border-top:1px solid var(--line);max-width:none}.playlist-sidebar.collapsed{max-height:0}.sidebar-inner{min-height:auto}.playlist-items{max-height:420px}@supports selector(:has(*)){.app-container:has(.playlist-sidebar.collapsed){grid-template-columns:1fr}}}@media(max-width:860px){body{padding:12px}.app-shell{border-radius:28px;min-height:calc(100vh - 24px)}.app-container{min-height:calc(100vh - 24px)}.video-main{padding:22px}.sidebar-inner{padding:22px}.video-info-grid{grid-template-columns:1fr}.video-title{font-size:36px}}@media(max-width:640px){body{padding:0}.app-shell{min-height:100vh;border-radius:0;border-left:none;border-right:none}.app-shell::before{display:none}.app-container{min-height:100vh}.video-main,.sidebar-inner{padding:18px}.sidebar-toolbar{grid-template-columns:1fr 1fr}.search-box{grid-column:1/-1}.playlist-item{grid-template-columns:92px minmax(0,1fr)}.pl-playing-icon{display:none}.controls-row{grid-template-columns:1fr}.controls-right{justify-content:flex-start}.volume-slider{width:72px}.video-controls{padding:15px}.video-title{font-size:31px}}@media(min-width:1600px){.app-shell{width:min(1560px,100%)}.video-main{padding:40px}.sidebar-inner{padding:40px 26px 22px}.playlist-item{grid-template-columns:120px minmax(0,1fr) auto}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="app-shell">
  <div class="app-container" id="app">
    <div class="video-main" id="videoMain">
      <div class="loading" id="loadingState">
        <div class="loading-spinner"></div>
        <p>Loading...</p>
      </div>
    </div>
    <aside class="playlist-sidebar" id="sidebar">
      <div class="sidebar-inner">
        <div class="sidebar-header">
          <div class="sidebar-heading">
            <h2>清单<span class="count" id="playlistCount"></span></h2>
          </div>
          <button class="ctrl-btn" id="toggleSidebarBtn" title="Toggle playlist" style="font-size:14px">&times;</button>
        </div>
        <div class="sidebar-toolbar">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索视频...">
          </div>
          <button class="toolbar-btn" id="sortNameBtn" title="Sort by name">A-Z</button>
          <button class="toolbar-btn" id="sortDateBtn" title="Sort by date">&#x1F4C5;</button>
        </div>
        <div class="playlist-items" id="playlistItems"></div>
      </div>
    </aside>
  </div>
</div>

<script>
(function(){
  const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playlist = [];
  let filteredPlaylist = [];
  let currentIndex = -1;
  let isPlaying = false;
  let volume = 0.8;
  let searchQuery = '';
  let sortBy = 'default';
  let sidebarOpen = true;
  let controlsTimer = null;
  let progressFrame = null;
  let lastDisplayedSecond = -1;
  let video = null;
  const preloadVideo = document.createElement('video');
  preloadVideo.preload = 'metadata';

  const ui = {
    mounted: false,
    app: document.getElementById('app'),
    sidebar: document.getElementById('sidebar'),
    loadingState: document.getElementById('loadingState')
  };

  function loadSettings(){
    try{
      const saved = localStorage.getItem('videoPlayerSettings');
      if(saved){
        const s = JSON.parse(saved);
        volume = clampNumber(s.volume, 0.8, 0, 1);
        sidebarOpen = s.sidebarOpen !== false;
      }
    }catch(e){}
  }

  function saveSettings(){
    try{
      localStorage.setItem('videoPlayerSettings', JSON.stringify({ volume, sidebarOpen }));
    }catch(e){}
  }

  function getStoredAuthCode() {
    try {
      return sessionStorage.getItem('videoAuthCode') || '';
    } catch (e) {
      return '';
    }
  }

  function setStoredAuthCode(value) {
    try {
      sessionStorage.setItem('videoAuthCode', value);
    } catch (e) {}
  }

  function createAuthHeaders() {
    const authCode = getStoredAuthCode();
    return authCode ? { authCode } : {};
  }

  function showAuthPrompt() {
    ui.loadingState.innerHTML =
      '<div class="empty-state" style="min-height:auto;padding:0">' +
      '<div class="icon">\u{1F512}</div>' +
      '<p>需要认证</p>' +
      '<div class="hint">请输入访问密码以继续浏览当前视频列表</div>' +
      '<div class="auth-card">' +
      '<input type="password" id="authInput" placeholder="密码" autocomplete="current-password">' +
      '<button type="button" id="authSubmitBtn">确定</button>' +
      '</div></div>';
    const inp = document.getElementById('authInput');
    const submitBtn = document.getElementById('authSubmitBtn');
    const submitAuth = function() {
      const c = inp && inp.value;
      if (!c) return;
      setStoredAuthCode(c);
      loadVideoList();
    };
    if (inp) {
      inp.focus();
      inp.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') submitAuth();
      });
    }
    if (submitBtn) submitBtn.addEventListener('click', submitAuth);
  }

  function clampNumber(value, fallback, min, max) {
    const n = Number(value);
    if (!Number.isFinite(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  }

  function safeText(value, fallback) {
    const text = typeof value === 'string' ? value : '';
    return text || fallback || '';
  }

  function safeSameOriginUrl(value) {
    const raw = typeof value === 'string' ? value.trim() : '';
    if (!raw) return '';
    try {
      const url = new URL(raw, window.location.origin);
      if (url.origin !== window.location.origin) return '';
      if (url.protocol !== 'http:' && url.protocol !== 'https:') return '';
      return url.href;
    } catch (e) {
      return '';
    }
  }

  function normalizeTrack(file, index) {
    const source = file && typeof file === 'object' ? file : {};
    const url = safeSameOriginUrl(source.url);
    if (!url) return null;
    return {
      ...source,
      _id: index,
      name: safeText(source.name, source.fileName || 'Video'),
      fileName: safeText(source.fileName, ''),
      url,
      posterUrl: safeSameOriginUrl(source.posterUrl),
      subtitleUrl: safeSameOriginUrl(source.subtitleUrl),
      fileSize: clampNumber(source.fileSize, 0, 0, Number.MAX_SAFE_INTEGER),
      timestamp: clampNumber(source.timestamp, 0, 0, Number.MAX_SAFE_INTEGER)
    };
  }

  function showEmptyState(container, icon, title, hint) {
    if (!container) return;
    container.textContent = '';
    const wrapper = document.createElement('div');
    wrapper.className = 'empty-state';
    wrapper.style.minHeight = 'auto';
    wrapper.style.padding = '0';
    const iconEl = document.createElement('div');
    iconEl.className = 'icon';
    iconEl.textContent = icon;
    const titleEl = document.createElement('p');
    titleEl.textContent = title;
    const hintEl = document.createElement('div');
    hintEl.className = 'hint';
    hintEl.textContent = hint;
    wrapper.append(iconEl, titleEl, hintEl);
    container.appendChild(wrapper);
  }

  function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function escAttr(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatTime(sec) {
    if (!sec || isNaN(sec)) return '0:00';
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    if (h > 0) return h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function formatSize(bytes) {
    if (!bytes) return '';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
  }

  function renderPlayer() {
    const mainEl = document.getElementById('videoMain');
    mainEl.innerHTML = `
      <section class="hero-stage">
        <div class="video-stage-card">
          <div class="video-wrapper" id="videoWrapper">
            <div class="video-title-bar" id="videoTitleBar">-</div>
            <video id="video" preload="auto" playsinline></video>
            <div class="play-overlay">
              <div class="play-overlay-btn" id="playOverlay">\u25B6</div>
            </div>
            <div class="video-controls" id="videoControls">
              <div class="video-progress" id="progressBar">
                <div class="video-progress-buffer" id="progressBuffer" style="width:0%"></div>
                <div class="video-progress-fill" id="progressFill" style="transform:scaleX(0)"></div>
              </div>
              <div class="controls-row">
                <div class="controls-left">
                  <button class="ctrl-btn play-btn" id="playBtn" title="Play">\u25B6\uFE0F</button>
                  <button class="ctrl-btn" id="prevBtn" title="Previous">\u23EE</button>
                  <button class="ctrl-btn" id="nextBtn" title="Next">\u23ED</button>
                  <div class="volume-group">
                    <button class="ctrl-btn" id="volBtn" title="Mute or unmute" style="font-size:14px">\u{1F50A}</button>
                    <div class="volume-slider" id="volSlider">
                      <div class="volume-fill" id="volFill" style="width:${volume * 100}%"></div>
                    </div>
                  </div>
                  <span class="time-display"><span id="timeCurrent">0:00</span> / <span id="timeTotal">0:00</span></span>
                </div>
                <div class="controls-right">
                  <button class="ctrl-btn" id="subBtn" title="Subtitles" style="font-size:13px">\u{1F4AC}</button>
                  <button class="ctrl-btn" id="sidebarBtn" title="Playlist" style="font-size:14px">\u2630</button>
                  <button class="ctrl-btn" id="fullscreenBtn" title="Fullscreen" style="font-size:14px">\u26F6</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>`;

    video = document.getElementById('video');
    video.volume = volume;
    cacheUiRefs();
    updatePlaylistUI();
    bindEventsOnce();
    syncStaticUi();
    if (!sidebarOpen) ui.sidebar.classList.add('collapsed');
  }

  function cacheUiRefs() {
    ui.videoWrapper = document.getElementById('videoWrapper');
    ui.videoControls = document.getElementById('videoControls');
    ui.progressBar = document.getElementById('progressBar');
    ui.progressBuffer = document.getElementById('progressBuffer');
    ui.progressFill = document.getElementById('progressFill');
    ui.playBtn = document.getElementById('playBtn');
    ui.playOverlay = document.getElementById('playOverlay');
    ui.videoTitleBar = document.getElementById('videoTitleBar');
    ui.timeCurrent = document.getElementById('timeCurrent');
    ui.timeTotal = document.getElementById('timeTotal');
    ui.volBtn = document.getElementById('volBtn');
    ui.volFill = document.getElementById('volFill');
    ui.playlistCount = document.getElementById('playlistCount');
    ui.playlistItems = document.getElementById('playlistItems');
    ui.searchInput = document.getElementById('searchInput');
    ui.sortNameBtn = document.getElementById('sortNameBtn');
    ui.sortDateBtn = document.getElementById('sortDateBtn');
  }

  function renderPlaylistItems() {
    return filteredPlaylist.map(track => {
      const originalIndex = track._id;
      const active = originalIndex === currentIndex;
      const thumbHtml = track.posterUrl
        ? `<img src="${escAttr(track.posterUrl)}" alt="" loading="lazy" decoding="async">`
        : '\u{1F3AC}';
      return `<button class="playlist-item${active ? ' active' : ''}" data-index="${originalIndex}" type="button">
        <span class="pl-thumb">${thumbHtml}</span>
        <span class="pl-info">
          <span class="pl-name">${escHtml(track.name)}</span>
          <span class="pl-meta">${escHtml(formatSize(track.fileSize) || 'Video')}</span>
        </span>
        ${active ? '<span class="pl-playing-icon"><span></span><span></span><span></span></span>' : ''}
      </button>`;
    }).join('') || '<div class="empty-state" style="padding:20px;height:auto;min-height:auto"><p>无匹配结果</p></div>';
  }

  function updatePlaylistUI() {
    if (ui.playlistItems) ui.playlistItems.innerHTML = renderPlaylistItems();
    updatePlaylistMeta();
  }

  function syncActivePlaylistItem(previousIndex) {
    if (!ui.playlistItems) return;
    if (previousIndex >= 0) {
      const previous = ui.playlistItems.querySelector(`.playlist-item[data-index="${previousIndex}"]`);
      if (previous) {
        previous.classList.remove('active');
        const icon = previous.querySelector('.pl-playing-icon');
        if (icon) icon.remove();
      }
    }
    const active = ui.playlistItems.querySelector(`.playlist-item[data-index="${currentIndex}"]`);
    if (!active) return;
    active.classList.add('active');
    if (!active.querySelector('.pl-playing-icon')) {
      active.insertAdjacentHTML('beforeend', '<span class="pl-playing-icon"><span></span><span></span><span></span></span>');
    }
  }

  function updatePlaylistMeta() {
    const countText = `(${filteredPlaylist.length})`;
    if (ui.playlistCount) ui.playlistCount.textContent = countText;
    if (ui.sortNameBtn) ui.sortNameBtn.classList.toggle('active', sortBy === 'name');
    if (ui.sortDateBtn) ui.sortDateBtn.classList.toggle('active', sortBy === 'date');
  }

  function updatePlayBtn() {
    if (ui.playBtn) ui.playBtn.textContent = isPlaying ? '\u23F8\uFE0F' : '\u25B6\uFE0F';
    if (ui.playOverlay) ui.playOverlay.textContent = isPlaying ? '\u23F8' : '\u25B6';
  }

  function updateProgressUi() {
    if (!video || !video.duration) return;
    if (ui.progressFill) ui.progressFill.style.transform = `scaleX(${Math.min(1, video.currentTime / video.duration)})`;
    const currentSecond = Math.floor(video.currentTime);
    if (currentSecond !== lastDisplayedSecond) {
      lastDisplayedSecond = currentSecond;
      if (ui.timeCurrent) ui.timeCurrent.textContent = formatTime(video.currentTime);
    }
  }

  function startProgressLoop() {
    if (progressFrame) return;
    const tick = function() {
      progressFrame = null;
      updateProgressUi();
      if (isPlaying) progressFrame = requestAnimationFrame(tick);
    };
    progressFrame = requestAnimationFrame(tick);
  }

  function stopProgressLoop() {
    if (progressFrame) cancelAnimationFrame(progressFrame);
    progressFrame = null;
    updateProgressUi();
  }

  function preloadAdjacentTrack() {
    if (!playlist.length || currentIndex < 0) return;
    const next = playlist[(currentIndex + 1) % playlist.length];
    if (!next || preloadVideo.src === next.url) return;
    const load = function() {
      preloadVideo.src = next.url;
      preloadVideo.load();
    };
    if ('requestIdleCallback' in window) requestIdleCallback(load, { timeout: 1500 });
    else setTimeout(load, 600);
  }

  function showPlayOverlay() {
    if (!ui.playOverlay) return;
    ui.playOverlay.classList.add('show');
    setTimeout(() => ui.playOverlay.classList.remove('show'), prefersReducedMotion ? 0 : 380);
  }

  function showControls() {
    if (ui.videoControls) ui.videoControls.classList.add('visible');
    if (ui.videoTitleBar) ui.videoTitleBar.classList.add('visible');
    clearTimeout(controlsTimer);
    controlsTimer = setTimeout(() => {
      if (isPlaying && ui.videoControls) ui.videoControls.classList.remove('visible');
      if (isPlaying && ui.videoTitleBar) ui.videoTitleBar.classList.remove('visible');
    }, 3000);
  }

  function syncStaticUi() {
    if (ui.sidebar) ui.sidebar.classList.toggle('collapsed', !sidebarOpen);
    volume = clampNumber(volume, 0.8, 0, 1);
    if (ui.volFill) ui.volFill.style.width = (volume * 100) + '%';
    if (ui.volBtn) ui.volBtn.textContent = volume === 0 ? '\u{1F508}' : '\u{1F50A}';
    updatePlayBtn();
    updatePlaylistMeta();
  }

  function loadTrack(idx, autoPlay) {
    if (idx < 0 || idx >= playlist.length || !video) return;
    const previousIndex = currentIndex;
    currentIndex = idx;
    const track = playlist[idx];

    video.src = track.url;
    if (track.posterUrl) video.poster = track.posterUrl;
    else video.removeAttribute('poster');

    while (video.firstChild) video.removeChild(video.firstChild);

    if (track.subtitleUrl) {
      const trackEl = document.createElement('track');
      trackEl.kind = 'subtitles';
      trackEl.src = track.subtitleUrl;
      trackEl.srclang = 'zh';
      trackEl.label = 'Subtitles';
      trackEl.default = true;
      video.appendChild(trackEl);
      video.addEventListener('loadedmetadata', function enableSub() {
        if (video.textTracks.length > 0) video.textTracks[0].mode = 'showing';
        video.removeEventListener('loadedmetadata', enableSub);
      });
    }

    if (ui.videoTitleBar) ui.videoTitleBar.textContent = track.name;
    lastDisplayedSecond = -1;
    if (ui.progressFill) ui.progressFill.style.transform = 'scaleX(0)';
    if (ui.progressBuffer) ui.progressBuffer.style.width = '0%';
    if (ui.timeCurrent) ui.timeCurrent.textContent = '0:00';
    if (ui.timeTotal) ui.timeTotal.textContent = '0:00';

    syncActivePlaylistItem(previousIndex);
    syncStaticUi();
    scrollToActive();
    preloadAdjacentTrack();

    if (autoPlay) {
      video.play().then(() => { isPlaying = true; updatePlayBtn(); startProgressLoop(); }).catch(() => {});
    }
  }

  function togglePlay() {
    if (!playlist.length || !video) return;
    if (isPlaying) video.pause();
    else video.play().catch(() => {});
  }

  function playNext() {
    if (!playlist.length) return;
    const next = (currentIndex + 1) % playlist.length;
    loadTrack(next, true);
  }

  function playPrev() {
    if (!playlist.length || !video) return;
    if (video.currentTime > 3) {
      video.currentTime = 0;
      return;
    }
    const prev = (currentIndex - 1 + playlist.length) % playlist.length;
    loadTrack(prev, true);
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      const el = document.getElementById('videoMain');
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }

  function toggleSubtitles() {
    if (!video || !video.textTracks.length) return;
    const track = video.textTracks[0];
    track.mode = track.mode === 'showing' ? 'hidden' : 'showing';
  }

  function filterAndSort() {
    filteredPlaylist = playlist.filter(track =>
      track.name.toLowerCase().includes(searchQuery.toLowerCase())
    );
    if (sortBy === 'name') filteredPlaylist.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
    else if (sortBy === 'date') filteredPlaylist.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    updatePlaylistUI();
  }

  function scrollToActive() {
    const active = ui.playlistItems && ui.playlistItems.querySelector('.playlist-item.active');
    if (active) active.scrollIntoView({ block: 'nearest', behavior: prefersReducedMotion ? 'auto' : 'smooth' });
  }

  function bindEventsOnce() {
    if (ui.mounted) return;
    ui.mounted = true;

    ui.app.addEventListener('click', function(e) {
      const playlistItem = e.target.closest('.playlist-item');
      if (playlistItem && ui.playlistItems && ui.playlistItems.contains(playlistItem)) {
        const idx = parseInt(playlistItem.dataset.index, 10);
        if (!isNaN(idx)) {
          if (idx !== currentIndex) loadTrack(idx, true);
          else togglePlay();
        }
        return;
      }

      if (e.target.closest('#playBtn')) { togglePlay(); return; }
      if (e.target.closest('#nextBtn')) { playNext(); return; }
      if (e.target.closest('#prevBtn')) { playPrev(); return; }
      if (e.target.closest('#fullscreenBtn')) { toggleFullscreen(); return; }
      if (e.target.closest('#subBtn')) { toggleSubtitles(); return; }

      if (e.target.closest('#sidebarBtn')) {
        sidebarOpen = !sidebarOpen;
        saveSettings();
        syncStaticUi();
        return;
      }
      if (e.target.closest('#toggleSidebarBtn')) {
        sidebarOpen = false;
        saveSettings();
        syncStaticUi();
        return;
      }

      if (e.target.closest('#volBtn')) {
        const btn = document.getElementById('volBtn');
        if (volume > 0) { btn._prev = volume; volume = 0; }
        else { volume = btn._prev || 0.8; }
        if (video) video.volume = volume;
        saveSettings();
        syncStaticUi();
      }
    });

    ui.app.addEventListener('input', function(e) {
      if (e.target.id === 'searchInput') {
        searchQuery = e.target.value;
        filterAndSort();
      }
    });

    ui.app.addEventListener('click', function(e) {
      if (e.target.id === 'sortNameBtn') {
        sortBy = sortBy === 'name' ? 'default' : 'name';
        filterAndSort();
      }
      if (e.target.id === 'sortDateBtn') {
        sortBy = sortBy === 'date' ? 'default' : 'date';
        filterAndSort();
      }
    });

    ui.app.addEventListener('click', function(e) {
      const progressBar = e.target.closest('#progressBar');
      if (progressBar) {
        if (!video || !video.duration) return;
        const rect = progressBar.getBoundingClientRect();
        video.currentTime = ((e.clientX - rect.left) / rect.width) * video.duration;
        updateProgressUi();
        return;
      }
      const volSlider = e.target.closest('#volSlider');
      if (volSlider) {
        const rect = volSlider.getBoundingClientRect();
        volume = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        if (video) video.volume = volume;
        saveSettings();
        syncStaticUi();
      }
    });

    ui.app.addEventListener('click', function(e) {
      const wrapper = e.target.closest('#videoWrapper');
      if (!wrapper) return;
      if (e.target.closest('.video-controls')) return;
      togglePlay();
      showPlayOverlay();
      showControls();
    });

    ui.app.addEventListener('dblclick', function(e) {
      const wrapper = e.target.closest('#videoWrapper');
      if (!wrapper) return;
      if (e.target.closest('.video-controls')) return;
      toggleFullscreen();
    });

    document.getElementById('videoMain').addEventListener('mousemove', showControls);
    document.getElementById('videoMain').addEventListener('mouseleave', function() {
      clearTimeout(controlsTimer);
      if (ui.videoControls && isPlaying) ui.videoControls.classList.remove('visible');
      if (ui.videoTitleBar && isPlaying) ui.videoTitleBar.classList.remove('visible');
    });

    document.addEventListener('keydown', function(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      switch(e.code) {
        case 'Space':
          e.preventDefault(); togglePlay(); showPlayOverlay(); showControls(); break;
        case 'ArrowRight':
          e.preventDefault();
          if (video) video.currentTime = Math.min(video.duration || 0, video.currentTime + 5);
          updateProgressUi(); showControls(); break;
        case 'ArrowLeft':
          e.preventDefault();
          if (video) video.currentTime = Math.max(0, video.currentTime - 5);
          updateProgressUi(); showControls(); break;
        case 'ArrowUp':
          e.preventDefault();
          volume = Math.min(1, volume + 0.1); if (video) video.volume = volume;
          saveSettings(); syncStaticUi(); showControls(); break;
        case 'ArrowDown':
          e.preventDefault();
          volume = Math.max(0, volume - 0.1); if (video) video.volume = volume;
          saveSettings(); syncStaticUi(); showControls(); break;
        case 'KeyF':
          e.preventDefault(); toggleFullscreen(); break;
        case 'KeyN':
          e.preventDefault(); playNext(); break;
        case 'KeyP':
          e.preventDefault(); playPrev(); break;
        case 'KeyM':
          e.preventDefault(); document.getElementById('volBtn') && document.getElementById('volBtn').click(); break;
        case 'KeyC':
          e.preventDefault(); toggleSubtitles(); break;
        case 'Escape':
          if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
          break;
      }
    });

    function attachVideoEvents() {
      if (!video) return;
      video.addEventListener('timeupdate', updateProgressUi);
      video.addEventListener('progress', function() {
        if (!video.duration || !video.buffered.length) return;
        const end = video.buffered.end(video.buffered.length - 1);
        if (ui.progressBuffer) ui.progressBuffer.style.width = (end / video.duration * 100) + '%';
      });
      video.addEventListener('loadedmetadata', function() {
        if (ui.timeTotal) ui.timeTotal.textContent = formatTime(video.duration);
        syncStaticUi();
      });
      video.addEventListener('ended', playNext);
      video.addEventListener('play', function() { isPlaying = true; updatePlayBtn(); startProgressLoop(); showControls(); });
      video.addEventListener('pause', function() { isPlaying = false; updatePlayBtn(); stopProgressLoop(); showControls(); });
    }
    attachVideoEvents();
  }

  function loadVideoList() {
    fetch('/api/video/list', { headers: createAuthHeaders() })
      .then(r => {
        if (r.status === 401) {
          showAuthPrompt();
          return null;
        }
        if (r.status === 403) {
          return r.json().then(() => {
            showEmptyState(ui.loadingState, '\u{1F6AB}', '视频播放器未启用', '请在后台管理 - 其他设置中启用视频播放器');
            return null;
          });
        }
        if (!r.ok) throw new Error('服务不可用');
        return r.json();
      })
      .then(data => {
        if (!data) return;
        playlist = (Array.isArray(data.files) ? data.files : [])
          .map(normalizeTrack)
          .filter(Boolean);
        filteredPlaylist = [...playlist];
        if (playlist.length === 0) {
          showEmptyState(ui.loadingState, '\u{1F3AC}', '暂无视频文件', '请上传视频文件到配置的目录中');
          return;
        }
        renderPlayer();
        currentIndex = 0;
        loadTrack(0, false);
      })
      .catch(err => {
        showEmptyState(ui.loadingState, '⚠️', safeText(err && err.message, '加载失败'), '请检查网络连接');
      });
  }

  loadSettings();
  loadVideoList();
})();
</script>
</body>
</html>

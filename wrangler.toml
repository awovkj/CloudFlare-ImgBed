# =============================================================================
# CloudFlare-ImgBed — Cloudflare Workers 部署配置
# 文档：https://developers.cloudflare.com/workers/wrangler/configuration/
# =============================================================================

name               = "cfbeds"
main               = "src/worker.js"
compatibility_date = "2025-01-01"
workers_dev        = true

# Dashboard 手动配置的绑定不会被下次部署覆盖
keep_vars = true

# =============================================================================
# 构建步骤：将静态资源复制到 .wrangler-assets/
# wrangler deploy 和 wrangler versions upload 执行前自动运行
# 文档：https://developers.cloudflare.com/workers/wrangler/custom-builds/
# =============================================================================
[build]
command = "node scripts/copy-assets.mjs"

# =============================================================================
# 静态资源
# 文档：https://developers.cloudflare.com/workers/static-assets/
# =============================================================================
[assets]
directory          = ".wrangler-assets"   # 由 [build] 自动准备
not_found_handling = "single-page-application"

# 以下路径交给 Worker 处理，其余直接走静态资源 CDN
run_worker_first = [
  "/upload",
  "/upload/*",
  "/file",
  "/file/*",
  "/api",
  "/api/*",
  "/random",
  "/random/*",
  "/dav",
  "/dav/*",
]

# =============================================================================
# KV 命名空间绑定
#
# 方案 A（推荐，Wrangler ≥ 4.45.0）：省略 id，首次 wrangler deploy 时
#   Cloudflare 自动创建 KV Namespace 并写回 id。
#   文档：https://developers.cloudflare.com/workers/wrangler/configuration/#automatic-provisioning
#
# 方案 B（Wrangler < 4.45.0 或仪表板绑定）：
#   在 Cloudflare Dashboard → Workers & Pages → 你的 Worker
#   → Settings → Bindings → Add → KV Namespace
#   变量名填 img_url，选择已有的 KV Namespace，保存即可。
#   搭配顶部 keep_vars = true 防止下次部署时被覆盖。
# =============================================================================
[[kv_namespaces]]
binding = "img_url"
# id 字段省略 → Wrangler ≥ 4.45.0 自动 Provisioning
# 若使用旧版 Wrangler，请取消注释并填入真实 ID：
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# =============================================================================
# R2 存储桶绑定（可选）
#
# 方案 A：省略 bucket_name，首次部署时自动创建
# 方案 B：仪表板 → Settings → Bindings → Add → R2 Bucket，变量名 img_r2
# =============================================================================
[[r2_buckets]]
binding = "img_r2"
# bucket_name 省略 → 自动 Provisioning
# 若使用旧版 Wrangler，请取消注释：
# bucket_name = "your-r2-bucket-name"

# =============================================================================
# Durable Objects（用于上传任务卸载，绕过 Worker CPU 时间限制）
#
# DO 每次 I/O 操作会重置 CPU 计时器，适合上传这类包含多次顺序异步操作的任务。
# 设置环境变量 DISABLE_UPLOAD_DO=true 可紧急回退到 Worker 直接处理。
# =============================================================================
[durable_objects]
bindings = [
    { name = "UPLOAD_DO", class_name = "UploadDurableObject" }
]

[[migrations]]
tag = "v1_upload_do"
new_sqlite_classes = ["UploadDurableObject"]

# =============================================================================
# D1 数据库绑定（可选，与 KV 二选一）
#
# 启用方式：取消注释，省略 database_id 即可自动创建；
# 或在仪表板 → Settings → Bindings → Add → D1 Database，变量名 img_d1
# =============================================================================
# [[d1_databases]]
# binding       = "img_d1"
# database_name = "imgbed-db"
# database_id   省略 → 自动 Provisioning

# =============================================================================
# 可选：自定义域名（取消注释并填入你的域名）
# workers_dev = false
# [[routes]]
# pattern       = "img.yourdomain.com"
# custom_domain = true
# =============================================================================

# =============================================================================
# 可选：环境变量（明文，密钥请用 wrangler secret put）
# =============================================================================
# [vars]
# dev_mode = "false"

# =============================================================================
# 开发环境（wrangler dev --env dev）
# =============================================================================
[env.dev]
name      = "cloudflare-imgbed-dev"
keep_vars = true

[[env.dev.kv_namespaces]]
binding = "img_url"

[[env.dev.r2_buckets]]
binding = "img_r2"

[env.dev.durable_objects]
bindings = [
    { name = "UPLOAD_DO", class_name = "UploadDurableObject" }
]

# [[env.dev.d1_databases]]
# binding       = "img_d1"
# database_name = "imgbed-db-dev"

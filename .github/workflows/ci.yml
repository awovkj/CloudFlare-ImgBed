name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify routes and run tests without prebuilt assets
        run: npm test
      - name: Worker build preflight (no deployment)
        run: npm run build:worker
      - name: Verify deployed standalone page
        run: node --input-type=module -e "import fs from 'node:fs'; if (!fs.existsSync('.wrangler-assets/music.html')) process.exit(1)"

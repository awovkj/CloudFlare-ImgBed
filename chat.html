<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Transfer</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f7fb;
  --panel:#ffffff;
  --panel-soft:#f8fafc;
  --border:#d8e0ea;
  --border-strong:#b9c6d6;
  --text:#1f2937;
  --text-muted:#5f6b7a;
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --success:#169b62;
  --warning:#d97706;
  --danger:#dc2626;
  --shadow:0 10px 30px rgba(15,23,42,0.08);
}
html{background:var(--bg);color-scheme:light}
body{
  min-height:100vh;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);
  background:var(--bg);
  padding:20px;
}
.app-shell{
  width:min(960px,100%);
  min-height:calc(100vh - 40px);
  margin:0 auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.loading,.empty-state{
  min-height:calc(100vh - 40px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  text-align:center;
  padding:40px 24px;
  color:var(--text-muted);
}
.loading-spinner{
  width:40px;
  height:40px;
  border-radius:50%;
  border:3px solid #dbe7ff;
  border-top-color:var(--primary);
  animation:spin .8s linear infinite;
}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.empty-state .icon{font-size:40px}
.empty-state p,.loading p{font-size:18px;font-weight:700;color:var(--text)}
.empty-state .hint{max-width:440px;font-size:13px;line-height:1.7;color:var(--text-muted)}
.auth-card{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.auth-card input,
.channel-select,
.composer textarea{
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  outline:none;
}
.auth-card input{
  width:min(260px,100%);
  height:42px;
  padding:0 12px;
  border-radius:10px;
  font-size:14px;
}
button{border:none;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.auth-card button,.primary-btn,.send-btn{
  background:var(--primary);
  color:#fff;
}
.auth-card button:hover,.primary-btn:hover,.send-btn:hover{background:var(--primary-dark)}
.auth-card button,.primary-btn,.secondary-btn,.danger-btn,.icon-btn,.attach-btn,.send-btn{
  height:40px;
  padding:0 14px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
}
.secondary-btn,.icon-btn,.attach-btn{
  background:#fff;
  border:1px solid var(--border);
  color:var(--text);
}
.danger-btn{
  background:#fff5f5;
  border:1px solid #fecaca;
  color:var(--danger);
}
.chat-layout{
  display:grid;
  grid-template-rows:auto auto minmax(0,1fr) auto auto;
  min-height:calc(100vh - 40px);
}
.page-header{
  padding:20px 20px 12px;
  border-bottom:1px solid var(--border);
}
.page-header h1{font-size:22px}
.page-header p{margin-top:6px;font-size:13px;color:var(--text-muted);line-height:1.6}
.control-bar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  padding:14px 20px;
  border-bottom:1px solid var(--border);
  background:var(--panel-soft);
}
.channel-select{
  min-width:180px;
  height:40px;
  padding:0 12px;
  border-radius:10px;
  font-size:14px;
}
.meta-text{font-size:12px;color:var(--text-muted)}
.message-scroll{
  min-height:0;
  overflow:auto;
  padding:18px 20px;
  display:flex;
  flex-direction:column;
  gap:12px;
  background:#fcfdff;
}
.timeline-tip{
  align-self:center;
  padding:6px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  background:#fff;
  font-size:12px;
  color:var(--text-muted);
}
.message-row{display:flex;justify-content:flex-end}
.message-card{
  max-width:min(100%,760px);
  padding:12px 14px;
  border-radius:14px;
  border:1px solid var(--border);
  background:#eef4ff;
}
.message-card.file{background:#fff}
.message-meta{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:11px;color:var(--text-muted)}
.message-channel{font-weight:600;color:var(--text)}
.message-time{white-space:nowrap}
.message-body{display:flex;flex-direction:column;gap:10px}
.message-text{font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.message-actions{display:flex;gap:8px;flex-wrap:wrap}
.message-action-btn{
  height:32px;
  padding:0 12px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  font-size:12px;
  font-weight:600;
}
.file-card-link{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.file-icon{
  width:38px;
  height:38px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:#eff6ff;
}
.file-copy{min-width:0;display:flex;flex-direction:column;gap:4px}
.file-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-desc{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-chat{
  margin:auto 0;
  padding:30px 22px;
  border:1px dashed var(--border-strong);
  border-radius:14px;
  background:#fff;
  text-align:center;
  color:var(--text-muted);
}
.empty-chat .icon{font-size:42px;display:block;margin-bottom:8px}
.empty-chat p{font-size:18px;font-weight:700;color:var(--text)}
.empty-chat .hint{margin-top:8px;font-size:13px;line-height:1.7}
.status-strip{
  padding:12px 20px;
  border-top:1px solid var(--border);
  background:var(--panel-soft);
}
.status-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.status-chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  border:1px solid var(--border);
  background:#fff;
}
.status-chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.status-chip.idle{color:var(--success)}
.status-chip.loading{color:var(--primary)}
.status-chip.warning{color:var(--warning)}
.status-chip.error{color:var(--danger)}
.status-text{margin-top:8px;font-size:13px;line-height:1.6;color:var(--text-muted)}
.progress-wrap{margin-top:10px;display:none}
.progress-wrap.show{display:block}
.progress-track{width:100%;height:8px;border-radius:999px;background:#e5e7eb;overflow:hidden}
.progress-fill{height:100%;width:0%;background:var(--primary)}
.progress-caption{margin-top:6px;font-size:12px;color:var(--text-muted)}
.composer-wrap{padding:16px 20px 20px;border-top:1px solid var(--border)}
.composer{
  border:1px solid var(--border);
  border-radius:14px;
  background:#fff;
  padding:14px;
}
.composer textarea{
  width:100%;
  min-height:110px;
  padding:12px;
  border-radius:10px;
  font-size:14px;
  line-height:1.7;
  resize:none;
}
.composer-toolbar{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:12px;
  align-items:center;
  margin-top:12px;
}
.toolbar-left,.toolbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar-right{justify-content:flex-end}
.attach-btn input{display:none}
.composer-hint{font-size:12px;line-height:1.6;color:var(--text-muted)}
.queue-list{margin-top:10px;display:none;flex-direction:column;gap:8px}
.queue-list.show{display:flex}
.queue-item{
  padding:10px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--panel-soft);
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:12px;
  color:var(--text-muted);
}
.queue-item strong{font-size:13px;color:var(--text)}
@media(max-width:720px){
  body{padding:0}
  .app-shell{width:100%;min-height:100vh;border-radius:0;border-left:none;border-right:none}
  .page-header,.control-bar,.message-scroll,.status-strip,.composer-wrap{padding-left:14px;padding-right:14px}
  .composer-toolbar{grid-template-columns:1fr}
  .toolbar-right{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="app-shell" id="app">
  <div class="loading" id="loadingState">
    <div class="loading-spinner"></div>
    <p>Loading...</p>
  </div>
</div>

<script>
(function(){
  const SETTINGS_KEY = 'chatPageSettings';
  const DEFAULT_CHUNK_SIZE = 18 * 1024 * 1024;
  const state = {
    channels: [],
    selectedChannel: '',
    items: [],
    chunkSizeBytes: DEFAULT_CHUNK_SIZE,
    busy: false,
    statusText: '准备就绪，可发送文本或文件。',
    statusTone: 'idle',
    progress: 0,
    queue: []
  };

  const ui = {
    app: document.getElementById('app'),
    loadingState: document.getElementById('loadingState')
  };

  function getAuthCode() {
    const params = new URLSearchParams(window.location.search);
    return params.get('authCode') || '';
  }

  function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  function escAttr(str) {
    return escHtml(str).replace(/`/g, '&#96;');
  }

  async function copyMessageText(text) {
    try {
      await navigator.clipboard.writeText(String(text || ''));
      setStatus('文本已复制。', 'idle', 0);
    } catch (error) {
      setStatus(error.message || '复制失败，请手动选择文本。', 'error', 0);
    }
  }

  function triggerDownload(url, filename) {
    if (!url) {
      setStatus('下载链接不可用。', 'warning', 0);
      return;
    }
    const a = document.createElement('a');
    a.href = url;
    a.download = filename || 'download';
    a.click();
    setStatus('开始下载：' + (filename || '文件'), 'idle', 0);
  }

  function getAuthHeaders(headers) {
    const finalHeaders = headers ? { ...headers } : {};
    const authCode = getAuthCode();
    if (authCode) finalHeaders.authCode = authCode;
    return finalHeaders;
  }

  function withAuthUrl(path) {
    const authCode = getAuthCode();
    const url = new URL(path, window.location.origin);
    if (authCode) url.searchParams.set('authCode', authCode);
    return url.toString();
  }

  function loadSettings() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed.selectedChannel === 'string') {
        state.selectedChannel = parsed.selectedChannel;
      }
    } catch {}
  }

  function saveSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({ selectedChannel: state.selectedChannel }));
    } catch {}
  }

  function formatTime(ts) {
    if (!ts) return '--:--';
    const date = new Date(Number(ts));
    const hh = String(date.getHours()).padStart(2, '0');
    const mm = String(date.getMinutes()).padStart(2, '0');
    return hh + ':' + mm;
  }

  function formatDateTime(ts) {
    if (!ts) return '--';
    const date = new Date(Number(ts));
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return month + '-' + day + ' ' + formatTime(ts);
  }

  function formatSize(value) {
    const numeric = Number(value);
    if (!numeric || Number.isNaN(numeric)) return '文本记录';
    if (numeric < 1) return (numeric * 1024).toFixed(0) + ' KB';
    if (numeric < 1024) return numeric.toFixed(numeric >= 100 ? 0 : 2) + ' MB';
    return (numeric / 1024).toFixed(2) + ' GB';
  }

  function getSummary() {
    const total = state.items.length;
    const textCount = state.items.filter(item => item.type === 'text').length;
    const fileCount = total - textCount;
    return { total, textCount, fileCount };
  }

  function setStatus(text, tone, progress) {
    state.statusText = text;
    state.statusTone = tone || 'idle';
    state.progress = typeof progress === 'number' ? progress : 0;
    syncStatusUi();
  }

  function setQueue(queue) {
    state.queue = queue || [];
    renderQueue();
  }

  function syncStatusUi() {
    if (!ui.statusChip) return;
    ui.statusChip.className = 'status-chip ' + (state.statusTone || 'idle');
    ui.statusChip.textContent = state.busy ? '处理中' : '在线';
    ui.statusText.textContent = state.statusText || '';
    const showProgress = state.progress > 0 && state.progress < 100;
    ui.progressWrap.classList.toggle('show', showProgress);
    ui.progressFill.style.width = Math.max(0, Math.min(100, state.progress)) + '%';
    ui.progressCaption.textContent = showProgress ? ('进度 ' + Math.round(state.progress) + '%') : '';
  }

  function renderQueue() {
    if (!ui.queueList) return;
    if (!state.queue.length) {
      ui.queueList.classList.remove('show');
      ui.queueList.innerHTML = '';
      return;
    }
    ui.queueList.classList.add('show');
    ui.queueList.innerHTML = state.queue.map(item =>
      '<div class="queue-item"><strong>' + escHtml(item.name) + '</strong><span>' + escHtml(item.status) + '</span></div>'
    ).join('');
  }

  function showAuthPrompt() {
    ui.app.innerHTML =
      '<div class="empty-state">' +
        '<div class="icon">🔐</div>' +
        '<p>需要认证</p>' +
        '<div class="hint">请输入上传密码后继续访问 Chat 页面。</div>' +
        '<div class="auth-card">' +
          '<input type="password" id="authInput" placeholder="密码">' +
          '<button id="authSubmitBtn">确定</button>' +
        '</div>' +
      '</div>';
    const input = document.getElementById('authInput');
    const submit = document.getElementById('authSubmitBtn');
    function applyAuth() {
      const code = input.value.trim();
      if (!code) return;
      const url = new URL(window.location.href);
      url.searchParams.set('authCode', code);
      window.location.href = url.toString();
    }
    input.focus();
    input.addEventListener('keydown', function(event) {
      if (event.key === 'Enter') applyAuth();
    });
    submit.addEventListener('click', applyAuth);
  }

  function showDisabledState(message) {
    ui.app.innerHTML =
      '<div class="empty-state">' +
        '<div class="icon">🚫</div>' +
        '<p>Chat 页面未启用</p>' +
        '<div class="hint">' + escHtml(message || '请先在后台管理 - 其他设置中开启 Chat 页面。') + '</div>' +
      '</div>';
  }

  function showErrorState(message) {
    ui.app.innerHTML =
      '<div class="empty-state">' +
        '<div class="icon">⚠️</div>' +
        '<p>' + escHtml(message || '加载失败') + '</p>' +
        '<div class="hint">请检查网络连接，或稍后刷新重试。</div>' +
      '</div>';
  }

  async function parseErrorResponse(response) {
    let message = '';
    try {
      const data = await response.clone().json();
      message = data.error || data.message || '';
    } catch {}
    if (!message) {
      try {
        message = (await response.text()).trim();
      } catch {}
    }
    return message || ('请求失败（' + response.status + '）');
  }

  async function authedFetch(url, options) {
    const opts = { ...(options || {}) };
    opts.headers = getAuthHeaders(opts.headers || {});
    const response = await fetch(url, opts);
    if (response.status === 401) {
      showAuthPrompt();
      throw new Error('Unauthorized');
    }
    if (response.status === 403) {
      let message = 'Chat 页面未启用';
      try {
        const data = await response.clone().json();
        message = data.error || message;
      } catch {
        message = await parseErrorResponse(response);
      }
      showDisabledState(message);
      throw new Error(message);
    }
    return response;
  }

  function buildUploadUrl(extraParams) {
    const url = new URL('/upload', window.location.origin);
    url.searchParams.set('sourceApp', 'chat');
    url.searchParams.set('recordType', 'chat_transfer');
    url.searchParams.set('messageType', 'file');
    url.searchParams.set('uploadFolder', '__chat__');
    url.searchParams.set('uploadChannel', 'telegram');
    if (state.selectedChannel) url.searchParams.set('channelName', state.selectedChannel);
    Object.entries(extraParams || {}).forEach(([key, value]) => {
      if (value !== undefined && value !== null && value !== '') {
        url.searchParams.set(key, value);
      }
    });
    return url.toString();
  }

  function renderApp() {
    const hasChannels = state.channels.length > 0;
    ui.app.innerHTML = `
      <div class="chat-layout">
        <header class="page-header">
          <h1>Chat Transfer</h1>
          <p>使用上传密码访问。支持发送文本、文件、复制文本和下载文件。</p>
        </header>

        <section class="control-bar">
          <select class="channel-select" id="channelSelect" ${hasChannels ? '' : 'disabled'}>
            ${state.channels.map(channel => '<option value="' + escHtml(channel.name) + '" ' + (channel.name === state.selectedChannel ? 'selected' : '') + '>' + escHtml(channel.name || 'default') + '</option>').join('')}
          </select>
          <button class="secondary-btn" id="refreshBtn">刷新</button>
          <button class="secondary-btn" id="jumpBottomBtn">最新</button>
          <button class="danger-btn" id="clearBtn">清空记录</button>
          <span class="meta-text" id="topbarChannel">当前渠道：${escHtml(state.selectedChannel || '未选择')}</span>
        </section>

        <section class="message-scroll" id="messageScroll"></section>

        <section class="status-strip">
          <div class="status-head">
            <div class="status-chip ${state.statusTone}">${state.busy ? '处理中' : '在线'}</div>
          </div>
          <div class="status-text" id="statusText">${escHtml(state.statusText)}</div>
          <div class="progress-wrap ${state.progress > 0 && state.progress < 100 ? 'show' : ''}" id="progressWrap">
            <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:${Math.max(0, Math.min(100, state.progress))}%"></div></div>
            <div class="progress-caption" id="progressCaption">${state.progress > 0 && state.progress < 100 ? ('进度 ' + Math.round(state.progress) + '%') : ''}</div>
          </div>
        </section>

        <section class="composer-wrap">
          <div class="composer">
            <textarea id="messageInput" placeholder="输入想发送到 Telegram 的文本…" ${hasChannels ? '' : 'disabled'}></textarea>
            <div class="composer-toolbar">
              <div class="toolbar-left">
                <label class="attach-btn">
                  选择文件
                  <input type="file" id="fileInput" multiple ${hasChannels ? '' : 'disabled'}>
                </label>
                <button class="icon-btn" id="clearInputBtn" ${hasChannels ? '' : 'disabled'}>清空输入</button>
                <div class="composer-hint">${hasChannels ? '文件会复用现有 /upload 流程，并在需要时自动分片上传。' : '未检测到 Telegram 渠道，请先在上传设置中配置。'}</div>
              </div>
              <div class="toolbar-right">
                <button class="send-btn" id="sendBtn" ${hasChannels ? '' : 'disabled'}>发送</button>
              </div>
            </div>
            <div class="queue-list" id="queueList"></div>
          </div>
        </section>
      </div>`;

    ui.channelSelect = document.getElementById('channelSelect');
    ui.refreshBtn = document.getElementById('refreshBtn');
    ui.jumpBottomBtn = document.getElementById('jumpBottomBtn');
    ui.clearBtn = document.getElementById('clearBtn');
    ui.statusChip = ui.app.querySelector('.status-chip');
    ui.statusText = document.getElementById('statusText');
    ui.progressWrap = document.getElementById('progressWrap');
    ui.progressFill = document.getElementById('progressFill');
    ui.progressCaption = document.getElementById('progressCaption');
    ui.messageScroll = document.getElementById('messageScroll');
    ui.messageInput = document.getElementById('messageInput');
    ui.fileInput = document.getElementById('fileInput');
    ui.sendBtn = document.getElementById('sendBtn');
    ui.clearInputBtn = document.getElementById('clearInputBtn');
    ui.queueList = document.getElementById('queueList');
    ui.topbarChannel = document.getElementById('topbarChannel');

    bindUiEvents();
    syncStatusUi();
    renderQueue();
    renderMessages(true);
  }

  function bindUiEvents() {
    ui.channelSelect && ui.channelSelect.addEventListener('change', function() {
      state.selectedChannel = this.value;
      saveSettings();
      if (ui.topbarChannel) ui.topbarChannel.textContent = '当前渠道：' + (state.selectedChannel || '未选择');
      setStatus('已切换到渠道：' + (state.selectedChannel || 'default'), 'idle', 0);
    });

    ui.refreshBtn && ui.refreshBtn.addEventListener('click', function() {
      refreshHistory(true);
    });

    ui.jumpBottomBtn && ui.jumpBottomBtn.addEventListener('click', function() {
      scrollToBottom();
    });

    ui.clearBtn && ui.clearBtn.addEventListener('click', function() {
      clearHistory();
    });

    ui.sendBtn && ui.sendBtn.addEventListener('click', function() {
      sendText();
    });

    ui.clearInputBtn && ui.clearInputBtn.addEventListener('click', function() {
      ui.messageInput.value = '';
      ui.messageInput.focus();
    });

    ui.messageInput && ui.messageInput.addEventListener('keydown', function(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendText();
      }
    });

    ui.fileInput && ui.fileInput.addEventListener('change', function(event) {
      const files = Array.from(event.target.files || []);
      if (files.length) uploadFiles(files);
      event.target.value = '';
    });

    ui.messageScroll && ui.messageScroll.addEventListener('click', function(event) {
      const actionButton = event.target.closest('[data-action]');
      if (!actionButton) return;
      const action = actionButton.getAttribute('data-action');
      if (action === 'copy-text') {
        copyMessageText(actionButton.getAttribute('data-text') || '');
        return;
      }
      if (action === 'download-file') {
        triggerDownload(actionButton.getAttribute('data-url') || '', actionButton.getAttribute('data-filename') || 'download');
      }
    });
  }

  function renderMessages(scrollAfterRender) {
    if (!ui.messageScroll) return;
    const sortedItems = [...state.items].sort((a, b) => Number(a.timestamp || 0) - Number(b.timestamp || 0));
    if (!sortedItems.length) {
      ui.messageScroll.innerHTML =
        '<div class="timeline-tip">当前仅展示 Chat 传输记录</div>' +
        '<div class="empty-chat">' +
          '<span class="icon">📭</span>' +
          '<p>还没有发送记录</p>' +
          '<div class="hint">发送一条文本或选择文件后，这里会以聊天气泡的形式展示历史记录。</div>' +
        '</div>';
    } else {
      const firstTime = sortedItems[0] ? formatDateTime(sortedItems[0].timestamp) : '--';
      ui.messageScroll.innerHTML =
        '<div class="timeline-tip">开始记录 · ' + escHtml(firstTime) + '</div>' +
        sortedItems.map(renderMessageItem).join('');
    }
    if (scrollAfterRender) scrollToBottom();
  }

  function renderMessageItem(item) {
    const channel = item.channel || state.selectedChannel || 'default';
    const timeText = formatDateTime(item.timestamp);
    if (item.type === 'text') {
      return '<div class="message-row">' +
        '<div class="message-card text">' +
          '<div class="message-meta"><span class="message-channel">' + escHtml(channel) + '</span><span class="message-time">' + escHtml(timeText) + '</span></div>' +
          '<div class="message-body">' +
            '<div class="message-text">' + escHtml(item.text || '') + '</div>' +
            '<div class="message-actions">' +
              '<button class="message-action-btn" type="button" data-action="copy-text" data-text="' + escAttr(item.text || '') + '">复制</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }
    const fileUrl = item.url ? withAuthUrl(item.url) : '#';
    const fileType = item.fileType || 'unknown';
    const fileSize = formatSize(item.fileSize);
    const fileName = item.fileName || '未命名文件';
    return '<div class="message-row">' +
      '<div class="message-card file">' +
        '<div class="message-meta"><span class="message-channel">' + escHtml(channel) + '</span><span class="message-time">' + escHtml(timeText) + '</span></div>' +
        '<div class="message-body">' +
          '<a class="file-card-link" href="' + escHtml(fileUrl) + '" target="_blank" rel="noopener noreferrer">' +
            '<span class="file-icon">📎</span>' +
            '<span class="file-copy">' +
              '<span class="file-name">' + escHtml(fileName) + '</span>' +
              '<span class="file-desc">' + escHtml(fileType) + ' · ' + escHtml(fileSize) + '</span>' +
            '</span>' +
          '</a>' +
          '<div class="message-actions">' +
            '<button class="message-action-btn" type="button" data-action="download-file" data-url="' + escAttr(fileUrl) + '" data-filename="' + escAttr(fileName) + '">下载</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function scrollToBottom() {
    if (!ui.messageScroll) return;
    requestAnimationFrame(function() {
      ui.messageScroll.scrollTop = ui.messageScroll.scrollHeight;
    });
  }

  async function loadConfig() {
    loadSettings();
    try {
      const response = await authedFetch('/api/chat/config', { method: 'GET' });
      if (!response.ok) throw new Error(await parseErrorResponse(response));
      const data = await response.json();
      state.channels = Array.isArray(data.channels) ? data.channels : [];
      state.chunkSizeBytes = Number(data.chunkSizeBytes) || DEFAULT_CHUNK_SIZE;
      const channelNames = state.channels.map(item => item.name);
      if (!channelNames.includes(state.selectedChannel)) {
        state.selectedChannel = data.defaultChannel || channelNames[0] || '';
      }
      saveSettings();
      renderApp();
      await refreshHistory(false);
      setStatus(state.channels.length ? '已连接，可开始发送。' : '未配置 Telegram 渠道。', state.channels.length ? 'idle' : 'warning', 0);
    } catch (error) {
      if (error.message === 'Unauthorized') return;
      if (error.message && error.message.indexOf('未启用') !== -1) return;
      if (ui.app === ui.loadingState?.parentNode || !document.getElementById('channelSelect')) {
        showErrorState(error.message || '加载失败');
      } else {
        setStatus(error.message || '加载配置失败', 'error', 0);
      }
    }
  }

  async function refreshHistory(showStatus) {
    try {
      if (showStatus) setStatus('正在刷新传输记录…', 'loading', 0);
      const response = await authedFetch('/api/chat/history', { method: 'GET' });
      if (!response.ok) throw new Error(await parseErrorResponse(response));
      const data = await response.json();
      state.items = Array.isArray(data.items) ? data.items : [];
      renderMessages(true);
      if (showStatus) setStatus('记录已刷新。', 'idle', 0);
    } catch (error) {
      if (error.message === 'Unauthorized') return;
      setStatus(error.message || '刷新记录失败', 'error', 0);
    }
  }

  async function sendText() {
    if (state.busy) return;
    const text = ui.messageInput.value.trim();
    if (!text) {
      setStatus('请输入要发送的文本。', 'warning', 0);
      ui.messageInput.focus();
      return;
    }
    state.busy = true;
    ui.sendBtn.disabled = true;
    setStatus('正在发送文本…', 'loading', 0);
    try {
      const response = await authedFetch('/api/chat/sendText', {
        method: 'POST',
        headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ text, channelName: state.selectedChannel })
      });
      if (!response.ok) throw new Error(await parseErrorResponse(response));
      ui.messageInput.value = '';
      await refreshHistory(false);
      setStatus('文本已发送到 Telegram。', 'idle', 0);
    } catch (error) {
      if (error.message !== 'Unauthorized') {
        setStatus(error.message || '文本发送失败', 'error', 0);
      }
    } finally {
      state.busy = false;
      ui.sendBtn.disabled = false;
    }
  }

  async function clearHistory() {
    if (state.busy) return;
    if (!window.confirm('确认清空当前 Chat 传输记录吗？这不会影响主页上传文件。')) return;
    state.busy = true;
    ui.clearBtn.disabled = true;
    setStatus('正在清空传输记录…', 'loading', 0);
    try {
      const response = await authedFetch('/api/chat/clear', {
        method: 'POST',
        headers: getAuthHeaders({ 'Content-Type': 'application/json' })
      });
      if (!response.ok) throw new Error(await parseErrorResponse(response));
      const data = await response.json();
      state.items = [];
      renderMessages(true);
      setStatus('已清空 ' + String(data.deletedCount || 0) + ' 条记录。', 'idle', 0);
    } catch (error) {
      if (error.message !== 'Unauthorized') {
        setStatus(error.message || '清空失败', 'error', 0);
      }
    } finally {
      state.busy = false;
      ui.clearBtn.disabled = false;
    }
  }

  async function uploadFiles(files) {
    if (!files || !files.length) return;
    if (state.busy) {
      setStatus('当前仍有任务处理中，请稍后再试。', 'warning', 0);
      return;
    }
    state.busy = true;
    ui.sendBtn.disabled = true;
    setQueue(files.map(file => ({ name: file.name, status: '等待上传' })));
    try {
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        updateQueueItem(i, '上传中');
        await uploadSingleFile(file, i, files.length);
        updateQueueItem(i, '已完成');
      }
      await refreshHistory(false);
      setStatus('文件发送完成。', 'idle', 0);
    } catch (error) {
      if (error.message !== 'Unauthorized') {
        setStatus(error.message || '文件发送失败', 'error', 0);
      }
    } finally {
      state.busy = false;
      ui.sendBtn.disabled = false;
      setTimeout(function(){ setQueue([]); }, 1200);
    }
  }

  function updateQueueItem(index, status) {
    if (!state.queue[index]) return;
    state.queue[index].status = status;
    renderQueue();
  }

  async function uploadSingleFile(file, index, total) {
    if (file.size <= 0) {
      return uploadDirectFile(file, index, total);
    }
    return uploadChunkedFile(file, index, total);
  }

  async function uploadDirectFile(file, index, total) {
    setStatus('正在上传文件（' + (index + 1) + '/' + total + '）：' + file.name, 'loading', ((index) / total) * 100);
    const formData = new FormData();
    formData.append('file', file, file.name);
    const response = await authedFetch(buildUploadUrl(), {
      method: 'POST',
      headers: getAuthHeaders(),
      body: formData
    });
    if (!response.ok) throw new Error(await parseErrorResponse(response));
    await response.json().catch(() => []);
    setStatus('文件已发送：' + file.name, 'idle', ((index + 1) / total) * 100);
  }

  async function uploadChunkedFile(file, index, total) {
    const totalChunks = Math.ceil(file.size / state.chunkSizeBytes);
    setStatus('正在初始化大文件上传：' + file.name, 'loading', ((index) / total) * 100);

    const initForm = new FormData();
    initForm.append('originalFileName', file.name);
    initForm.append('originalFileType', file.type || 'application/octet-stream');
    initForm.append('totalChunks', String(totalChunks));

    const initResponse = await authedFetch(buildUploadUrl({ initChunked: 'true' }), {
      method: 'POST',
      headers: getAuthHeaders(),
      body: initForm
    });
    if (!initResponse.ok) throw new Error(await parseErrorResponse(initResponse));
    const initData = await initResponse.json();
    const uploadId = initData.uploadId;
    if (!uploadId) throw new Error('分块上传初始化失败');

    for (let chunkIndex = 0; chunkIndex < totalChunks; chunkIndex++) {
      const start = chunkIndex * state.chunkSizeBytes;
      const end = Math.min(start + state.chunkSizeBytes, file.size);
      const chunkBlob = file.slice(start, end);
      const chunkForm = new FormData();
      chunkForm.append('file', chunkBlob, file.name + '.part' + String(chunkIndex).padStart(3, '0'));
      chunkForm.append('chunkIndex', String(chunkIndex));
      chunkForm.append('totalChunks', String(totalChunks));
      chunkForm.append('uploadId', uploadId);
      chunkForm.append('originalFileName', file.name);
      chunkForm.append('originalFileType', file.type || 'application/octet-stream');

      const overallProgress = ((index + (chunkIndex + 1) / totalChunks) / total) * 100;
      setStatus('正在上传分片 ' + (chunkIndex + 1) + '/' + totalChunks + '：' + file.name, 'loading', overallProgress);
      const chunkResponse = await authedFetch(buildUploadUrl({ chunked: 'true' }), {
        method: 'POST',
        headers: getAuthHeaders(),
        body: chunkForm
      });
      if (!chunkResponse.ok) throw new Error(await parseErrorResponse(chunkResponse));
      await chunkResponse.json().catch(() => ({}));
    }

    await mergeChunkedFile(file, uploadId, totalChunks, index, total);
    setStatus('大文件已发送：' + file.name, 'idle', ((index + 1) / total) * 100);
  }

  async function mergeChunkedFile(file, uploadId, totalChunks, index, total) {
    const mergeForm = new FormData();
    mergeForm.append('uploadId', uploadId);
    mergeForm.append('totalChunks', String(totalChunks));
    mergeForm.append('originalFileName', file.name);
    mergeForm.append('originalFileType', file.type || 'application/octet-stream');

    let attempt = 0;
    while (attempt < 20) {
      attempt++;
      const response = await authedFetch(buildUploadUrl({ chunked: 'true', merge: 'true' }), {
        method: 'POST',
        headers: getAuthHeaders(),
        body: mergeForm
      });

      if (response.ok) {
        await response.json().catch(() => []);
        return;
      }

      if (response.status !== 409) {
        throw new Error(await parseErrorResponse(response));
      }

      const pending = await response.json().catch(() => ({}));
      const retryAfterMs = Number(pending.retryAfterMs || 1000);
      const overallProgress = ((index + 0.98) / total) * 100;
      setStatus('正在合并分片：' + file.name + '（第 ' + attempt + ' 次检查）', 'loading', overallProgress);
      await new Promise(resolve => setTimeout(resolve, retryAfterMs));
    }

    throw new Error('分块合并超时，请稍后刷新记录确认结果');
  }

  loadConfig();
})();
</script>
</body>
</html>

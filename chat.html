<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Transfer</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --panel:rgba(255,255,255,.78);
  --panel-strong:rgba(255,255,255,.92);
  --panel-soft:rgba(245,249,255,.84);
  --panel-muted:rgba(239,245,255,.74);
  --border:rgba(113,158,220,.18);
  --border-strong:rgba(113,158,220,.28);
  --text:#183450;
  --text-muted:#627d96;
  --primary:#2f89ff;
  --primary-dark:#2468ea;
  --secondary:#37c6b6;
  --warning:#d97706;
  --danger:#dc2626;
  --shadow-xs:0 10px 24px rgba(40,91,161,.08);
  --shadow-sm:0 16px 32px rgba(40,91,161,.1);
  --shadow-md:0 24px 60px rgba(40,91,161,.12);
  --radius-sm:12px;
  --radius-md:16px;
  --radius-lg:22px;
  --radius-xl:28px;
  --radius-full:999px;
  --ease:cubic-bezier(.22,1,.36,1);
}
html{background:#eef5ff;color-scheme:light}
body{
  min-height:100vh;
  font-family:"Segoe UI","SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top left,rgba(94,181,255,.18),transparent 30%),
    radial-gradient(circle at 88% 10%,rgba(55,198,182,.16),transparent 26%),
    linear-gradient(180deg,#eef5ff 0%,#f6fbff 100%);
  padding:24px;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.32),transparent 32%,rgba(47,137,255,.03));
}
.app-shell{
  position:relative;
  width:min(1080px,100%);
  min-height:calc(100vh - 48px);
  margin:0 auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius-xl);
  box-shadow:var(--shadow-md);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  overflow:hidden;
}
.app-shell::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.34),transparent 40%,rgba(55,198,182,.05));
}
.loading,.empty-state{
  min-height:calc(100vh - 48px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  text-align:center;
  padding:48px 28px;
  color:var(--text-muted);
  position:relative;
  z-index:1;
}
.loading-spinner{
  width:44px;
  height:44px;
  border-radius:50%;
  border:3px solid rgba(47,137,255,.14);
  border-top-color:var(--primary);
  animation:spin .8s linear infinite;
  box-shadow:0 0 0 10px rgba(255,255,255,.36);
}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.empty-state .icon{font-size:40px}
.empty-state p,.loading p{font-size:18px;font-weight:800;color:var(--text);letter-spacing:-.02em}
.empty-state .hint{max-width:440px;font-size:13px;line-height:1.7;color:var(--text-muted)}
.auth-card{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.auth-card input,
.channel-select,
.composer textarea{
  border:1px solid var(--border);
  background:rgba(255,255,255,.92);
  color:var(--text);
  outline:none;
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease);
}
.auth-card input,
.channel-select,
.auth-card button,
.primary-btn,
.secondary-btn,
.danger-btn,
.icon-btn,
.attach-btn,
.send-btn{
  height:42px;
  border-radius:14px;
  font-size:13px;
  font-weight:700;
}
.auth-card input{
  width:min(260px,100%);
  padding:0 14px;
}
.auth-card input:focus,
.channel-select:focus,
.composer textarea:focus{
  border-color:var(--border-strong);
  box-shadow:0 0 0 4px rgba(47,137,255,.08);
}
button{
  border:none;
  cursor:pointer;
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease);
}
button:hover{transform:translateY(-2px)}
button:active{transform:translateY(0)}
button:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.auth-card button,.primary-btn,.send-btn{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark) 55%,var(--secondary));
  color:#fff;
  box-shadow:0 16px 28px rgba(36,104,234,.22);
}
.auth-card button:hover,.primary-btn:hover,.send-btn:hover{box-shadow:0 22px 36px rgba(36,104,234,.26)}
.secondary-btn,.icon-btn,.attach-btn{
  background:var(--panel-strong);
  border:1px solid var(--border);
  color:var(--text);
  box-shadow:var(--shadow-xs);
}
.secondary-btn:hover,.icon-btn:hover,.attach-btn:hover{background:#fff;border-color:var(--border-strong)}
.danger-btn{
  background:rgba(254,242,242,.88);
  border:1px solid rgba(239,68,68,.18);
  color:var(--danger);
  box-shadow:var(--shadow-xs);
}
.danger-btn:hover{background:#fff5f5;border-color:rgba(239,68,68,.28)}
.chat-layout{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-rows:auto auto minmax(0,1fr) auto auto;
  min-height:calc(100vh - 48px);
}
.page-header{
  padding:24px 24px 16px;
  border-bottom:1px solid var(--border);
}
.page-header h1{font-size:28px;font-weight:800;letter-spacing:-.04em}
.control-bar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  padding:16px 24px;
  border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.52);
}
.channel-select{
  min-width:180px;
  padding:0 14px;
}
.meta-text{font-size:12px;color:var(--text-muted)}
.message-scroll{
  min-height:0;
  overflow:auto;
  padding:20px 24px;
  display:flex;
  flex-direction:column;
  gap:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04));
}
.timeline-tip{
  align-self:center;
  padding:7px 14px;
  border-radius:var(--radius-full);
  border:1px solid var(--border);
  background:var(--panel-strong);
  font-size:12px;
  color:var(--text-muted);
  box-shadow:var(--shadow-xs);
}
.message-row{display:flex;justify-content:flex-end}
.message-card{
  max-width:min(100%,760px);
  padding:14px 16px;
  border-radius:18px;
  border:1px solid var(--border);
  background:linear-gradient(135deg,rgba(239,245,255,.96),rgba(255,255,255,.88));
  box-shadow:var(--shadow-xs);
}
.message-card.file{background:var(--panel-strong)}
.message-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font-size:11px;color:var(--text-muted)}
.message-meta-main{display:flex;align-items:center;gap:8px;min-width:0}
.message-channel{font-weight:700;color:var(--text)}
.message-time{white-space:nowrap}
.message-body{display:flex;flex-direction:column;gap:10px}
.message-text{font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.message-actions{display:flex;gap:8px;flex-wrap:wrap}
.message-action-btn{
  height:32px;
  padding:0 12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.92);
  color:var(--text);
  font-size:12px;
  font-weight:700;
}
.message-action-btn:hover{background:#fff;border-color:var(--border-strong);box-shadow:var(--shadow-xs)}
.file-card-link{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.file-icon{
  width:40px;
  height:40px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:linear-gradient(135deg,rgba(47,137,255,.12),rgba(55,198,182,.14));
}
.file-copy{min-width:0;display:flex;flex-direction:column;gap:4px}
.file-name{font-size:14px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-desc{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-chat{
  margin:auto 0;
  padding:34px 24px;
  border:1px dashed var(--border-strong);
  border-radius:20px;
  background:var(--panel-strong);
  text-align:center;
  color:var(--text-muted);
  box-shadow:var(--shadow-xs);
}
.empty-chat .icon{font-size:42px;display:block;margin-bottom:8px}
.empty-chat p{font-size:18px;font-weight:800;color:var(--text)}
.empty-chat .hint{margin-top:8px;font-size:13px;line-height:1.7}
.status-strip{display:none;padding:0 24px}
.status-strip.show{display:block;padding:12px 24px 0}
.status-text{
  padding:11px 14px;
  border-radius:14px;
  border:1px solid var(--border);
  background:var(--panel-soft);
  color:var(--text-muted);
  font-size:12px;
  line-height:1.6;
}
.status-text.info{background:rgba(239,246,255,.92);border-color:rgba(59,130,246,.18);color:#1d4ed8}
.status-text.error{background:rgba(254,242,242,.94);border-color:rgba(239,68,68,.18);color:var(--danger)}
.status-text.warning{background:rgba(255,247,237,.94);border-color:rgba(245,158,11,.18);color:var(--warning)}
.pending-state{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--text-muted)}
.pending-state::before{
  content:"";
  width:10px;
  height:10px;
  border-radius:50%;
  border:2px solid currentColor;
  border-right-color:transparent;
  animation:spin .7s linear infinite;
}
.pending-state.error{color:var(--danger)}
.pending-state.error::before{animation:none;border-right-color:currentColor}
.message-card.pending{border-style:dashed}
.message-card.pending.text{background:linear-gradient(135deg,rgba(243,247,255,.96),rgba(255,255,255,.88))}
.message-card.pending.file{background:rgba(255,255,255,.88)}
.message-actions.compact{margin-top:-2px}
.composer-wrap{padding:18px 24px 24px;border-top:1px solid var(--border)}
.composer{
  border:1px solid var(--border);
  border-radius:20px;
  background:var(--panel-strong);
  padding:16px;
  box-shadow:var(--shadow-sm);
}
.composer textarea{
  width:100%;
  min-height:110px;
  padding:14px;
  border-radius:16px;
  font-size:14px;
  line-height:1.7;
  resize:none;
  background:rgba(248,251,255,.88);
}
.composer-toolbar{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:12px;
  align-items:center;
  margin-top:14px;
}
.toolbar-left,.toolbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar-right{justify-content:flex-end}
.attach-btn{display:inline-flex;align-items:center;justify-content:center}
.attach-btn input{display:none}
.composer-hint{font-size:12px;line-height:1.6;color:var(--text-muted)}
@media(max-width:720px){
  body{padding:0}
  .app-shell{width:100%;min-height:100vh;border-radius:0;border-left:none;border-right:none}
  .page-header,.control-bar,.message-scroll,.status-strip,.composer-wrap{padding-left:16px;padding-right:16px}
  .page-header{padding-top:20px}
  .composer-toolbar{grid-template-columns:1fr}
  .toolbar-right{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="app-shell" id="app">
  <div class="loading" id="loadingState">
    <div class="loading-spinner"></div>
    <p>Loading...</p>
  </div>
</div>

<script>
(function(){
  const SETTINGS_KEY = 'chatPageSettings';
  const DEFAULT_CHUNK_SIZE = 18 * 1024 * 1024;
  const state = {
    channels: [],
    selectedChannel: '',
    items: [],
    pendingItems: [],
    chunkSizeBytes: DEFAULT_CHUNK_SIZE,
    busy: false,
    statusText: '',
    statusTone: ''
  };

  const ui = {
    app: document.getElementById('app'),
    loadingState: document.getElementById('loadingState')
  };

  function getAuthCode() {
    const params = new URLSearchParams(window.location.search);
    return params.get('authCode') || '';
  }

  function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  function escAttr(str) {
    return escHtml(str).replace(/`/g, '&#96;');
  }

  async function copyMessageText(text) {
    try {
      await navigator.clipboard.writeText(String(text || ''));
      setStatus('文本已复制。', 'info');
    } catch (error) {
      setStatus(error.message || '复制失败，请手动选择文本。', 'error');
    }
  }

  function triggerDownload(url, filename) {
    if (!url) {
      setStatus('下载链接不可用。', 'warning');
      return;
    }
    const a = document.createElement('a');
    a.href = url;
    a.download = filename || 'download';
    a.click();
    setStatus('开始下载：' + (filename || '文件'), 'info');
  }

  function getAuthHeaders(headers) {
    const finalHeaders = headers ? { ...headers } : {};
    const authCode = getAuthCode();
    if (authCode) finalHeaders.authCode = authCode;
    return finalHeaders;
  }

  function withAuthUrl(path) {
    const authCode = getAuthCode();
    const url = new URL(path, window.location.origin);
    if (authCode) url.searchParams.set('authCode', authCode);
    return url.toString();
  }

  function loadSettings() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed.selectedChannel === 'string') {
        state.selectedChannel = parsed.selectedChannel;
      }
    } catch {}
  }

  function saveSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({ selectedChannel: state.selectedChannel }));
    } catch {}
  }

  function formatTime(ts) {
    if (!ts) return '--:--';
    const date = new Date(Number(ts));
    const hh = String(date.getHours()).padStart(2, '0');
    const mm = String(date.getMinutes()).padStart(2, '0');
    return hh + ':' + mm;
  }

  function formatDateTime(ts) {
    if (!ts) return '--';
    const date = new Date(Number(ts));
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return month + '-' + day + ' ' + formatTime(ts);
  }

  function formatSize(value) {
    const numeric = Number(value);
    if (Number.isNaN(numeric) || numeric < 0) return '--';
    if (numeric < 1) return (numeric * 1024).toFixed(0) + ' KB';
    if (numeric < 1024) return numeric.toFixed(numeric >= 100 ? 0 : 2) + ' MB';
    return (numeric / 1024).toFixed(2) + ' GB';
  }

  function createLocalId(prefix) {
    return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  }

  function setStatus(text, tone) {
    state.statusText = text || '';
    state.statusTone = tone === 'error' ? 'error' : tone === 'warning' ? 'warning' : 'info';
    syncStatusUi();
  }

  function clearStatus() {
    state.statusText = '';
    state.statusTone = '';
    syncStatusUi();
  }

  function syncStatusUi() {
    if (!ui.statusStrip || !ui.statusText) return;
    const show = !!state.statusText;
    ui.statusStrip.className = 'status-strip' + (show ? ' show' : '');
    ui.statusText.className = 'status-text' + (show && state.statusTone ? ' ' + state.statusTone : '');
    ui.statusText.textContent = state.statusText || '';
  }

  function setBusy(value) {
    state.busy = !!value;
    syncBusyUi();
  }

  function syncBusyUi() {
    const hasChannels = state.channels.length > 0;
    if (ui.sendBtn) ui.sendBtn.disabled = !hasChannels || state.busy;
    if (ui.fileInput) ui.fileInput.disabled = !hasChannels || state.busy;
    if (ui.messageInput) ui.messageInput.disabled = !hasChannels || state.busy;
    if (ui.clearInputBtn) ui.clearInputBtn.disabled = !hasChannels || state.busy;
    if (ui.channelSelect) ui.channelSelect.disabled = !hasChannels || state.busy;
    if (ui.clearBtn) ui.clearBtn.disabled = state.busy;
  }

  function createPendingTextItem(text) {
    return {
      localId: createLocalId('text'),
      isPending: true,
      type: 'text',
      text,
      channel: state.selectedChannel || 'default',
      timestamp: Date.now(),
      status: 'sending',
      errorMessage: ''
    };
  }

  function createPendingFileItem(file) {
    return {
      localId: createLocalId('file'),
      isPending: true,
      type: 'file',
      fileName: file?.name || '未命名文件',
      fileType: file?.type || 'application/octet-stream',
      fileSize: Math.max(0.0001, Number(file?.size || 0) / 1024 / 1024),
      channel: state.selectedChannel || 'default',
      timestamp: Date.now(),
      status: 'uploading',
      errorMessage: ''
    };
  }

  function addPendingItems(items, scrollAfterRender) {
    if (!Array.isArray(items) || !items.length) return;
    state.pendingItems = state.pendingItems.concat(items);
    renderMessages(scrollAfterRender !== false);
  }

  function updatePendingItem(localId, patch, scrollAfterRender) {
    let changed = false;
    state.pendingItems = state.pendingItems.map(function(item) {
      if (item.localId !== localId) return item;
      changed = true;
      return { ...item, ...(patch || {}) };
    });
    if (changed) renderMessages(!!scrollAfterRender);
  }

  function resolvePendingMatch(pendingItem, serverItem) {
    if (!pendingItem || !serverItem || pendingItem.type !== serverItem.type) return false;
    if (pendingItem.serverId) {
      return String(serverItem.id || '') === String(pendingItem.serverId);
    }
    if (pendingItem.status !== 'syncing') return false;
    const serverTime = Number(serverItem.timestamp || 0);
    const pendingTime = Number(pendingItem.timestamp || 0);
    if (pendingItem.type === 'text') {
      return serverItem.text === pendingItem.text
        && serverItem.channel === pendingItem.channel
        && Math.abs(serverTime - pendingTime) < 60000;
    }
    return serverItem.fileName === pendingItem.fileName
      && serverItem.channel === pendingItem.channel
      && Math.abs(serverTime - pendingTime) < 10 * 60 * 1000;
  }

  function reconcilePendingItems() {
    if (!state.pendingItems.length || !state.items.length) return;
    state.pendingItems = state.pendingItems.filter(function(pendingItem) {
      return !state.items.some(function(serverItem) {
        return resolvePendingMatch(pendingItem, serverItem);
      });
    });
  }

  function extractFileIdFromUploadPayload(payload) {
    const first = Array.isArray(payload)
      ? payload[0]
      : (Array.isArray(payload?.result) ? payload.result[0] : payload);
    const src = first && first.src ? String(first.src) : '';
    const match = src.match(/\/file\/([^/?#]+)/);
    return match ? decodeURIComponent(match[1]) : '';
  }

  function showAuthPrompt() {
    ui.app.innerHTML =
      '<div class="empty-state">' +
        '<div class="icon">🔐</div>' +
        '<p>需要认证</p>' +
        '<div class="hint">请输入上传密码后继续访问 Chat 页面。</div>' +
        '<div class="auth-card">' +
          '<input type="password" id="authInput" placeholder="密码">' +
          '<button id="authSubmitBtn">确定</button>' +
        '</div>' +
      '</div>';
    const input = document.getElementById('authInput');
    const submit = document.getElementById('authSubmitBtn');
    function applyAuth() {
      const code = input.value.trim();
      if (!code) return;
      const url = new URL(window.location.href);
      url.searchParams.set('authCode', code);
      window.location.href = url.toString();
    }
    input.focus();
    input.addEventListener('keydown', function(event) {
      if (event.key === 'Enter') applyAuth();
    });
    submit.addEventListener('click', applyAuth);
  }

  function showDisabledState(message) {
    ui.app.innerHTML =
      '<div class="empty-state">' +
        '<div class="icon">🚫</div>' +
        '<p>Chat 页面未启用</p>' +
        '<div class="hint">' + escHtml(message || '请先在后台管理 - 其他设置中开启 Chat 页面。') + '</div>' +
      '</div>';
  }

  function showErrorState(message) {
    ui.app.innerHTML =
      '<div class="empty-state">' +
        '<div class="icon">⚠️</div>' +
        '<p>' + escHtml(message || '加载失败') + '</p>' +
        '<div class="hint">请检查网络连接，或稍后刷新重试。</div>' +
      '</div>';
  }

  async function parseErrorResponse(response) {
    let message = '';
    try {
      const data = await response.clone().json();
      message = data.error || data.message || '';
    } catch {}
    if (!message) {
      try {
        message = (await response.text()).trim();
      } catch {}
    }
    return message || ('请求失败（' + response.status + '）');
  }

  async function authedFetch(url, options) {
    const opts = { ...(options || {}) };
    opts.headers = getAuthHeaders(opts.headers || {});
    const response = await fetch(url, opts);
    if (response.status === 401) {
      showAuthPrompt();
      throw new Error('Unauthorized');
    }
    if (response.status === 403) {
      let message = 'Chat 页面未启用';
      try {
        const data = await response.clone().json();
        message = data.error || message;
      } catch {
        message = await parseErrorResponse(response);
      }
      showDisabledState(message);
      throw new Error(message);
    }
    return response;
  }

  function buildUploadUrl(extraParams) {
    const url = new URL('/upload', window.location.origin);
    url.searchParams.set('sourceApp', 'chat');
    url.searchParams.set('recordType', 'chat_transfer');
    url.searchParams.set('messageType', 'file');
    url.searchParams.set('uploadFolder', '__chat__');
    url.searchParams.set('uploadChannel', 'telegram');
    if (state.selectedChannel) url.searchParams.set('channelName', state.selectedChannel);
    Object.entries(extraParams || {}).forEach(([key, value]) => {
      if (value !== undefined && value !== null && value !== '') {
        url.searchParams.set(key, value);
      }
    });
    return url.toString();
  }

  function renderApp() {
    const hasChannels = state.channels.length > 0;
    ui.app.innerHTML = `
      <div class="chat-layout">
        <header class="page-header">
          <h1>Chat Transfer</h1>
        </header>

        <section class="control-bar">
          <select class="channel-select" id="channelSelect" ${hasChannels ? '' : 'disabled'}>
            ${state.channels.map(channel => '<option value="' + escHtml(channel.name) + '" ' + (channel.name === state.selectedChannel ? 'selected' : '') + '>' + escHtml(channel.name || 'default') + '</option>').join('')}
          </select>
          <button class="secondary-btn" id="refreshBtn">刷新</button>
          <button class="secondary-btn" id="jumpBottomBtn">最新</button>
          <button class="danger-btn" id="clearBtn">清空记录</button>
          <span class="meta-text" id="topbarChannel">当前渠道：${escHtml(state.selectedChannel || '未选择')}</span>
        </section>

        <section class="message-scroll" id="messageScroll"></section>

        <section class="status-strip${state.statusText ? ' show' : ''}" id="statusStrip">
          <div class="status-text${state.statusTone ? ' ' + state.statusTone : ''}" id="statusText">${escHtml(state.statusText)}</div>
        </section>

        <section class="composer-wrap">
          <div class="composer">
            <textarea id="messageInput" placeholder="输入想发送到 Telegram 的文本…" ${hasChannels ? '' : 'disabled'}></textarea>
            <div class="composer-toolbar">
              <div class="toolbar-left">
                <label class="attach-btn">
                  选择文件
                  <input type="file" id="fileInput" multiple ${hasChannels ? '' : 'disabled'}>
                </label>
                <button class="icon-btn" id="clearInputBtn" ${hasChannels ? '' : 'disabled'}>清空输入</button>
                <div class="composer-hint">${hasChannels ? '回车发送，Shift + Enter 换行' : '请先配置 Telegram 渠道'}</div>
              </div>
              <div class="toolbar-right">
                <button class="send-btn" id="sendBtn" ${hasChannels ? '' : 'disabled'}>发送</button>
              </div>
            </div>
          </div>
        </section>
      </div>`;

    ui.channelSelect = document.getElementById('channelSelect');
    ui.refreshBtn = document.getElementById('refreshBtn');
    ui.jumpBottomBtn = document.getElementById('jumpBottomBtn');
    ui.clearBtn = document.getElementById('clearBtn');
    ui.statusStrip = document.getElementById('statusStrip');
    ui.statusText = document.getElementById('statusText');
    ui.messageScroll = document.getElementById('messageScroll');
    ui.messageInput = document.getElementById('messageInput');
    ui.fileInput = document.getElementById('fileInput');
    ui.sendBtn = document.getElementById('sendBtn');
    ui.clearInputBtn = document.getElementById('clearInputBtn');
    ui.topbarChannel = document.getElementById('topbarChannel');

    bindUiEvents();
    syncStatusUi();
    syncBusyUi();
    renderMessages(true);
  }

  function bindUiEvents() {
    ui.channelSelect && ui.channelSelect.addEventListener('change', function() {
      state.selectedChannel = this.value;
      saveSettings();
      if (ui.topbarChannel) ui.topbarChannel.textContent = '当前渠道：' + (state.selectedChannel || '未选择');
      clearStatus();
    });

    ui.refreshBtn && ui.refreshBtn.addEventListener('click', function() {
      refreshHistory(true);
    });

    ui.jumpBottomBtn && ui.jumpBottomBtn.addEventListener('click', function() {
      scrollToBottom();
    });

    ui.clearBtn && ui.clearBtn.addEventListener('click', function() {
      clearHistory();
    });

    ui.sendBtn && ui.sendBtn.addEventListener('click', function() {
      sendText();
    });

    ui.clearInputBtn && ui.clearInputBtn.addEventListener('click', function() {
      ui.messageInput.value = '';
      ui.messageInput.focus();
    });

    ui.messageInput && ui.messageInput.addEventListener('keydown', function(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendText();
      }
    });

    ui.fileInput && ui.fileInput.addEventListener('change', function(event) {
      const files = Array.from(event.target.files || []);
      if (files.length) uploadFiles(files);
      event.target.value = '';
    });

    ui.messageScroll && ui.messageScroll.addEventListener('click', function(event) {
      const actionButton = event.target.closest('[data-action]');
      if (!actionButton) return;
      const action = actionButton.getAttribute('data-action');
      if (action === 'copy-text') {
        copyMessageText(actionButton.getAttribute('data-text') || '');
        return;
      }
      if (action === 'download-file') {
        triggerDownload(actionButton.getAttribute('data-url') || '', actionButton.getAttribute('data-filename') || 'download');
        return;
      }
      if (action === 'retry-text') {
        retryPendingText(actionButton.getAttribute('data-local-id') || '');
      }
    });
  }

  function renderMessages(scrollAfterRender) {
    if (!ui.messageScroll) return;
    const mergedItems = state.items.concat(state.pendingItems).sort(function(a, b) {
      return Number(a.timestamp || 0) - Number(b.timestamp || 0);
    });
    if (!mergedItems.length) {
      ui.messageScroll.innerHTML =
        '<div class="empty-chat">' +
          '<span class="icon">📭</span>' +
          '<p>还没有消息</p>' +
          '<div class="hint">发一条试试</div>' +
        '</div>';
    } else {
      ui.messageScroll.innerHTML = mergedItems.map(renderMessageItem).join('');
    }
    if (scrollAfterRender) scrollToBottom();
  }

  function getPendingStatusLabel(item) {
    const statusMap = {
      sending: '发送中',
      uploading: '上传中',
      merging: '合并中',
      syncing: '同步中',
      error: '失败'
    };
    return statusMap[item.status] || '处理中';
  }

  function renderPendingBadge(item) {
    if (!item.isPending) return '';
    const label = getPendingStatusLabel(item);
    const cls = item.status === 'error' ? 'pending-state error' : 'pending-state';
    return '<span class="' + cls + '">' + escHtml(label) + '</span>';
  }

  function renderTextActions(item) {
    const actions = [];
    actions.push('<button class="message-action-btn" type="button" data-action="copy-text" data-text="' + escAttr(item.text || '') + '">复制</button>');
    if (item.isPending && item.status === 'error') {
      actions.push('<button class="message-action-btn" type="button" data-action="retry-text" data-local-id="' + escAttr(item.localId || '') + '">重试</button>');
    }
    return actions.join('');
  }

  function renderMessageMeta(item, channel, timeText) {
    return '<div class="message-meta">' +
      '<span class="message-meta-main"><span class="message-channel">' + escHtml(channel) + '</span>' + renderPendingBadge(item) + '</span>' +
      '<span class="message-time">' + escHtml(timeText) + '</span>' +
    '</div>';
  }

  function renderMessageItem(item) {
    const channel = item.channel || state.selectedChannel || 'default';
    const timeText = formatDateTime(item.timestamp);
    const pendingClass = item.isPending ? ' pending' : '';
    if (item.type === 'text') {
      return '<div class="message-row">' +
        '<div class="message-card text' + pendingClass + '">' +
          renderMessageMeta(item, channel, timeText) +
          '<div class="message-body">' +
            '<div class="message-text">' + escHtml(item.text || '') + '</div>' +
            '<div class="message-actions' + (item.isPending ? ' compact' : '') + '">' +
              renderTextActions(item) +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }
    const fileUrl = item.url ? withAuthUrl(item.url) : '#';
    const fileType = item.fileType || 'unknown';
    const fileSize = formatSize(item.fileSize);
    const fileName = item.fileName || '未命名文件';
    const linkStart = item.isPending
      ? '<div class="file-card-link">'
      : '<a class="file-card-link" href="' + escHtml(fileUrl) + '" target="_blank" rel="noopener noreferrer">';
    const linkEnd = item.isPending ? '</div>' : '</a>';
    const actions = item.isPending ? '' : '<button class="message-action-btn" type="button" data-action="download-file" data-url="' + escAttr(fileUrl) + '" data-filename="' + escAttr(fileName) + '">下载</button>';
    return '<div class="message-row">' +
      '<div class="message-card file' + pendingClass + '">' +
        renderMessageMeta(item, channel, timeText) +
        '<div class="message-body">' +
          linkStart +
            '<span class="file-icon">📎</span>' +
            '<span class="file-copy">' +
              '<span class="file-name">' + escHtml(fileName) + '</span>' +
              '<span class="file-desc">' + escHtml(fileType) + ' · ' + escHtml(fileSize) + '</span>' +
            '</span>' +
          linkEnd +
          (actions ? '<div class="message-actions">' + actions + '</div>' : '') +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function scrollToBottom() {
    if (!ui.messageScroll) return;
    requestAnimationFrame(function() {
      ui.messageScroll.scrollTop = ui.messageScroll.scrollHeight;
    });
  }

  async function loadConfig() {
    loadSettings();
    try {
      const response = await authedFetch('/api/chat/config', { method: 'GET' });
      if (!response.ok) throw new Error(await parseErrorResponse(response));
      const data = await response.json();
      state.channels = Array.isArray(data.channels) ? data.channels : [];
      state.chunkSizeBytes = Number(data.chunkSizeBytes) || DEFAULT_CHUNK_SIZE;
      const channelNames = state.channels.map(item => item.name);
      if (!channelNames.includes(state.selectedChannel)) {
        state.selectedChannel = data.defaultChannel || channelNames[0] || '';
      }
      saveSettings();
      renderApp();
      await refreshHistory(false);
      if (!state.channels.length) {
        setStatus('未配置 Telegram 渠道。', 'warning');
      } else {
        clearStatus();
      }
    } catch (error) {
      if (error.message === 'Unauthorized') return;
      if (error.message && error.message.indexOf('未启用') !== -1) return;
      if (ui.app === ui.loadingState?.parentNode || !document.getElementById('channelSelect')) {
        showErrorState(error.message || '加载失败');
      } else {
        setStatus(error.message || '加载配置失败', 'error');
      }
    }
  }

  async function refreshHistory(showStatus) {
    try {
      if (showStatus) clearStatus();
      const response = await authedFetch('/api/chat/history', { method: 'GET' });
      if (!response.ok) throw new Error(await parseErrorResponse(response));
      const data = await response.json();
      state.items = Array.isArray(data.items) ? data.items : [];
      reconcilePendingItems();
      renderMessages(true);
      if (showStatus) clearStatus();
    } catch (error) {
      if (error.message === 'Unauthorized') return;
      setStatus(error.message || '刷新记录失败', 'error');
    }
  }

  async function submitPendingText(localId, text) {
    updatePendingItem(localId, { status: 'sending', errorMessage: '', timestamp: Date.now() }, true);
    setBusy(true);
    try {
      const response = await authedFetch('/api/chat/sendText', {
        method: 'POST',
        headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ text, channelName: state.selectedChannel })
      });
      if (!response.ok) throw new Error(await parseErrorResponse(response));
      const data = await response.json();
      updatePendingItem(localId, {
        status: 'syncing',
        serverId: data.id || '',
        channel: data.channel || state.selectedChannel || 'default',
        timestamp: Number(data.timestamp || Date.now())
      }, true);
      clearStatus();
      await refreshHistory(false);
    } catch (error) {
      if (error.message !== 'Unauthorized') {
        updatePendingItem(localId, { status: 'error', errorMessage: error.message || '发送失败' }, true);
      }
    } finally {
      setBusy(false);
    }
  }

  async function sendText() {
    if (state.busy) return;
    const text = ui.messageInput.value.trim();
    if (!text) {
      setStatus('请输入内容', 'warning');
      ui.messageInput.focus();
      return;
    }
    const pendingItem = createPendingTextItem(text);
    ui.messageInput.value = '';
    clearStatus();
    addPendingItems([pendingItem], true);
    await submitPendingText(pendingItem.localId, text);
  }

  function retryPendingText(localId) {
    if (!localId || state.busy) return;
    const item = state.pendingItems.find(function(entry) { return entry.localId === localId; });
    if (!item || item.type !== 'text') return;
    clearStatus();
    submitPendingText(localId, item.text || '');
  }

  async function clearHistory() {
    if (state.busy) return;
    if (!window.confirm('确认清空当前 Chat 传输记录吗？这不会影响主页上传文件。')) return;
    setBusy(true);
    clearStatus();
    try {
      const response = await authedFetch('/api/chat/clear', {
        method: 'POST',
        headers: getAuthHeaders({ 'Content-Type': 'application/json' })
      });
      if (!response.ok) throw new Error(await parseErrorResponse(response));
      const data = await response.json();
      state.items = [];
      state.pendingItems = [];
      renderMessages(true);
      setStatus('已清空 ' + String(data.deletedCount || 0) + ' 条记录。', 'warning');
    } catch (error) {
      if (error.message !== 'Unauthorized') {
        setStatus(error.message || '清空失败', 'error');
      }
    } finally {
      setBusy(false);
    }
  }

  async function uploadFiles(files) {
    if (!files || !files.length) return;
    if (state.busy) {
      setStatus('请稍后再试', 'warning');
      return;
    }
    const pendingFiles = files.map(createPendingFileItem);
    clearStatus();
    addPendingItems(pendingFiles, true);
    setBusy(true);
    try {
      for (let i = 0; i < files.length; i++) {
        try {
          await uploadSingleFile(files[i], pendingFiles[i].localId);
        } catch (error) {
          if (error.message === 'Unauthorized') throw error;
          updatePendingItem(pendingFiles[i].localId, { status: 'error', errorMessage: error.message || '上传失败' }, true);
        }
      }
      await refreshHistory(false);
    } catch (error) {
      if (error.message !== 'Unauthorized') {
        setStatus(error.message || '文件发送失败', 'error');
      }
    } finally {
      setBusy(false);
    }
  }

  async function uploadSingleFile(file, localId) {
    if (file.size <= 0) {
      return uploadDirectFile(file, localId);
    }
    return uploadChunkedFile(file, localId);
  }

  async function uploadDirectFile(file, localId) {
    updatePendingItem(localId, { status: 'uploading', errorMessage: '', timestamp: Date.now() }, true);
    const formData = new FormData();
    formData.append('file', file, file.name);
    const response = await authedFetch(buildUploadUrl(), {
      method: 'POST',
      headers: getAuthHeaders(),
      body: formData
    });
    if (!response.ok) throw new Error(await parseErrorResponse(response));
    const result = await response.json().catch(() => []);
    updatePendingItem(localId, {
      status: 'syncing',
      serverId: extractFileIdFromUploadPayload(result),
      timestamp: Date.now()
    }, true);
  }

  async function uploadChunkedFile(file, localId) {
    updatePendingItem(localId, { status: 'uploading', errorMessage: '' }, true);
    const totalChunks = Math.ceil(file.size / state.chunkSizeBytes);

    const initForm = new FormData();
    initForm.append('originalFileName', file.name);
    initForm.append('originalFileType', file.type || 'application/octet-stream');
    initForm.append('totalChunks', String(totalChunks));

    const initResponse = await authedFetch(buildUploadUrl({ initChunked: 'true' }), {
      method: 'POST',
      headers: getAuthHeaders(),
      body: initForm
    });
    if (!initResponse.ok) throw new Error(await parseErrorResponse(initResponse));
    const initData = await initResponse.json();
    const uploadId = initData.uploadId;
    if (!uploadId) throw new Error('分块上传初始化失败');

    for (let chunkIndex = 0; chunkIndex < totalChunks; chunkIndex++) {
      const start = chunkIndex * state.chunkSizeBytes;
      const end = Math.min(start + state.chunkSizeBytes, file.size);
      const chunkBlob = file.slice(start, end);
      const chunkForm = new FormData();
      chunkForm.append('file', chunkBlob, file.name + '.part' + String(chunkIndex).padStart(3, '0'));
      chunkForm.append('chunkIndex', String(chunkIndex));
      chunkForm.append('totalChunks', String(totalChunks));
      chunkForm.append('uploadId', uploadId);
      chunkForm.append('originalFileName', file.name);
      chunkForm.append('originalFileType', file.type || 'application/octet-stream');

      const chunkResponse = await authedFetch(buildUploadUrl({ chunked: 'true' }), {
        method: 'POST',
        headers: getAuthHeaders(),
        body: chunkForm
      });
      if (!chunkResponse.ok) throw new Error(await parseErrorResponse(chunkResponse));
      await chunkResponse.json().catch(() => ({}));
    }

    await mergeChunkedFile(file, uploadId, totalChunks, localId);
  }

  async function mergeChunkedFile(file, uploadId, totalChunks, localId) {
    updatePendingItem(localId, { status: 'merging' }, true);
    const mergeForm = new FormData();
    mergeForm.append('uploadId', uploadId);
    mergeForm.append('totalChunks', String(totalChunks));
    mergeForm.append('originalFileName', file.name);
    mergeForm.append('originalFileType', file.type || 'application/octet-stream');

    let attempt = 0;
    while (attempt < 20) {
      attempt++;
      const response = await authedFetch(buildUploadUrl({ chunked: 'true', merge: 'true' }), {
        method: 'POST',
        headers: getAuthHeaders(),
        body: mergeForm
      });

      if (response.ok) {
        const result = await response.json().catch(() => []);
        updatePendingItem(localId, {
          status: 'syncing',
          serverId: extractFileIdFromUploadPayload(result),
          timestamp: Date.now()
        }, true);
        return;
      }

      if (response.status !== 409) {
        throw new Error(await parseErrorResponse(response));
      }

      const pending = await response.json().catch(() => ({}));
      const retryAfterMs = Number(pending.retryAfterMs || 1000);
      updatePendingItem(localId, { status: 'merging' }, true);
      await new Promise(resolve => setTimeout(resolve, retryAfterMs));
    }

    throw new Error('分块合并超时，请稍后刷新记录确认结果');
  }

  loadConfig();
})();
</script>
</body>
</html>
